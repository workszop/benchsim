// ── RAGAS field editing ──
// Editing any field re-renders immediately (results are a live function of
// inputs - see renderRagasPanel), so the DOM contract (data-fixture-id,
// score bars) always reflects exactly what's currently typed. A full
// render() rebuilds the panel's DOM, so we restore focus/caret afterward.
function rerenderRagasPreservingFocus() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
  render();
  if (!activeId) return;
  const el = document.getElementById(activeId);
  if (el && typeof el.focus === "function") {
    el.focus();
    if (selStart !== null && typeof el.setSelectionRange === "function") {
      try { el.setSelectionRange(selStart, selEnd); } catch (e) { /* not a text field - ignore */ }
    }
  }
}

function updateRagasField(field, value) {
  const inputs = state.inputs.ragas;
  inputs[field] = value;
  inputs.fixtureId = computeRagasFixtureId(inputs, state.lang);
  rerenderRagasPreservingFocus();
}

function updateRagasContextField(index, value) {
  const inputs = state.inputs.ragas;
  inputs.context[index] = value;
  inputs.fixtureId = computeRagasFixtureId(inputs, state.lang);
  rerenderRagasPreservingFocus();
}

function applyRagasPreset(id) {
  state.inputs.ragas = cloneRagasInputs(findRagasFixture(id, state.lang));
  state.runState = "complete";
  render();
  const labelKey = ragasFixtureLabelKey(id);
  announce(t("ariaRagasPresetApplied", { preset: labelKey ? t(labelKey) : id }));
}

// "Dodaj halucynację": appends one unsupported claim to whatever answer text
// is currently loaded (preset or user-typed) - not tied to a specific preset.
function appendRagasHallucination() {
  const inputs = state.inputs.ragas;
  const sentence = MODEL.ragas.hallucinationSentence[state.lang];
  let answer = (inputs.answer || "").trim();
  if (answer && !/[.!?]$/.test(answer)) answer += ".";
  inputs.answer = answer ? answer + " " + sentence : sentence;
  inputs.fixtureId = computeRagasFixtureId(inputs, state.lang);
  state.runState = "complete";
  render();
  announce(t("ariaRagasHallucinationAdded"));
}

function runRagasEval() {
  state.runState = "complete";
  render();
  announce(t("ariaResultUpdated"));
}

function resetRagasInputs() {
  state.inputs.ragas = cloneRagasInputs(findRagasFixture("ragas-good", state.lang));
}

// ── ARES field editing ──
// Same full-render + refocus pattern as RAGAS, minus caret/selection
// handling (sliders and <select> don't have a text caret to restore).
function rerenderAresPreservingFocus() {
  const active = document.activeElement;
  const activeId = active && active.id;
  render();
  if (!activeId) return;
  const el = document.getElementById(activeId);
  if (el && typeof el.focus === "function") el.focus();
}

// Moving a slider/select only updates state.inputs.ares and re-renders (live
// value labels, n<100 note) - it does NOT recompute the experiment. That
// only happens via runAresExperiment (button / Enter) or resetAresPanel.
function updateAresField(field, value) {
  state.inputs.ares[field] = value;
  rerenderAresPreservingFocus();
}

function toggleAresFormula() {
  state.ui.aresShowFormula = !state.ui.aresShowFormula;
  rerenderAresPreservingFocus();
}

function runAresExperiment() {
  computeAresResult();
  state.runState = "complete";
  render();
  announce(t("ariaResultUpdated"));
}

function resetAresPanel() {
  resetAresInputs();
  state.runState = "idle";
  render();
  announce(t("ariaAresReset"));
}

// If the current IFEval inputs still match one of the known presets, reload
// that same preset in the new language so the demo stays coherent; a
// "custom" edit is left untranslated (there is no source text to translate).
function relocalizeIfevalFixture() {
  const inputs = state.inputs.ifeval;
  if (inputs && IFEVAL_FIXTURE_IDS.includes(inputs.fixtureId)) {
    state.inputs.ifeval = cloneIfevalInputs(findIfevalFixture(inputs.fixtureId, state.lang));
  }
}

// ── IFEval field editing ──
// Same full-render + refocus + caret-preservation pattern as RAGAS: results
// are a live function of inputs (see renderIfevalPanel), so every toggle,
// param edit or answer keystroke immediately updates the DOM contract.
function rerenderIfevalPreservingFocus() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
  render();
  if (!activeId) return;
  const el = document.getElementById(activeId);
  if (el && typeof el.focus === "function") {
    el.focus();
    if (selStart !== null && typeof el.setSelectionRange === "function") {
      try { el.setSelectionRange(selStart, selEnd); } catch (e) { /* not a text field - ignore */ }
    }
  }
}

function updateIfevalToggle(id, active) {
  state.inputs.ifeval.constraints[id].active = active;
  state.inputs.ifeval.fixtureId = computeIfevalFixtureId(state.inputs.ifeval, state.lang);
  rerenderIfevalPreservingFocus();
}

function updateIfevalParam(id, paramKey, value) {
  state.inputs.ifeval.constraints[id][paramKey] = value;
  state.inputs.ifeval.fixtureId = computeIfevalFixtureId(state.inputs.ifeval, state.lang);
  rerenderIfevalPreservingFocus();
}

function updateIfevalAnswer(value) {
  state.inputs.ifeval.answer = value;
  state.inputs.ifeval.fixtureId = computeIfevalFixtureId(state.inputs.ifeval, state.lang);
  rerenderIfevalPreservingFocus();
}

function applyIfevalPreset(id) {
  state.inputs.ifeval = cloneIfevalInputs(findIfevalFixture(id, state.lang));
  state.runState = "complete";
  render();
  const labelKey = ifevalFixtureLabelKey(id);
  announce(t("ariaIfevalPresetApplied", { preset: labelKey ? t(labelKey) : id }));
}

function runIfevalEval() {
  state.runState = "complete";
  render();
  announce(t("ariaResultUpdated"));
}

function resetIfevalInputs() {
  state.inputs.ifeval = cloneIfevalInputs(findIfevalFixture("ifeval-all", state.lang));
}

// If the current QuestEval inputs are still toggle-composed (not a manual
// edit) and match a known preset, reload that same preset in the new
// language so the demo stays coherent; a "custom" edit is left as-is (there
// is no source text to translate a free-typed edit from).
function relocalizeQuestevalFixture() {
  const inputs = state.inputs.questeval;
  if (inputs && !inputs.isCustom && QUESTEVAL_FIXTURE_IDS.includes(inputs.fixtureId)) {
    state.inputs.questeval = buildQuestevalInputsFromPreset(inputs.fixtureId, state.lang);
  }
}

// ── QuestEval field editing ──
// Same full-render + refocus + caret-preservation pattern as RAGAS/IFEval:
// results are a live function of state.inputs.questeval.targetText (see
// renderQuestevalPanel), so every toggle, hallucination click, or textarea
// keystroke immediately updates the DOM contract.
function rerenderQuestevalPreservingFocus() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
  render();
  if (!activeId) return;
  const el = document.getElementById(activeId);
  if (el && typeof el.focus === "function") {
    el.focus();
    if (selStart !== null && typeof el.setSelectionRange === "function") {
      try { el.setSelectionRange(selStart, selEnd); } catch (e) { /* not a text field - ignore */ }
    }
  }
}

// Toggling a fact always rebuilds the target text from the full toggle
// vector - including when the text was previously a manual/custom edit,
// which this click intentionally discards (see buildQuestevalToggles doc).
function updateQuestevalToggle(factId, checked) {
  const inputs = state.inputs.questeval;
  inputs.toggles[factId] = checked;
  inputs.isCustom = false;
  const fixture = MODEL.questeval.fixtures[state.lang];
  inputs.targetText = composeQuestevalTargetText(fixture, inputs.toggles, inputs.hallucinationAdded);
  inputs.fixtureId = computeQuestevalFixtureId(inputs.toggles, inputs.hallucinationAdded, state.lang);
  rerenderQuestevalPreservingFocus();
}

// "Dodaj halucynację": in toggle mode, adds the hallucination fact to the
// toggle-composed text (same rebuild path as a toggle click). In custom
// mode, appends the hallucination sentence to whatever free text is
// currently there (mirrors RAGAS's appendRagasHallucination), leaving
// fixtureId "custom" since the result is no longer purely toggle-composed.
function appendQuestevalHallucination() {
  const inputs = state.inputs.questeval;
  const fixture = MODEL.questeval.fixtures[state.lang];
  const hallFact = fixture.facts.find((f) => f.origin === "hallucination");
  if (!inputs.isCustom) {
    inputs.hallucinationAdded = true;
    inputs.targetText = composeQuestevalTargetText(fixture, inputs.toggles, true);
    inputs.fixtureId = computeQuestevalFixtureId(inputs.toggles, true, state.lang);
  } else {
    let text = (inputs.targetText || "").trim();
    if (text && !/[.!?]$/.test(text)) text += ".";
    inputs.targetText = text ? text + " " + hallFact.targetSentence : hallFact.targetSentence;
    inputs.hallucinationAdded = true;
    inputs.fixtureId = "custom";
  }
  state.runState = "complete";
  render();
  announce(t("ariaQuestevalHallucinationAdded"));
}

function updateQuestevalTargetText(value) {
  const inputs = state.inputs.questeval;
  inputs.targetText = value;
  inputs.isCustom = true;
  inputs.fixtureId = "custom";
  rerenderQuestevalPreservingFocus();
}

function applyQuestevalPreset(id) {
  state.inputs.questeval = buildQuestevalInputsFromPreset(id, state.lang);
  state.runState = "complete";
  render();
  const labelKey = questevalFixtureLabelKey(id);
  announce(t("ariaQuestevalPresetApplied", { preset: labelKey ? t(labelKey) : id }));
}

function runQuestevalEval() {
  state.runState = "complete";
  render();
  announce(t("ariaResultUpdated"));
}

function resetQuestevalInputs() {
  state.inputs.questeval = buildQuestevalInputsFromPreset("questeval-full", state.lang);
}

function isTypingTarget(el) {
  if (!el) return false;
  const tag = el.tagName;
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
}

// Keyboard shortcuts: 1-4 switch tab, R resets, L toggles language, Enter
// runs the evaluation. Ctrl+Enter always runs (even while typing); plain
// letter/digit shortcuts and Enter are ignored while a field has focus so
// typing isn't hijacked (Enter in a textarea inserts a newline).
function handleKeydown(e) {
  const typing = isTypingTarget(document.activeElement);

  if (e.key === "Enter" && e.ctrlKey) {
    e.preventDefault();
    runCurrentBench();
    return;
  }
  if (e.key === "Escape" && state.qa.open) {
    closeQaPanel();
    return;
  }
  if (typing) return;

  if (e.key >= "1" && e.key <= "4") {
    const bench = BENCHES[Number(e.key) - 1];
    if (bench) setActiveBench(bench.id);
  } else if (e.key === "r" || e.key === "R") {
    resetCurrentBench();
  } else if (e.key === "l" || e.key === "L") {
    setLang(state.lang === "pl" ? "en" : "pl");
  } else if (e.key === "Enter") {
    runCurrentBench();
  }
}

function runCurrentBench() {
  if (state.activeBench === "ragas") {
    runRagasEval();
    return;
  }
  if (state.activeBench === "ares") {
    runAresExperiment();
    return;
  }
  if (state.activeBench === "ifeval") {
    runIfevalEval();
    return;
  }
  if (state.activeBench === "questeval") {
    runQuestevalEval();
    return;
  }
}

function resetCurrentBench() {
  if (state.activeBench === "ragas") {
    resetRagasInputs();
    state.runState = "idle";
    render();
    return;
  }
  if (state.activeBench === "ares") {
    resetAresPanel();
    return;
  }
  if (state.activeBench === "ifeval") {
    resetIfevalInputs();
    state.runState = "idle";
    render();
    return;
  }
  if (state.activeBench === "questeval") {
    resetQuestevalInputs();
    state.runState = "idle";
    render();
    return;
  }
}

document.addEventListener("keydown", handleKeydown);
langBtnPlEl.addEventListener("click", () => setLang("pl"));
langBtnEnEl.addEventListener("click", () => setLang("en"));
qaButtonEl.addEventListener("click", openQaPanel);
qaCloseButtonEl.addEventListener("click", closeQaPanel);
qaOverlayEl.addEventListener("click", (e) => {
  if (e.target === qaOverlayEl) closeQaPanel();
});

// ─── Init ───

state.lang = loadLangFromStorage();
resetRagasInputs();
resetAresInputs();
resetIfevalInputs();
resetQuestevalInputs();
render();

// ?qa=1 auto-opens the QA panel and runs the suite - used by the acceptance
// sweep and by anyone sharing a direct QA link. Never touches the network.
if (new URLSearchParams(window.location.search).get("qa") === "1") {
  openQaPanel();
}
  </script>
</body>
</html>
