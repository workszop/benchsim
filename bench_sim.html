<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bench Sim - symulator ewaluacji RAG</title>
  <style>
/* ============================================================
   edulab — Colors & Type foundation (skill: edustyl)
   Fonts loaded from Google Fonts (CDN). See README "Visual
   Foundations" for substitution notes.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

:root {
  /* ---- Brand fonts ---- */
  --font-display: 'Bricolage Grotesque', 'Hanken Grotesk', system-ui, sans-serif;
  --font-sans:    'Hanken Grotesk', system-ui, -apple-system, sans-serif;
  --font-mono:    'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ============================================================
     RAW COLOR TOKENS
     ============================================================ */

  /* Paper — warm cream backgrounds (the brand never sits on pure white) */
  --paper:    #FBF7F0;   /* page background            */
  --paper-2:  #F4EDDF;   /* alternating section        */
  --paper-3:  #ECE1CF;   /* deepest cream / wells      */
  --surface:  #FFFFFF;   /* cards & sheets             */

  /* Ink — warm near-black text & lines */
  --ink:      #211E1A;   /* primary text               */
  --ink-2:    #5B554D;   /* secondary text             */
  --ink-3:    #938A7C;   /* muted / placeholder        */
  --line:     #E7DCCB;   /* hairline borders           */
  --line-2:   #D6C8B2;   /* stronger borders           */

  /* Marigold — primary brand */
  --marigold:      #E8920C;
  --marigold-600:  #CE800A;  /* hover / press          */
  --marigold-soft: #FBE7C2;  /* tint background        */
  --marigold-ink:  #8A4F00;  /* text on soft tint      */

  /* Teal — secondary brand */
  --teal:      #0E8C7F;
  --teal-600:  #0B7468;
  --teal-soft: #D2EBE6;
  --teal-ink:  #0A5A52;

  /* Coral — accent (use sparingly, for emphasis/CTAs) */
  --coral:      #EF5B3F;
  --coral-600:  #D44A30;
  --coral-soft: #FBDDD4;
  --coral-ink:  #9A2E1B;

  /* Sky — supportive, used in the learning app categories */
  --sky:      #2E78C9;
  --sky-soft: #D9E7F6;
  --sky-ink:  #1B4E88;

  /* Play palette — subject/category colours in the kids app */
  --play-sun:    #F2A516;
  --play-grass:  #4FA45C;
  --play-berry:  #C6478B;
  --play-grape:  #7A5AC2;
  --play-sky:    #2E78C9;
  --play-coral:  #EF5B3F;

  /* ---- Semantic ---- */
  --success:      #2F8F5B;  --success-soft: #D7EEDD;  --success-ink: #1C6A3E;
  --warning:      #C9810A;  --warning-soft: #FBEAC6;  --warning-ink: #855207;
  --danger:       #D8412A;  --danger-soft:  #FAD9D2;  --danger-ink:  #97271A;
  --info:         #2E78C9;  --info-soft:    #D9E7F6;  --info-ink:    #1B4E88;

  /* ---- Functional aliases ---- */
  --bg:        var(--paper);
  --fg:        var(--ink);
  --fg-muted:  var(--ink-2);
  --primary:   var(--marigold);
  --on-primary:#FFFFFF;
  --focus-ring: 0 0 0 3px rgba(232,146,12,.38);

  /* ============================================================
     SPACING  (4pt base)
     ============================================================ */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --sp-12: 48px; --sp-16: 64px; --sp-20: 80px; --sp-24: 96px;

  /* ---- Radii (friendly, generous) ---- */
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

  /* ---- Elevation — warm, low, soft ---- */
  --shadow-sm: 0 1px 2px rgba(33,30,26,.06), 0 1px 1px rgba(33,30,26,.04);
  --shadow-md: 0 4px 16px rgba(33,30,26,.08), 0 1px 3px rgba(33,30,26,.05);
  --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
  --shadow-marigold: 0 8px 22px rgba(232,146,12,.28);

  /* ============================================================
     TYPE SCALE (semantic sizes)
     ============================================================ */
  --display-font:  clamp(48px, 6vw, 72px);
  --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
  --body-lg: 18px; --body: 16px; --body-sm: 14px;
  --caption: 13px; --overline: 12px;
}

/* ============================================================
   SEMANTIC ELEMENT STYLES
   Apply via element selectors or .edu-prose wrapper.
   ============================================================ */

.edu-display, .edu h1.display {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--display-font);
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: var(--ink);
}
.edu h1, .edu-h1 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h1);
  line-height: 1.06; letter-spacing: -0.02em; color: var(--ink);
}
.edu h2, .edu-h2 {
  font-family: var(--font-display);
  font-weight: 600; font-size: var(--h2);
  line-height: 1.12; letter-spacing: -0.015em; color: var(--ink);
}
.edu h3, .edu-h3 {
  font-family: var(--font-display);
  font-weight: 600; font-size: var(--h3);
  line-height: 1.2; letter-spacing: -0.01em; color: var(--ink);
}
.edu h4, .edu-h4 {
  font-family: var(--font-sans);
  font-weight: 700; font-size: var(--h4);
  line-height: 1.3; color: var(--ink);
}
.edu p, .edu-p, .edu-body {
  font-family: var(--font-sans);
  font-weight: 400; font-size: var(--body);
  line-height: 1.6; color: var(--ink-2);
}
.edu-body-lg { font-family: var(--font-sans); font-size: var(--body-lg); line-height: 1.6; color: var(--ink-2); }
.edu-small  { font-family: var(--font-sans); font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }
.edu-caption{ font-family: var(--font-sans); font-size: var(--caption); line-height: 1.45; color: var(--ink-3); }

/* Overline / eyebrow — mono, tracked, the "lab" voice */
.edu-overline {
  font-family: var(--font-mono);
  font-weight: 500; font-size: var(--overline);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--marigold-ink);
}
.edu code, .edu-mono {
  font-family: var(--font-mono);
  font-size: 0.92em; color: var(--ink);
  background: var(--paper-3); padding: 0.12em 0.4em; border-radius: var(--r-xs);
}

body.edu { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }

/* ============================================================
   BENCH SIM - app chrome & layout
   (component recipes: ~/.claude/skills/edustyl/reference.md)
   ============================================================ */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body.edu { min-height: 100vh; }

/* ── top menu ── */
.edu-header {
  position: sticky; top: 0; z-index: 50; width: 100%;
  background: rgba(251, 247, 240, 0.85);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.edu-header-inner {
  max-width: 1100px; margin: 0 auto;
  padding: 15px 30px; display: flex; align-items: center; gap: 12px;
}
.edu-logo { width: 32px; height: 32px; display: block; flex-shrink: 0; }
.edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }
.edu-tag {
  font-family: var(--font-mono); font-weight: 500; font-size: 11px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--teal-ink);
  background: var(--teal-soft); padding: 4px 9px; border-radius: var(--r-pill);
}
.edu-header-spacer { flex: 1; }

/* ── global shortcut hint strip (chrome) ── */
.shortcut-hints {
  display: flex; align-items: center; gap: var(--sp-4);
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-3);
}
.shortcut-hints .hint-item { display: flex; align-items: center; gap: 4px; }

.lang-switch-wrap { display: flex; align-items: center; gap: 6px; }
.lang-switch { display: flex; gap: 4px; border: 1px solid var(--line-2); border-radius: var(--r-pill); padding: 3px; background: var(--surface); }
.lang-switch button {
  font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .04em;
  border: 0; background: transparent; color: var(--ink-2); padding: 5px 11px; border-radius: var(--r-pill);
  cursor: pointer; transition: background .15s ease, color .15s ease;
}
.lang-switch button[aria-pressed="true"] { background: var(--marigold); color: var(--on-primary); }
.lang-switch button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.lang-kbd-hint { margin: 0; }

/* ── shell ── */
.shell { max-width: 1100px; margin: 0 auto; padding: 34px 30px 70px; }

/* ── progress bar (top of shell) ── */
.progress-track {
  display: flex; gap: 6px; margin-bottom: var(--sp-8);
}
.progress-step {
  flex: 1; height: 6px; border-radius: var(--r-pill); background: var(--paper-3);
  overflow: hidden; position: relative;
}
.progress-step::after {
  content: ""; position: absolute; inset: 0; background: var(--marigold);
  transform: scaleX(0); transform-origin: left; transition: transform .4s cubic-bezier(.32,.72,.32,1);
}
.progress-step[data-done="true"]::after { transform: scaleX(1); }
.progress-step[data-active="true"]::after { transform: scaleX(1); background: var(--teal); }
.progress-labels {
  display: flex; justify-content: space-between; font-family: var(--font-mono);
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3);
  margin-bottom: var(--sp-10);
}

/* ── page header ── */
.page-header { text-align: center; margin-bottom: var(--sp-10); }
.page-header .edu-overline { display: block; margin-bottom: var(--sp-3); }
.app-title {
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(1.9rem, 4.2vw, 2.6rem); letter-spacing: -.025em;
  line-height: 1.05; color: var(--ink); margin: 0 0 var(--sp-4);
}
.edu-lead { font-size: 1.0625rem; color: var(--ink-2); max-width: 36rem; margin: 0 auto; line-height: 1.6; }

/* ── tabs ── */
.bench-tabs {
  display: flex; gap: var(--sp-2); flex-wrap: wrap; justify-content: center;
  margin-bottom: var(--sp-8);
}
.bench-tab {
  font-family: var(--font-display); font-weight: 600; font-size: 15px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2);
  padding: 10px 18px; border-radius: var(--r-pill); cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.bench-tab kbd { margin: 0; }
.bench-tab[aria-selected="true"] {
  background: var(--marigold); color: var(--on-primary); border-color: var(--marigold);
  box-shadow: var(--shadow-marigold);
}
.bench-tab:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* ── kbd hints ── */
kbd {
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-2);
  background: var(--paper-3); border: 1px solid var(--line-2); border-radius: var(--r-xs);
  padding: 1px 6px; line-height: 1.6;
}
.bench-tab[aria-selected="true"] kbd { background: rgba(255,255,255,.25); border-color: rgba(255,255,255,.4); color: var(--on-primary); }

/* ── sim panel: two-column layout ── */
.sim-panel { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-8); }
.sim-panel-full { grid-column: 1 / -1; }

/* ── cards ── */
.card {
  background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
  border: 1px solid var(--line); padding: 24px;
}
.card + .card { margin-top: var(--sp-6); }
.card h3 { margin-top: 0; }
.card-placeholder { text-align: center; color: var(--ink-3); }

/* ── buttons ── */
.btn {
  font-family: var(--font-display); font-weight: 600; font-size: 15px;
  border: 0; cursor: pointer; border-radius: var(--r-pill); padding: 12px 22px;
  transition: background .15s ease, transform .12s cubic-bezier(.32,.72,.32,1), color .15s ease;
}
.btn:active { transform: scale(.96); }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn-primary { background: var(--marigold); color: var(--on-primary); box-shadow: var(--shadow-marigold); }
.btn-primary:hover { background: var(--marigold-600); }
.btn-secondary { background: var(--teal-soft); color: var(--teal-ink); }
.btn-secondary:hover { background: var(--teal); color: var(--on-primary); }
.btn-ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line-2); }
.btn-ghost:hover { background: var(--paper-2); }
.btn-row { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; }

/* ── form controls ── */
label.field-label {
  display: block; font-family: var(--font-sans); font-weight: 600; font-size: 13px;
  color: var(--ink-2); margin-bottom: var(--sp-2);
}
textarea, input[type="text"], select {
  width: 100%; font-family: var(--font-sans); font-size: 14px; color: var(--ink);
  background: var(--paper); border: 1px solid var(--line-2); border-radius: var(--r-sm);
  padding: 10px 12px; resize: vertical;
}
textarea:focus-visible, input[type="text"]:focus-visible, select:focus-visible {
  outline: none; box-shadow: var(--focus-ring); border-color: var(--marigold);
}
input[type="range"] {
  width: 100%; -webkit-appearance: none; appearance: none; height: 8px;
  background: rgba(33,30,26,.12); border-radius: var(--r-pill); outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--teal); box-shadow: var(--shadow-sm); cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--teal); box-shadow: var(--shadow-sm); cursor: pointer;
}
input[type="range"]:focus-visible { box-shadow: var(--focus-ring); }

/* ── score bars ── */
.score-row { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.score-label { font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); width: 11rem; flex-shrink: 0; }
.score-track { flex: 1; height: 12px; border-radius: var(--r-pill); background: var(--paper-3); overflow: hidden; }
.score-fill { height: 100%; border-radius: var(--r-pill); transition: width .5s cubic-bezier(.32,.72,.32,1); }
.score-fill[data-status="pass"] { background: var(--success); }
.score-fill[data-status="fail"] { background: var(--danger); }
.score-fill[data-status="warn"] { background: var(--warning); }
.score-value { font-family: var(--font-mono); font-size: 13px; color: var(--ink); width: 3.4rem; text-align: right; flex-shrink: 0; }

/* ── RAGAS panel: field groups & editable context cards ── */
.field-group { margin-bottom: var(--sp-5); }
.field-group:last-child { margin-bottom: 0; }
.context-card {
  border: 1px solid var(--line-2); border-radius: var(--r-md);
  padding: 12px 14px; margin-bottom: var(--sp-3);
  background: var(--paper); transition: border-color .2s ease, background .2s ease;
}
.context-card[data-useful="true"] { border-color: var(--teal); background: var(--teal-soft); }
.context-card-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-2); margin-bottom: var(--sp-2); }
.context-card-head .field-label { margin-bottom: 0; }
.context-badge {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-3); flex-shrink: 0;
}
.context-card[data-useful="true"] .context-badge { color: var(--teal-ink); }

/* ── pass/fail rows ── */
.status-row { display: flex; align-items: center; gap: var(--sp-3); padding: 10px 0; border-bottom: 1px solid var(--line); }
.status-row:last-child { border-bottom: 0; }
.status-pill {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500; text-transform: uppercase;
  letter-spacing: .06em; padding: 3px 9px; border-radius: var(--r-pill); flex-shrink: 0;
}
.status-pill[data-status="pass"] { background: var(--success-soft); color: var(--success-ink); }
.status-pill[data-status="fail"] { background: var(--danger-soft); color: var(--danger-ink); }
.status-pill[data-status="warn"] { background: var(--warning-soft); color: var(--warning-ink); }

/* ── steps / process sequence ── */
.step-list { list-style: none; margin: 0; padding: 0; counter-reset: step; }
.step-list li {
  counter-increment: step; position: relative; padding: var(--sp-2) 0 var(--sp-2) 2.4rem;
  color: var(--ink-2); font-size: 14px; line-height: 1.5;
}
.step-list li::before {
  content: counter(step); position: absolute; left: 0; top: var(--sp-2);
  width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--teal-soft); color: var(--teal-ink);
  font-family: var(--font-mono); font-size: 12px; display: flex; align-items: center; justify-content: center;
}

/* ── ARES panel: parameter sliders, pipeline cards, bar chart ── */
.ares-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--sp-5); }
.slider-row { margin-bottom: 0; }
.slider-row-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-2); margin-bottom: var(--sp-2); }
.slider-row-head .field-label { margin-bottom: 0; }
.slider-value { font-family: var(--font-mono); font-size: 13px; color: var(--ink); flex-shrink: 0; }
.ares-actions { margin-top: var(--sp-6); }

.pipeline-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-6); margin-top: var(--sp-6); }

.ares-chart-wrap { margin-top: var(--sp-5); }
.ares-chart { display: flex; align-items: flex-end; justify-content: center; gap: var(--sp-10); height: 200px; padding: var(--sp-4) 0 0; }
.ares-bar-col { display: flex; flex-direction: column; align-items: center; height: 100%; width: 72px; }
.ares-bar-track { position: relative; width: 40px; flex: 1; background: var(--paper-3); border-radius: var(--r-sm); display: flex; align-items: flex-end; }
.ares-bar { width: 100%; border-radius: var(--r-sm); transition: height .5s cubic-bezier(.32,.72,.32,1); }
.ares-bar-truth { background: var(--teal); }
.ares-bar-judge { background: var(--coral); }
.ares-bar-ppi { background: var(--marigold); }
.ares-bar-label { margin-top: var(--sp-2); font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
.ares-bar-value { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--ink); }
.ares-whisker { position: absolute; left: 50%; transform: translateX(-50%); width: 2px; background: var(--ink); }
.ares-whisker-cap { position: absolute; left: 50%; transform: translateX(-50%); width: 14px; height: 2px; background: var(--ink); }

.formula-block {
  background: var(--paper-2); border-radius: var(--r-md); padding: 14px 18px;
  margin-top: var(--sp-4); font-family: var(--font-mono); font-size: 12.5px;
  color: var(--ink-2); line-height: 1.8; white-space: pre-wrap; overflow-x: auto;
}

/* ── IFEval panel: constraint toggles, result pills, diff view ── */
.constraint-row {
  border: 1px solid var(--line-2); border-radius: var(--r-md);
  padding: 12px 14px; margin-bottom: var(--sp-3);
  background: var(--paper); transition: border-color .2s ease, background .2s ease;
}
.constraint-row[data-active="true"] { border-color: var(--teal); background: var(--teal-soft); }
.constraint-row-head { display: flex; align-items: center; gap: 10px; }
.constraint-row-head input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--teal); cursor: pointer; flex-shrink: 0; }
.constraint-row-head label {
  font-family: var(--font-sans); font-weight: 600; font-size: 14px; color: var(--ink); cursor: pointer;
}
.constraint-param { margin-top: var(--sp-2); }
.constraint-result-pills { display: flex; gap: 6px; flex-shrink: 0; }
.diff-removed { color: var(--ink-3); text-decoration: line-through; }

/* ── interpretation note / caveat ── */
.note {
  background: var(--marigold-soft); color: var(--marigold-ink); border-radius: var(--r-md);
  padding: 14px 18px; font-size: 13.5px; line-height: 1.5; margin-top: var(--sp-4);
}
.caveat {
  background: var(--paper-2); border-left: 3px solid var(--coral); border-radius: var(--r-xs);
  padding: 12px 16px; font-size: 13px; color: var(--ink-2); line-height: 1.5; margin-top: var(--sp-4);
}

/* ── aria-live (visually hidden) ── */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ── footer ── */
.edu-footer {
  max-width: 1100px; margin: 0 auto; padding: var(--sp-6) 30px var(--sp-10);
  display: flex; justify-content: space-between; align-items: center; gap: var(--sp-4);
  border-top: 1px solid var(--line); flex-wrap: wrap;
}

/* ── interactive cards get a subtle lift, never buttons ── */
.card.interactive { transition: transform .15s cubic-bezier(.32,.72,.32,1), box-shadow .15s ease; cursor: pointer; }
.card.interactive:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

/* ── simple fade/slide for panel switches ── */
.fade-in { animation: benchFadeIn .4s cubic-bezier(.32,.72,.32,1); }
@keyframes benchFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 768px) {
  .sim-panel { grid-template-columns: 1fr; }
  .pipeline-grid { grid-template-columns: 1fr; }
  .ares-chart { gap: var(--sp-6); }
  kbd { display: none; }
  .shortcut-hints { display: none; }
  .shell { padding: 24px 16px 50px; }
  .edu-header-inner { padding: 12px 16px; }
  html, body { overflow-x: hidden; }
  .score-label { width: 7.5rem; }
}
  </style>

/**
 * Lowercase, strip punctuation and stopwords, return the remaining content
 * words. Used as a crude (non-lemmatized) basis for phrase-overlap checks.
 * @param {string} text
 * @param {"pl"|"en"} lang
 * @returns {string[]}
 */
function normalize(text, lang) {
  if (!text) return [];
  const stopwords = lang === "en" ? STOPWORDS_EN : STOPWORDS_PL;
  const raw = text
    .toLowerCase()
    .replace(/[.,!?;:()"„”«»\[\]{}\-–—/\\]/g, " ")
    .split(/\s+/)
    .filter(Boolean);
  return raw.filter((w) => !stopwords.has(w));
}

/**
 * Split text into trimmed, non-empty sentences on ., !, ? boundaries.
 * @param {string} text
 * @returns {string[]}
 */
function sentences(text) {
  if (!text) return [];
  return text
    .split(/(?<=[.!?])\s+/)
    .map((s) => s.trim())
    .filter(Boolean);
}

/**
 * Normalized words of `a` that also appear in `b` (empty array when `a` is
 * empty). Callers compare `.length` against a needed-word threshold, so this
 * returns the matching words themselves rather than a ratio.
 * @param {string[]} a
 * @param {string[]} b
 * @returns {string[]}
 */
function overlap(a, b) {
  if (!a || a.length === 0) return [];
  const bSet = new Set(b || []);
  return a.filter((w) => bSet.has(w));
}

/**
 * RAGAS heuristic: splits the answer into claims (sentences) and scores
 * three metrics against the question and retrieved context, using plain
 * word-overlap after stopword removal - no model, fully deterministic.
 * Reference implementation, see phase1-brief.md section "RAGAS".
 * @param {{question: string, context: string[], answer: string}} input
 * @param {"pl"|"en"} lang
 * @returns {{claims: string[], supported: boolean[], usefulContext: boolean[],
 *   faithfulness: number, contextRelevance: number, answerRelevance: number}}
 */
function ragasEval({ question, context, answer }, lang) {
  const qWords = normalize(question, lang);
  const claims = sentences(answer);
  const ctxWords = context.map((c) => normalize(c, lang));
  const supported = claims.map((claim) => {
    const cw = normalize(claim, lang);
    const need = Math.max(1, Math.ceil(0.6 * cw.length));
    return ctxWords.some((c) => overlap(cw, c).length >= need);
  });
  const faithfulness = claims.length ? supported.filter(Boolean).length / claims.length : 0;
  const usefulContext = ctxWords.map((c) => overlap(c, qWords).length > 0);
  const useful = usefulContext.filter(Boolean).length;
  const contextRelevance = context.length ? useful / context.length : 0;
  const aWords = new Set(normalize(answer, lang));
  const answerRelevance = qWords.length ? qWords.filter((w) => aWords.has(w)).length / qWords.length : 0;
  return { claims, supported, usefulContext, faithfulness, contextRelevance, answerRelevance };
}

/**
 * Map a 0-100 score to a pass/warn/fail status token used by score-bar and
 * status-pill DOM contract attributes.
 * @param {number} valuePct
 * @returns {"pass"|"warn"|"fail"}
 */
function scoreStatus(valuePct) {
  if (valuePct >= SCORE_PASS_THRESHOLD) return "pass";
  if (valuePct >= SCORE_WARN_THRESHOLD) return "warn";
  return "fail";
}

 * pl list's first entry if the id is unknown (should not happen in practice).

 */
function findRagasFixture(id, lang) {

  return list.find((f) => f.id === id) || list[0];
}

/**

 * (a "custom" edit, per the DOM contract, is anything that no longer does).
 * @param {{question: string, context: string[], answer: string}} inputs
 * @param {"pl"|"en"} lang
 * @returns {string} a RAGAS_FIXTURE_IDS entry, or "custom"
 */
function computeRagasFixtureId(inputs, lang) {

    const fx = findRagasFixture(id, lang);
    if (
      fx.question === inputs.question &&
      fx.answer === inputs.answer &&
      fx.context.length === inputs.context.length &&
      fx.context.every((c, i) => c === inputs.context[i])
    ) {
      return id;
    }
  }
  return "custom";
}

/**
 * IFEval tokenizer: split on whitespace, lowercase, strip edge punctuation
 * (leading/trailing non letter/number characters) from each token. Used by
 * VALIDATORS.requiredWord/forbiddenWord for whole-word matching. Never eval.
 * @param {string} r
 * @returns {string[]}
 */
function words(r) {
  if (!r) return [];
  return r
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .map((w) => w.toLowerCase().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, ""))
    .filter(Boolean);
}

/** Remove markdown emphasis markers ("*"). @param {string} s @returns {string} */
function stripMarkdownStars(s) {
  return s.replace(/\*/g, "");
}

/**
 * Drop the first line, but only when there is more than one line - on a
 * single-line answer this is a no-op (dropping the only line would always
 * collapse it to "", which is not a meaningful "loose" transformation).
 * @param {string} s @returns {string}
 */
function dropFirstLine(s) {
  const lines = s.split("\n");
  return lines.length > 1 ? lines.slice(1).join("\n") : s;
}

/** Symmetric counterpart of dropFirstLine. @param {string} s @returns {string} */
function dropLastLine(s) {
  const lines = s.split("\n");
  return lines.length > 1 ? lines.slice(0, -1).join("\n") : s;
}

/**
 * Exactly 8 IFEval loose variants of `raw`: every combination (2x2x2,
 * including the unchanged variant) of strip-markdown-stars, drop-first-line,
 * drop-last-line. Order of ops (drop lines, then strip stars) doesn't change
 * the result since "*" never spans a line boundary.
 * @param {string} raw
 * @returns {{stripStars: boolean, dropFirst: boolean, dropLast: boolean, text: string}[]}
 */
function looseVariants(raw) {
  const variants = [];
  for (const stripStars of [false, true]) {
    for (const dropFirst of [false, true]) {
      for (const dropLast of [false, true]) {
        let text = raw;
        if (dropFirst) text = dropFirstLine(text);
        if (dropLast) text = dropLastLine(text);
        if (stripStars) text = stripMarkdownStars(text);
        variants.push({ stripStars, dropFirst, dropLast, text });
      }
    }
  }
  return variants;
}

/**
 * Pure IFEval scorer (no DOM access - the QA phase calls this directly).
 * `constraints` is the list of currently active constraint instances, each
 * `{id, validator, params}` where `validator` is a VALIDATORS key. Runs
 * every validator against the raw answer (strict) and against all 8 loose
 * variants (loose passes if any variant passes), then aggregates both into
 * instruction-level (fraction passed) and prompt-level (all-or-nothing)
 * accuracy scores in [0, 1].
 * @param {{id: string, validator: string, params: Object}[]} constraints
 * @param {string} answer raw model answer text
 * @returns {{
 *   constraints: {id: string, strictPass: boolean, loosePass: boolean, passingVariantIndex: number|null}[],
 *   variants: {stripStars: boolean, dropFirst: boolean, dropLast: boolean, text: string}[],
 *   strictInstr: number, strictPrompt: number, looseInstr: number, loosePrompt: number,
 * }}
 */
function ifevalEval(constraints, answer) {
  const raw = answer || "";
  const variants = looseVariants(raw);

  const results = constraints.map((c) => {
    const validator = VALIDATORS[c.validator];
    const params = c.params || {};
    const strictPass = !!validator(raw, params);
    let loosePass = false;
    let passingVariantIndex = null;
    for (let i = 0; i < variants.length; i++) {
      if (validator(variants[i].text, params)) {
        loosePass = true;
        passingVariantIndex = i;
        break;
      }
    }
    return { id: c.id, strictPass, loosePass, passingVariantIndex };
  });

  const total = results.length;
  const strictPassed = results.filter((r) => r.strictPass).length;
  const loosePassed = results.filter((r) => r.loosePass).length;

  // With zero active constraints (total === 0), every score below is 0, not
  // a vacuous 100% - "nothing was checked" should never read as "everything
  // passed". The panel backs this with an explicit empty-state message. The
  // QA phase's reference numbers assume >=1 active constraint.
  return {
    constraints: results,
    variants,
    strictInstr: total ? strictPassed / total : 0,
    strictPrompt: total > 0 && strictPassed === total ? 1 : 0,
    looseInstr: total ? loosePassed / total : 0,
    loosePrompt: total > 0 && loosePassed === total ? 1 : 0,
  };
}

/**
 * Resolve one constraint definition + its stored instance into the
 * `{[paramKey]: value}` params object VALIDATORS expects.
 * @param {{paramKey: string|null}} def
 * @param {Object} instance
 * @returns {Object}
 */
function buildIfevalParams(def, instance) {
  if (!def.paramKey) return {};
  if (def.paramKey === "max" || def.paramKey === "n") {
    return { [def.paramKey]: Number(instance[def.paramKey]) || 0 };
  }
  return { [def.paramKey]: instance[def.paramKey] || "" };
}

/**
 * The active constraints from state.inputs.ifeval, in MODEL.ifeval.constraints
 * order, resolved into the shape ifevalEval() expects.
 * @param {{constraints: Object}} inputs
 * @returns {{id: string, validator: string, params: Object}[]}
 */
function activeIfevalConstraints(inputs) {
  return MODEL.ifeval.constraints
    .filter((def) => inputs.constraints[def.id].active)
    .map((def) => ({ id: def.id, validator: def.validator, params: buildIfevalParams(def, inputs.constraints[def.id]) }));
}

/** @param {string} paramKey @returns {string} T() key for a constraint's parameter field label */
function ifevalParamLabelKey(paramKey) {
  if (paramKey === "word") return "ifevalParamWord";
  if (paramKey === "max") return "ifevalParamMax";
  if (paramKey === "n") return "ifevalParamN";
  if (paramKey === "phrase") return "ifevalParamPhrase";
  return "";
}

/** Readable composed prompt for the currently active IFEval constraints. @param {{constraints: Object}} inputs @returns {string} */
function buildIfevalPromptText(inputs) {
  const active = activeIfevalConstraints(inputs);
  if (active.length === 0) return t("ifevalPromptEmpty");
  const parts = active.map((c) => t("ifevalConstraintText_" + c.id, c.params));
  return t("ifevalPromptIntro") + " " + parts.join("; ") + ".";
}

/** Shallow-per-key copy of a fixture's constraints object. @param {Object} constraints @returns {Object} */
function cloneIfevalConstraints(constraints) {
  const out = {};
  for (const key in constraints) out[key] = { ...constraints[key] };

/** Deep-enough copy of a fixture into the shape stored at state.inputs.ifeval. */

/** Whether `a` and `b` (constraint-instance maps) are equal on active + param value, for every known constraint type. */
function ifevalConstraintsEqual(a, b) {
  return MODEL.ifeval.constraints.every((def) => {
    const ai = a[def.id], bi = b[def.id];
    if (ai.active !== bi.active) return false;
    if (!def.paramKey) return true;
    return String(ai[def.paramKey]) === String(bi[def.paramKey]);
  });
}

 * (a "custom" edit, per the DOM contract, is anything that no longer does).
 * @param {{constraints: Object, answer: string}} inputs
 * @param {"pl"|"en"} lang
 * @returns {string} an IFEVAL_FIXTURE_IDS entry, or "custom"
 */
function computeIfevalFixtureId(inputs, lang) {
  for (const id of IFEVAL_FIXTURE_IDS) {
    const fx = findIfevalFixture(id, lang);
    if (fx.answer === inputs.answer && ifevalConstraintsEqual(fx.constraints, inputs.constraints)) {
      return id;
    }

}

/**
 * mulberry32 deterministic PRNG. Same seed -> same sequence.
 * @param {number} seed
 * @returns {() => number} generator producing floats in [0, 1)
 */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let x = Math.imul(a ^ (a >>> 15), 1 | a);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

/**
 * Unbiased Fisher-Yates shuffle (never `sort(() => rnd() - 0.5)`, which is
 * biased). Mutates and returns `arr`.
 * @param {Array} arr
 * @param {() => number} rnd generator returning [0, 1)
 * @returns {Array}
 */
function fisherYates(arr, rnd) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/** @param {number[]} xs @returns {number} */
function mean(xs) {
  if (!xs || xs.length === 0) return 0;
  return xs.reduce((s, x) => s + x, 0) / xs.length;
}

/** @param {number[]} xs @returns {number} population variance */
function variance(xs) {
  if (!xs || xs.length === 0) return 0;
  const m = mean(xs);
  return mean(xs.map((x) => (x - m) * (x - m)));
}

/** Clamp a number into [0, 1]. @param {number} x @returns {number} */
function clamp01(x) {
  if (Number.isNaN(x)) return 0;
  return Math.max(0, Math.min(1, x));
}

/**
 * ARES judge simulation for one example with hidden true label `t` (0 or 1):
 * a random-error pass, then a systematic push toward 1 for a positive
 * `biasPp` (judge overrates) or toward 0 for a negative one.
 * Reference implementation, see phase2-brief.md section "ARES".
 * @param {0|1} t hidden true label
 * @param {number} biasPp bias in percentage points; positive = judge overrates
 * @param {number} errPct random error percentage (0-100)
 * @param {() => number} rnd generator returning [0, 1)
 * @returns {0|1} judge's label
 */
function judgePrediction(t, biasPp, errPct, rnd) {
  let p1 = t === 1 ? 1 - errPct / 100 : errPct / 100; // losowy błąd
  p1 = clamp01(p1 + biasPp / 100);                    // dodatni bias pcha w stronę 1
  return rnd() < p1 ? 1 : 0;
}

/**
 * Deterministic ARES experiment: generates a synthetic population against
 * the hidden true rate for `dimension`, runs the simulated judge over all N
 * examples, draws an unbiased Fisher-Yates subset of nEff "human labels" -
 * `n` clamped to N, since the sliders allow n > N but there can never be
 * more labels than examples - and computes the Prediction-Powered
 * Inference correction (PPI), its standard error and 95% confidence
 * interval. Same `seed` + params -> identical result. Reference
 * implementation, see phase2-brief.md section "ARES" (amended: nEff
 * clamp). The returned `N`/`n` echo the actual params this result was
 * computed with (n already clamped) so callers never have to reach back
 * into the inputs that may have moved on since.
 * @param {{N: number, n: number, biasPp: number, errPct: number, dimension: string, seed: number}} params
 * @returns {{trueRate: number, truth: number[], judge: number[], idx: number[],
 *   raw: number, ppi: number, se: number, ci: {lo: number, hi: number},
 *   diffs: number[], N: number, n: number}}
 */
function aresExperiment({ N, n, biasPp, errPct, dimension, seed }) {
  const rnd = mulberry32(seed);
  const trueRate = MODEL.ares.trueRates[dimension];
  const truth = Array.from({ length: N }, () => (rnd() < trueRate ? 1 : 0));
  const judge = truth.map(t => judgePrediction(t, biasPp, errPct, rnd));
  const nEff = Math.min(n, N); // suwaki pozwalają n > N; etykiet nie może być więcej niż przykładów
  const idx = fisherYates([...Array(N).keys()], rnd).slice(0, nEff);
  const raw = mean(judge);
  const diffs = idx.map(i => truth[i] - judge[i]);
  const ppi = clamp01(raw + mean(diffs));
  const se = Math.sqrt(variance(judge) / N + variance(diffs) / nEff);
  const ci = { lo: clamp01(ppi - 1.96 * se), hi: clamp01(ppi + 1.96 * se) };
  return { trueRate, truth, judge, idx, raw, ppi, se, ci, diffs, N, n: nEff };
}

/** @returns {{N: number, n: number, biasPp: number, errPct: number, dimension: string}} a fresh copy of MODEL.ares.defaults */
function defaultAresInputs() {
  const d = MODEL.ares.defaults;
  return { N: d.N, n: d.n, biasPp: d.biasPp, errPct: d.errPct, dimension: d.dimension };
}

/** Format a 0-1 fraction as a "NN.N%" string for display. @param {number} x @returns {string} */
function fmtPct(x) {
  return (Math.round(x * 1000) / 10).toFixed(1) + "%";
}

/**
 * Status token for an ARES result row, based on how close a value sits to
 * the hidden trueRate (informational closeness, not a strict pass/fail).
 * @param {number} value @param {number} trueRate @returns {"pass"|"warn"|"fail"}
 */
function aresMetricStatus(value, trueRate) {
  const diff = Math.abs(value - trueRate);
  if (diff <= 0.03) return "pass";
  if (diff <= 0.08) return "warn";
  return "fail";
}

/** Recompute state.results.ares from state.inputs.ares with the fixed MODEL seed. */
function computeAresResult() {
  const inputs = state.inputs.ares;
  state.results.ares = aresExperiment({
    N: inputs.N, n: inputs.n, biasPp: inputs.biasPp, errPct: inputs.errPct,
    dimension: inputs.dimension, seed: MODEL.ares.defaults.seed,
  });
}

/** Restore ARES inputs/UI to defaults and recompute the result to match. */
function resetAresInputs() {
  state.inputs.ares = defaultAresInputs();
  state.ui.aresShowFormula = false;
  computeAresResult();
}

function loadLangFromStorage() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY_LANG);
    if (stored === "pl" || stored === "en") return stored;
  } catch (e) {
    // localStorage unavailable (privacy mode, file://) - fall back silently
  }
  return "pl";
}

function saveLangToStorage(lang) {
  try {
    localStorage.setItem(STORAGE_KEY_LANG, lang);
  } catch (e) {
    // ignore - persistence is a convenience, not a requirement
  }
}

/**
 * Single writer for the app-level DOM contract: state.activeBench/lang/runState
 * -> data-* attributes on <main id="app">, plus <html lang>.

function syncDomContract() {
  appEl.setAttribute("data-active-bench", state.activeBench);
  appEl.setAttribute("data-lang", state.lang);
  appEl.setAttribute("data-run-state", state.runState);
  document.documentElement.setAttribute("lang", state.lang);
}

// Progress bar: four phases (Dane -> Proces -> Wynik -> Interpretacja),
// driven by state.runState. idle -> phase 0 active; running -> phase 1
// active; complete/error -> phases 0-3 all reachable (result + interpretation shown).
function renderProgress() {
  progressTrackEl.innerHTML = "";
  const activeIndex = state.runState === "idle" ? 0
    : state.runState === "running" ? 1
    : 3; // complete or error

/**
 * RAGAS panel: two-column card layout (edit fields + presets on the left,
 * detected claims and score bars on the right). Recomputes ragasEval from
 * the current state.inputs.ragas on every call, so results are always in
 * sync with whatever the user has typed - there is no separate "stale
 * results until you press Oceń" state. Writes the panel's data-primary-score
 * / data-fixture-id contract attributes (single writer: render only).
 * @param {HTMLElement} section the panel's <section data-sim-id="ragas">
 */
function renderRagasPanel(section) {
  const inputs = state.inputs.ragas;
  const result = ragasEval({ question: inputs.question, context: inputs.context, answer: inputs.answer }, state.lang);
  state.results.ragas = result;

  const faithfulnessPct = Math.round(result.faithfulness * 100);
  section.setAttribute("data-primary-score", String(faithfulnessPct));
  section.setAttribute("data-fixture-id", inputs.fixtureId);

  const grid = document.createElement("div");
  grid.className = "sim-panel";

  const left = document.createElement("div");
  left.className = "card";
  const leftHeading = document.createElement("h3");
  leftHeading.className = "edu-h3";
  leftHeading.textContent = t("ragasInputHeading");
  left.appendChild(leftHeading);
  left.appendChild(buildRagasQuestionField(inputs));
  inputs.context.forEach((_, i) => left.appendChild(buildRagasContextField(inputs, i, result)));
  left.appendChild(buildRagasAnswerField(inputs));
  left.appendChild(buildRagasButtonRow());

  const right = document.createElement("div");
  right.className = "card";
  const rightHeading = document.createElement("h3");
  rightHeading.className = "edu-h3";
  rightHeading.textContent = t("ragasResultHeading");
  right.appendChild(rightHeading);
  right.appendChild(buildRagasClaimsList(result));
  right.appendChild(buildRagasScoreBars(result, inputs));
  const disclaimer = document.createElement("p");
  disclaimer.className = "caveat";
  disclaimer.textContent = t("ragasDisclaimer");
  right.appendChild(disclaimer);

  grid.appendChild(left);
  grid.appendChild(right);
  section.appendChild(grid);
}

function buildRagasClaimsList(result) {
  const wrap = document.createElement("div");
  wrap.className = "field-group";
  const heading = document.createElement("h4");
  heading.className = "edu-h4";
  heading.textContent = t("ragasClaimsTitle");
  wrap.appendChild(heading);

  if (result.claims.length === 0) {
    const empty = document.createElement("p");
    empty.className = "edu-small";
    empty.textContent = t("ragasClaimsEmpty");
    wrap.appendChild(empty);
    return wrap;
  }

  result.claims.forEach((claim, i) => {
    const row = document.createElement("div");
    row.className = "status-row";
    const text = document.createElement("span");
    text.className = "edu-small";
    text.textContent = claim;
    const supported = result.supported[i];
    const pill = document.createElement("span");
    pill.className = "status-pill";
    pill.setAttribute("data-status", supported ? "pass" : "fail");
    pill.textContent = supported ? t("ragasClaimSupported") : t("ragasClaimUnsupported");
    row.appendChild(text);
    row.appendChild(pill);
    wrap.appendChild(row);
  });
  return wrap;
}

function buildRagasScoreBars(result, inputs) {
  const wrap = document.createElement("div");
  wrap.className = "field-group";

  const qWords = normalize(inputs.question, state.lang);
  const aWords = new Set(normalize(inputs.answer, state.lang));
  const matched = qWords.filter((w) => aWords.has(w)).length;
  const useful = result.usefulContext.filter(Boolean).length;

  const noQuestion = !String(inputs.question || "").trim();
  const noAnswer = !String(inputs.answer || "").trim();
  const noContext = inputs.context.every((c) => !String(c || "").trim());

  const metrics = [
    {
      key: "context-relevance",
      labelKey: "ragasMetricContext",
      value: result.contextRelevance,
      explain: t("ragasExplainContext", { useful, total: inputs.context.length }),
      noData: noQuestion || noContext,
    },
    {
      key: "faithfulness",
      labelKey: "ragasMetricFaithfulness",
      value: result.faithfulness,
      explain: t("ragasExplainFaithfulness", { supported: result.supported.filter(Boolean).length, total: result.claims.length }),
      noData: noAnswer,
    },
    {
      key: "answer-relevance",
      labelKey: "ragasMetricAnswer",
      value: result.answerRelevance,
      explain: t("ragasExplainAnswer", { matched, total: qWords.length }),
      noData: noQuestion || noAnswer,
    },
  ];

  metrics.forEach((m) => {
    const pct = Math.round(m.value * 100);
    const status = scoreStatus(pct);

    const row = document.createElement("div");
    row.className = "score-row";
    row.setAttribute("data-metric", m.key);
    row.setAttribute("data-value", String(pct));
    row.setAttribute("data-status", status);

    const label = document.createElement("span");
    label.className = "score-label";
    label.textContent = t(m.labelKey);

    const track = document.createElement("div");
    track.className = "score-track";
    const fill = document.createElement("div");
    fill.className = "score-fill";
    fill.setAttribute("data-status", status);
    fill.style.width = pct + "%";
    track.appendChild(fill);

    const value = document.createElement("span");
    value.className = "score-value";
    value.textContent = pct + "%";

    row.appendChild(label);
    row.appendChild(track);
    row.appendChild(value);
    wrap.appendChild(row);

    const explain = document.createElement("p");
    explain.className = "edu-caption";
    explain.textContent = m.noData ? m.explain + " " + t("ragasNoDataNote") : m.explain;
    wrap.appendChild(explain);
  });

  return wrap;
}

/**
 * ARES panel: parameter sliders (full width), a three-card pipeline strip,
 * and a result card (score rows + bar chart + formula reveal). Unlike
 * RAGAS, results are NOT a live function of the sliders - moving a slider
 * only updates state.inputs.ares and its live-value label; the experiment
 * itself is only (re)computed by "Generuj eksperyment", Enter, or Resetuj
 * (see computeAresResult / runAresExperiment / resetAresInputs). Writes the
 * panel's data-primary-score / data-ci-lo / data-ci-hi / data-true-rate /
 * data-raw-score contract attributes (single writer: render only).
 * @param {HTMLElement} section the panel's <section data-sim-id="ares">
 */
function renderAresPanel(section) {
  const inputs = state.inputs.ares;
  const result = state.results.ares;

  if (result) {
    section.setAttribute("data-primary-score", String(Math.round(result.ppi * 100)));
    section.setAttribute("data-ci-lo", String(Math.round(result.ci.lo * 1000) / 10));
    section.setAttribute("data-ci-hi", String(Math.round(result.ci.hi * 1000) / 10));
    section.setAttribute("data-true-rate", String(Math.round(result.trueRate * 1000) / 10));
    section.setAttribute("data-raw-score", String(Math.round(result.raw * 1000) / 10));
  }

  section.appendChild(buildAresParamsCard(inputs));
  section.appendChild(buildAresPipeline(inputs, result));
  if (result) section.appendChild(buildAresResultCard(inputs, result));

  const disclaimer = document.createElement("p");
  disclaimer.className = "caveat";
  disclaimer.textContent = t("aresDisclaimer");
  section.appendChild(disclaimer);
}

function buildAresParamsCard(inputs) {
  const card = document.createElement("div");
  card.className = "card";
  const heading = document.createElement("h3");
  heading.className = "edu-h3";
  heading.textContent = t("aresParamsHeading");
  card.appendChild(heading);

  const grid = document.createElement("div");
  grid.className = "ares-controls";
  grid.appendChild(buildAresSlider("N", 100, 2000, 10, inputs.N, "aresNLabel", (v) => String(v)));
  grid.appendChild(buildAresSlider("n", 30, 300, 5, inputs.n, "aresNSmallLabel", (v) => String(v)));
  grid.appendChild(buildAresSlider("biasPp", -25, 25, 1, inputs.biasPp, "aresBiasLabel", (v) => (v > 0 ? "+" + v : String(v)) + " pp"));
  grid.appendChild(buildAresSlider("errPct", 0, 30, 1, inputs.errPct, "aresErrLabel", (v) => v + "%"));
  grid.appendChild(buildAresDimensionSelect(inputs));
  card.appendChild(grid);

  const row = document.createElement("div");
  row.className = "btn-row ares-actions";
  const runBtn = document.createElement("button");
  runBtn.type = "button";
  runBtn.className = "btn btn-primary";
  runBtn.textContent = t("aresRunButton");
  runBtn.addEventListener("click", runAresExperiment);
  const resetBtn = document.createElement("button");
  resetBtn.type = "button";
  resetBtn.className = "btn btn-ghost";
  resetBtn.textContent = t("aresResetButton");
  resetBtn.addEventListener("click", resetAresPanel);
  row.appendChild(runBtn);
  row.appendChild(resetBtn);
  card.appendChild(row);
  return card;
}

/**
 * One labelled range input with a live value readout. Field changes update
 * state immediately (input event, matching the RAGAS text-field pattern) so
 * the label and the n<100 note track the slider live - the experiment
 * itself is only recomputed on "Generuj eksperyment" / Enter / Resetuj.
 * @param {string} field key into state.inputs.ares
 * @param {number} min @param {number} max @param {number} step
 * @param {number} value current value
 * @param {string} labelKey T() key for the field label
 * @param {(v: number) => string} formatFn formats the live value readout
 */
function buildAresSlider(field, min, max, step, value, labelKey, formatFn) {
  const wrap = document.createElement("div");
  wrap.className = "slider-row";
  const head = document.createElement("div");
  head.className = "slider-row-head";
  const label = document.createElement("label");
  label.className = "field-label";
  label.setAttribute("for", "aresField" + field);
  label.textContent = t(labelKey);
  const valueSpan = document.createElement("span");
  valueSpan.className = "slider-value";
  valueSpan.textContent = formatFn(value);
  head.appendChild(label);
  head.appendChild(valueSpan);

  const input = document.createElement("input");
  input.type = "range";
  input.id = "aresField" + field;
  input.min = String(min);
  input.max = String(max);
  input.step = String(step);
  input.value = String(value);
  input.addEventListener("input", () => updateAresField(field, Number(input.value)));

  wrap.appendChild(head);
  wrap.appendChild(input);
  return wrap;
}

function buildAresDimensionSelect(inputs) {
  const wrap = document.createElement("div");
  wrap.className = "slider-row";
  const label = document.createElement("label");
  label.className = "field-label";
  label.setAttribute("for", "aresDimensionField");
  label.textContent = t("aresDimensionLabel");
  const select = document.createElement("select");
  select.id = "aresDimensionField";
  [
    ["context", "aresDimContext"],
    ["faithfulness", "aresDimFaithfulness"],
    ["relevance", "aresDimRelevance"],
  ].forEach(([value, key]) => {
    const opt = document.createElement("option");
    opt.value = value;
    opt.textContent = t(key);
    if (value === inputs.dimension) opt.selected = true;
    select.appendChild(opt);
  });
  select.addEventListener("change", () => updateAresField("dimension", select.value));
  wrap.appendChild(label);
  wrap.appendChild(select);
  return wrap;
}

/**
 * Three pipeline-stage cards. Before the first experiment run there is no
 * result yet, so each card shows a neutral placeholder instead of numbers.
 * @param {{N:number,n:number,biasPp:number,errPct:number,dimension:string}} inputs
 * @param {ReturnType<typeof aresExperiment>|null} result
 */
function buildAresPipeline(inputs, result) {
  const grid = document.createElement("div");
  grid.className = "pipeline-grid";

  const stage1 = document.createElement("div");
  stage1.className = "card";
  const h1 = document.createElement("h4");
  h1.className = "edu-h4";
  h1.textContent = t("aresStage1Title");
  const p1 = document.createElement("p");
  p1.className = "edu-small";
  if (result) {
    const pos = result.truth.filter((x) => x === 1).length;
    p1.textContent = t("aresStage1Desc", { total: result.truth.length, pos, neg: result.truth.length - pos, trueRate: fmtPct(result.trueRate) });
  } else {
    p1.textContent = t("aresStageEmpty");
  }
  stage1.appendChild(h1);
  stage1.appendChild(p1);

  const stage2 = document.createElement("div");
  stage2.className = "card";
  const h2 = document.createElement("h4");
  h2.className = "edu-h4";
  h2.textContent = t("aresStage2Title");
  const p2 = document.createElement("p");
  p2.className = "edu-small";
  if (result) {
    p2.textContent = t("aresStage2Desc", { total: result.judge.length, raw: fmtPct(result.raw) });
  } else {
    p2.textContent = t("aresStageEmpty");
  }
  stage2.appendChild(h2);
  stage2.appendChild(p2);

  const stage3 = document.createElement("div");
  stage3.className = "card";
  const h3 = document.createElement("h4");
  h3.className = "edu-h4";
  h3.textContent = t("aresStage3Title");
  const p3 = document.createElement("p");
  p3.className = "edu-small";
  if (result) {
    p3.textContent = t("aresStage3Desc", { n: result.n, ppi: fmtPct(result.ppi), se: (result.se * 100).toFixed(1) });
  } else {
    p3.textContent = t("aresStageEmpty");
  }
  stage3.appendChild(h3);
  stage3.appendChild(p3);

  grid.appendChild(stage1);
  grid.appendChild(stage2);
  grid.appendChild(stage3);
  return grid;
}

function buildAresResultCard(inputs, result) {
  const card = document.createElement("div");
  card.className = "card";
  const heading = document.createElement("h3");
  heading.className = "edu-h3";
  heading.textContent = t("aresResultHeading");
  card.appendChild(heading);

  const metricsWrap = document.createElement("div");
  metricsWrap.className = "field-group";
  [
    { key: "true-rate", labelKey: "aresTrueRateLabel", value: result.trueRate, status: "pass" },
    { key: "raw-score", labelKey: "aresRawLabel", value: result.raw, status: aresMetricStatus(result.raw, result.trueRate) },
    { key: "ppi-score", labelKey: "aresPpiLabel", value: result.ppi, status: aresMetricStatus(result.ppi, result.trueRate) },
  ].forEach((m) => {
    const pct = Math.round(m.value * 100);
    const row = document.createElement("div");
    row.className = "score-row";
    row.setAttribute("data-metric", m.key);
    row.setAttribute("data-value", String(pct));
    row.setAttribute("data-status", m.status);

    const label = document.createElement("span");
    label.className = "score-label";
    label.textContent = t(m.labelKey);
    const track = document.createElement("div");
    track.className = "score-track";
    const fill = document.createElement("div");
    fill.className = "score-fill";
    fill.setAttribute("data-status", m.status);
    fill.style.width = pct + "%";
    track.appendChild(fill);
    const value = document.createElement("span");
    value.className = "score-value";
    value.textContent = pct + "%";

    row.appendChild(label);
    row.appendChild(track);
    row.appendChild(value);
    metricsWrap.appendChild(row);
  });
  card.appendChild(metricsWrap);

  const ciP = document.createElement("p");
  ciP.className = "edu-body edu-mono";
  ciP.textContent = t("aresCiLabel") + ": " + fmtPct(result.ci.lo) + " – " + fmtPct(result.ci.hi);
  card.appendChild(ciP);

  card.appendChild(buildAresChart(result));
  card.appendChild(buildAresFormulaSection(result));

  if (inputs.n < 100) {
    const note = document.createElement("p");
    note.className = "note";
    note.textContent = t("aresLowNNote");
    card.appendChild(note);
  }

/**
 * 0-100% bar chart: truth / judge (raw) / PPI, with 95% CI whiskers drawn
 * on the PPI bar. Built from plain divs styled with tokens (no external
 * chart lib), per the brief.
 * @param {ReturnType<typeof aresExperiment>} result
 */
function buildAresChart(result) {
  const wrap = document.createElement("div");
  wrap.className = "ares-chart-wrap";
  const chart = document.createElement("div");
  chart.className = "ares-chart";

  [
    { key: "truth", cls: "ares-bar-truth", labelKey: "aresChartTruth", value: result.trueRate },
    { key: "judge", cls: "ares-bar-judge", labelKey: "aresChartJudge", value: result.raw },
    { key: "ppi", cls: "ares-bar-ppi", labelKey: "aresChartPpi", value: result.ppi },
  ].forEach((b) => {
    const col = document.createElement("div");
    col.className = "ares-bar-col";
    const track = document.createElement("div");
    track.className = "ares-bar-track";
    const bar = document.createElement("div");
    bar.className = "ares-bar " + b.cls;
    bar.style.height = clamp01(b.value) * 100 + "%";
    track.appendChild(bar);

    if (b.key === "ppi") {
      const loPct = clamp01(result.ci.lo) * 100;
      const hiPct = clamp01(result.ci.hi) * 100;
      const whisker = document.createElement("div");
      whisker.className = "ares-whisker";
      whisker.style.bottom = loPct + "%";
      whisker.style.height = Math.max(0, hiPct - loPct) + "%";
      track.appendChild(whisker);
      [loPct, hiPct].forEach((pct) => {
        const cap = document.createElement("div");
        cap.className = "ares-whisker-cap";
        cap.style.bottom = pct + "%";
        track.appendChild(cap);
      });
    }

    const label = document.createElement("span");
    label.className = "ares-bar-label";
    label.textContent = t(b.labelKey);
    const value = document.createElement("span");
    value.className = "ares-bar-value";
    value.textContent = fmtPct(b.value);

    col.appendChild(track);
    col.appendChild(label);
    col.appendChild(value);
    chart.appendChild(col);
  });

  wrap.appendChild(chart);
  return wrap;
}

/**

 * Every substituted value - including N and n - is read off `result`
 * (the params the experiment was actually computed with, `n` already

 * without a recompute, and mixing a fresh slider value with a stale

function buildAresFormulaSection(result) {

    const block = document.createElement("pre");

/**
 * Raw-vs-loose-variant diff: finds the first constraint that failed strict
 * but passed loose, and renders the raw answer with the transformation that
 * made it pass (dropped first/last line, stripped "*" markers) struck
 * through - a line is only shown as "removed" when the drop actually had an
 * effect (i.e. the raw answer has more than one line; see dropFirstLine/
 * dropLastLine), so a single-line answer never falsely appears truncated.
 * @param {ReturnType<typeof ifevalEval>} result
 * @param {{answer: string}} inputs
 */
function buildIfevalDiffView(result, inputs) {
  const wrap = document.createElement("div");
  wrap.className = "field-group";
  const heading = document.createElement("h4");
  heading.className = "edu-h4";
  heading.textContent = t("ifevalDiffHeading");
  wrap.appendChild(heading);

  const found = result.constraints.find((c) => !c.strictPass && c.loosePass && c.passingVariantIndex !== null);
  if (!found) {
    const p = document.createElement("p");
    p.className = "edu-small";
    p.textContent = t("ifevalDiffNone");
    wrap.appendChild(p);
    return wrap;
  }

  const variant = result.variants[found.passingVariantIndex];
  const pre = document.createElement("pre");
  pre.className = "formula-block";
  pre.appendChild(buildIfevalDiffContent(inputs.answer || "", variant));
  wrap.appendChild(pre);

  const caption = document.createElement("p");
  caption.className = "edu-caption";
  caption.textContent = t("ifevalDiffCaption");
  wrap.appendChild(caption);

  return wrap;
}

/**
 * Builds the diff fragment: raw text split into lines, with the dropped
 * first/last line (when the raw text has more than one line) rendered
 * struck-through, and any "*" characters struck-through when the variant
 * stripped markdown emphasis.
 * @param {string} raw
 * @param {{stripStars: boolean, dropFirst: boolean, dropLast: boolean}} variant
 * @returns {DocumentFragment}
 */
function buildIfevalDiffContent(raw, variant) {
  const frag = document.createDocumentFragment();
  const lines = raw.split("\n");
  const multiline = lines.length > 1;
  lines.forEach((line, i) => {
    const isFirst = i === 0;
    const isLast = i === lines.length - 1;
    const removedLine = multiline && ((variant.dropFirst && isFirst) || (variant.dropLast && isLast));
    const lineSpan = document.createElement("span");
    if (removedLine) {
      lineSpan.className = "diff-removed";
      lineSpan.textContent = line;
    } else if (variant.stripStars && line.includes("*")) {
      line.split("").forEach((ch) => {
        if (ch === "*") {
          const s = document.createElement("span");
          s.className = "diff-removed";
          s.textContent = ch;
          lineSpan.appendChild(s);
        } else {
          lineSpan.appendChild(document.createTextNode(ch));
        }
      });
    } else {
      lineSpan.textContent = line;
    }
    frag.appendChild(lineSpan);
    if (i < lines.length - 1) frag.appendChild(document.createElement("br"));
  });
  return frag;
}

/**
 * Push a message into the aria-live region. Clears first so the same
 * message announced twice in a row is still read by screen readers.
 */
function announce(message) {
  ariaLiveEl.textContent = "";
  window.setTimeout(() => { ariaLiveEl.textContent = message; }, 30);
}

// ── RAGAS field editing ──
// Editing any field re-renders immediately (results are a live function of
// inputs - see renderRagasPanel), so the DOM contract (data-fixture-id,
// score bars) always reflects exactly what's currently typed. A full
// render() rebuilds the panel's DOM, so we restore focus/caret afterward.
function rerenderRagasPreservingFocus() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
  render();
  if (!activeId) return;
  const el = document.getElementById(activeId);
  if (el && typeof el.focus === "function") {
    el.focus();
    if (selStart !== null && typeof el.setSelectionRange === "function") {
      try { el.setSelectionRange(selStart, selEnd); } catch (e) { /* not a text field - ignore */ }
    }
  }
}

// runs the evaluation. Ctrl+Enter always runs (even while typing); plain
// letter/digit shortcuts and Enter are ignored while a field has focus so
// typing isn't hijacked (Enter in a textarea inserts a newline).
function handleKeydown(e) {
  const typing = isTypingTarget(document.activeElement);

  if (e.key === "Enter" && e.ctrlKey) {
    e.preventDefault();
    runCurrentBench();
    return;
  }
  if (typing) return;

  if (e.key >= "1" && e.key <= "4") {
    const bench = BENCHES[Number(e.key) - 1];
    if (bench) setActiveBench(bench.id);
  } else if (e.key === "r" || e.key === "R") {
    resetCurrentBench();
  } else if (e.key === "l" || e.key === "L") {
    setLang(state.lang === "pl" ? "en" : "pl");
  } else if (e.key === "Enter") {
    runCurrentBench();
  }
}

function runCurrentBench() {
  if (state.activeBench === "ragas") {
    runRagasEval();
    return;
  }
  if (state.activeBench === "ares") {
    runAresExperiment();
    return;
  }
  if (state.activeBench === "ifeval") {
    runIfevalEval();
    return;
  }
  // Phase 0 stub for the other benches: no evaluation logic yet (added
  // per-bench in later phases).
  state.runState = "complete";
  render();
  announce(t("ariaResultUpdated"));
}

function resetCurrentBench() {
  if (state.activeBench === "ragas") {
    resetRagasInputs();
    state.runState = "idle";
    render();
    return;
  }
  if (state.activeBench === "ares") {
    resetAresPanel();
    return;
  }
  if (state.activeBench === "ifeval") {
    resetIfevalInputs();
    state.runState = "idle";
    render();
    return;
  }
  // Phase 0 stub for the other benches: no fixtures/inputs yet to reset.
  state.runState = "idle";
  render();
}

document.addEventListener("keydown", handleKeydown);
langBtnPlEl.addEventListener("click", () => setLang("pl"));
langBtnEnEl.addEventListener("click", () => setLang("en"));

// ─── Init ───

state.lang = loadLangFromStorage();
resetRagasInputs();
resetAresInputs();
resetIfevalInputs();
render();
  </script>
</body>
</html>
