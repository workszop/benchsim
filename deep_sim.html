<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BenchSim — symulator benchmarków RAG</title>
<link rel="icon" type="image/png" href="quantica-q-mark-black.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="quantica-q-mark-white.png" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --c-page:#eeedf2; --c-page-deep:#e4e1e8;
  --c-surface:#ffffff; --c-surface-soft:#faf8fb; --c-surface-raised:#f2eef3;
  --c-border:#ddd6df; --c-border-strong:#c7bcc9;
  --c-text:#18131a; --c-text-soft:#4c434e; --c-muted:#776c79;
  --c-accent:#d20757; --c-accent-hover:#a9064a; --c-accent-soft:#fdebf3;
  --c-positive:#15845f; --c-positive-soft:#e8f6f0;
  --c-negative:#b84450; --c-negative-soft:#fbecef;
  --c-warning:#a86c18; --c-warning-soft:#fff3dd;
  --c-info:#286f94; --c-info-soft:#eaf5fb;
  --c-violet:#6f56a6; --c-violet-soft:#f1ecfb;
  --c-amber:#a86c18; --c-amber-soft:#fff4df;
  --c-ink:#10151c; --c-ink-soft:#1a222d;
  --c-terminal-text:#d6dde7; --c-terminal-muted:#8290a2; --c-terminal-accent:#ff669e;
  --c-white:#ffffff; --c-overlay:rgba(24,19,26,.16); --c-shadow:rgba(24,19,26,.08);
  --font-display:'Raleway','Poppins',system-ui,sans-serif;
  --font-sans:'Poppins',system-ui,sans-serif;
  --font-mono:'Geist Mono',ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --fs-xs:.72rem; --fs-sm:.84rem; --fs-base:.96rem; --fs-md:1.05rem;
  --fs-lg:1.28rem; --fs-xl:1.7rem; --fs-2xl:2.15rem;
  --lh-tight:1.2; --lh-base:1.55;
  --space-1:.25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem;
  --space-5:1.5rem; --space-6:2rem; --space-7:3rem;
  --radius-sm:.5rem; --radius:.75rem; --radius-lg:1rem; --radius-pill:999px;
  --shadow-sm:0 1px 2px var(--c-shadow); --shadow-md:0 12px 32px var(--c-shadow);
  --content-max:1600px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
button,input,select,textarea{font:inherit}
button{color:inherit}
body{background:linear-gradient(180deg,var(--c-page),var(--c-page-deep));color:var(--c-text);font-family:var(--font-sans);font-size:var(--fs-base);line-height:var(--lh-base);min-height:100vh}
.app{width:100%;max-width:var(--content-max);margin:0 auto;padding:var(--space-5)}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-5);margin-bottom:var(--space-5);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:var(--space-3);min-width:0}
.brand img{width:34px;height:34px;flex:0 0 auto}
.brand-copy{min-width:0}
.brand h1{font-family:var(--font-display);font-size:var(--fs-xl);line-height:var(--lh-tight);margin:0;display:flex;align-items:center;gap:8px}
.brand p{color:var(--c-muted);font-size:var(--fs-sm);margin:var(--space-1) 0 0}
.top-actions{display:flex;align-items:center;gap:var(--space-2)}
.model-chip,.lang-group,.icon-button{border:1px solid var(--c-border);background:var(--c-surface);box-shadow:var(--shadow-sm)}
.model-chip{border-radius:var(--radius);padding:var(--space-2) var(--space-3);display:flex;align-items:center;gap:var(--space-2);font-size:var(--fs-sm);font-weight:600;cursor:pointer}
.model-chip:hover{border-color:var(--c-accent)}
.model-dot{width:8px;height:8px;border-radius:50%;background:var(--c-positive);box-shadow:0 0 0 3px var(--c-positive-soft)}
.lang-group{display:flex;border-radius:var(--radius);padding:3px}
.lang-group button{border:0;background:transparent;border-radius:calc(var(--radius) - 3px);padding:var(--space-2) var(--space-3);cursor:pointer;font-size:var(--fs-sm);font-weight:700}
.lang-group button.active{background:var(--c-accent);color:var(--c-white)}

/* Tabs */
.tabs-wrap{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--c-page) 76%,transparent);padding:0 0 var(--space-4);margin:0 calc(var(--space-5) * -1);padding-left:var(--space-5);padding-right:var(--space-5)}
.tabs{display:flex;gap:var(--space-2);overflow-x:auto;scrollbar-width:none;margin-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--c-border);background:var(--c-surface);border-radius:var(--radius);padding:var(--space-3) var(--space-4);display:flex;align-items:center;gap:var(--space-2);cursor:pointer;white-space:nowrap;font-family:var(--font-display);font-weight:700;box-shadow:var(--shadow-sm)}
.tab:hover{border-color:var(--c-accent)}
.tab.active{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-white)}
.tab-number{display:grid;place-items:center;width:20px;height:20px;border-radius:var(--radius-sm);background:var(--c-surface-raised);color:var(--c-muted);font-family:var(--font-mono);font-size:var(--fs-xs)}
.tab.active .tab-number{background:var(--c-overlay);color:var(--c-white)}

/* Method shell */
.method-shell{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);overflow:hidden;margin-bottom:var(--space-4)}
.method-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-5);align-items:start;padding:var(--space-6);border-bottom:1px solid var(--c-border)}
.eyebrow{display:flex;align-items:center;gap:var(--space-2);color:var(--c-accent);font-size:var(--fs-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:var(--space-2)}
.eyebrow-dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.method-title{font-family:var(--font-display);font-size:var(--fs-2xl);line-height:var(--lh-tight);margin:0}
.method-answer{color:var(--c-text-soft);font-size:var(--fs-md);max-width:780px;margin:var(--space-3) 0 0}
.mode-note{min-width:260px;max-width:340px;background:var(--c-warning-soft);border:1px solid var(--c-warning);border-radius:var(--radius);padding:var(--space-3);font-size:var(--fs-sm)}
.mode-note strong{display:block;margin-bottom:var(--space-1)}

/* Preset bar */
.preset-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);padding:var(--space-3) var(--space-6);background:var(--c-surface-soft);border-bottom:1px solid var(--c-border)}
.preset-set{display:flex;gap:var(--space-2);overflow-x:auto;scrollbar-width:none}
.preset-set::-webkit-scrollbar{display:none}
.preset{border:1px solid var(--c-border);background:var(--c-surface);border-radius:var(--radius-pill);padding:var(--space-2) var(--space-3);white-space:nowrap;cursor:pointer;font-size:var(--fs-sm);font-weight:600}
.preset.active{border-color:var(--c-accent);background:var(--c-accent-soft);color:var(--c-accent)}
.change-note{font-size:var(--fs-sm);color:var(--c-muted);text-align:left}
.change-note strong{color:var(--c-text)}

/* Canvas + shared */
.canvas{padding:var(--space-6)}
.section-title{font-family:var(--font-display);font-size:var(--fs-lg);margin:0 0 var(--space-4)}
.section-kicker{color:var(--c-muted);font-size:var(--fs-sm);margin:-.6rem 0 var(--space-4)}
.card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-4)}
.soft-card{background:var(--c-surface-soft)}
.label{display:block;color:var(--c-muted);font-size:var(--fs-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:var(--space-2)}
.status{display:inline-flex;align-items:center;gap:var(--space-1);border-radius:var(--radius-pill);padding:.22rem .55rem;font-size:var(--fs-xs);font-weight:700;white-space:nowrap}
.status.pass{background:var(--c-positive-soft);color:var(--c-positive)}
.status.fail{background:var(--c-negative-soft);color:var(--c-negative)}
.status.info{background:var(--c-info-soft);color:var(--c-info)}
.status.warn{background:var(--c-warning-soft);color:var(--c-warning)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:.22rem .55rem;border-radius:var(--radius-pill);font-size:var(--fs-xs);font-weight:700;background:var(--c-warning-soft);color:var(--c-warning);border:1px solid var(--c-warning)}

/* Reusable metric (neutral accent bar + ratio) */
.summary-rail{display:grid;gap:var(--space-3);position:sticky;top:78px;align-content:start}
.summary-card{border:1px solid var(--c-border);background:var(--c-surface-soft);border-radius:var(--radius);padding:var(--space-4)}
.summary-card h3{font-family:var(--font-display);font-size:var(--fs-md);margin:0}
.metric-value{font-family:var(--font-display);font-size:var(--fs-xl);line-height:var(--lh-tight);margin-top:var(--space-2)}
.ratio{font-family:var(--font-mono);color:var(--c-muted);font-size:var(--fs-xs);margin-top:var(--space-1)}
.neutral-track{height:8px;border-radius:var(--radius-pill);background:var(--c-surface-raised);overflow:hidden;margin-top:var(--space-3)}
.neutral-fill{height:100%;border-radius:inherit;background:var(--c-accent)}
.metric-group-label{font-size:var(--fs-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);margin:var(--space-2) 0 0}

/* Inputs */
.field-input,input[type=text],textarea,select{
  width:100%;padding:var(--space-3) var(--space-3);border:1px solid var(--c-border-strong);border-radius:var(--radius-sm);
  font-family:var(--font-mono);font-size:var(--fs-sm);line-height:var(--lh-base);background:var(--c-white);color:var(--c-text);
}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--c-accent);outline-offset:1px;border-color:var(--c-accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:var(--space-2) var(--space-4);border:1px solid var(--c-border-strong);background:var(--c-surface);border-radius:var(--radius);cursor:pointer;font-size:var(--fs-sm);font-weight:600;transition:background .12s}
.btn:hover{border-color:var(--c-accent);background:var(--c-accent-soft)}
.btn.primary{background:var(--c-accent);color:var(--c-white);border-color:var(--c-accent)}
.btn.primary:hover{background:var(--c-accent-hover)}
.btn.sm{padding:var(--space-1) var(--space-3);font-size:var(--fs-sm)}
.btn-row{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-3)}

/* Log (collapsed) */
.log-details{border-top:1px solid var(--c-border);background:var(--c-surface-soft)}
.log-details summary{cursor:pointer;padding:var(--space-4) var(--space-6);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);list-style:none}
.log-details summary::-webkit-details-marker{display:none}
.log-details summary::after{content:'+';font-family:var(--font-mono);font-size:var(--fs-lg);color:var(--c-accent)}
.log-details[open] summary::after{content:'−'}
.terminal{margin:0 var(--space-6) var(--space-6);background:var(--c-ink);color:var(--c-terminal-text);border-radius:var(--radius);padding:var(--space-4);font-family:var(--font-mono);font-size:var(--fs-sm);white-space:pre-wrap}
.terminal .muted{color:var(--c-terminal-muted)}
.terminal .accent{color:var(--c-terminal-accent)}
.terminal .ok{color:#3fb950}
.terminal .warn{color:#d29922}
.terminal .err{color:#f85149}
.terminal .hl{color:var(--c-terminal-accent)}
.terminal .ln{white-space:pre-wrap;word-break:break-word}

/* RAGAS evidence map */
.ragas-inputs{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-bottom:var(--space-5)}
.ragas-inputs .wide{grid-column:1 / -1}
.method-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.7fr);gap:var(--space-5);align-items:start}
.evidence-map{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr);gap:var(--space-3);align-items:stretch}
.evidence-column,.claims-column{display:grid;gap:var(--space-3)}
.fragment{position:relative;border:1px solid var(--c-border);border-left:4px solid var(--c-info);background:var(--c-info-soft);border-radius:var(--radius);padding:var(--space-3)}
.fragment.dimmed{border-left-color:var(--c-border-strong);background:var(--c-surface-soft);opacity:.72}
.fragment-head,.claim-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-bottom:var(--space-2);flex-wrap:wrap}
.fragment p,.claim p{font-size:var(--fs-sm);margin:0}
.match-words{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--c-info);margin-top:var(--space-2)}
.connectors{display:grid;align-content:space-around;color:var(--c-accent)}
.connector{display:flex;align-items:center}
.connector::before{content:'';height:2px;background:currentColor;flex:1}
.connector::after{content:'›';font-family:var(--font-display);font-size:var(--fs-xl);line-height:1}
.claim{border:1px solid var(--c-positive);background:var(--c-positive-soft);border-radius:var(--radius);padding:var(--space-3)}
.claim.unsupported{border-color:var(--c-negative);background:var(--c-negative-soft)}
.evidence-ref{display:flex;gap:var(--space-1);flex-wrap:wrap;margin-top:var(--space-2)}
.evidence-ref span{border-radius:var(--radius-pill);background:var(--c-white);padding:.18rem .45rem;font-size:var(--fs-xs);font-family:var(--font-mono)}
.evidence-ref .none{color:var(--c-muted);background:var(--c-surface-raised);font-style:italic}

/* ARES */
.ares-workspace{display:grid;grid-template-columns:minmax(290px,.75fr) minmax(0,1.25fr);gap:var(--space-5);align-items:start}
.control-groups{display:grid;gap:var(--space-3)}
.control-group{border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-4);background:var(--c-surface-soft)}
.control-group h3{font-family:var(--font-display);font-size:var(--fs-md);margin:0 0 var(--space-1)}
.control-group>p{color:var(--c-muted);font-size:var(--fs-xs);margin:0 0 var(--space-2)}
.slider-row{margin-top:var(--space-3)}
.slider-head{display:flex;justify-content:space-between;gap:var(--space-3);font-size:var(--fs-sm);font-weight:600}
.slider-head output,.slider-head .val{font-family:var(--font-mono);color:var(--c-accent)}
input[type=range]{width:100%;accent-color:var(--c-accent)}
.pool-card{border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-4)}
.pool-head{display:flex;justify-content:space-between;gap:var(--space-3);align-items:start;margin-bottom:var(--space-4)}
.pool-head h3{font-family:var(--font-display);font-size:var(--fs-md);margin:0}
.pool-head p{color:var(--c-muted);font-size:var(--fs-xs);margin:var(--space-1) 0 0}
.pool-dots{display:grid;grid-template-columns:repeat(20,1fr);gap:5px;margin-bottom:var(--space-4)}
.pool-dot{aspect-ratio:1;border-radius:50%;background:var(--c-info)}
.pool-dot.negative{background:var(--c-border-strong)}
.pool-dot.audited{box-shadow:0 0 0 2px var(--c-accent)}
.disagreement{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2)}
.disagreement div{border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:var(--space-2);font-size:var(--fs-xs);text-align:center}
.disagreement b{display:block;font-family:var(--font-display);font-size:var(--fs-lg)}
.numberline-card{border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-4);margin-top:var(--space-3)}
.numberline-card h3{font-family:var(--font-display);font-size:var(--fs-md);margin:0 0 var(--space-5)}
.numberline{position:relative;height:110px;margin:0 var(--space-3)}
.axis{position:absolute;left:0;right:0;top:48px;height:2px;background:var(--c-border-strong)}
.axis-tick{position:absolute;top:41px;width:1px;height:14px;background:var(--c-border-strong)}
.axis-label{position:absolute;top:64px;transform:translateX(-50%);font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--c-muted)}
.ci-band{position:absolute;top:34px;height:20px;border-radius:var(--radius-pill);background:var(--c-accent-soft);border:1px solid var(--c-accent)}
.point{position:absolute;top:31px;width:10px;height:28px;transform:translateX(-50%);border-radius:var(--radius-pill);background:var(--c-text)}
.point.raw{background:var(--c-amber)}
.point.ppi{background:var(--c-accent)}
.point.truth{background:var(--c-text)}
.point-label{position:absolute;transform:translateX(-50%);font-size:var(--fs-xs);font-weight:700;white-space:nowrap}
.point-label.truth{top:0;color:var(--c-text)}
.point-label.raw{top:84px;color:var(--c-amber)}
.point-label.ppi{top:18px;color:var(--c-accent)}
.correction-callout{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);background:var(--c-accent-soft);border-radius:var(--radius);padding:var(--space-3);margin-top:var(--space-3)}
.correction-callout b{font-family:var(--font-display);font-size:var(--fs-lg);color:var(--c-accent);white-space:nowrap}

/* IFEval */
.prompt-card{background:var(--c-ink-soft);color:var(--c-terminal-text);border-radius:var(--radius);padding:var(--space-4);font-family:var(--font-mono);font-size:var(--fs-sm);margin-bottom:var(--space-5);white-space:pre-wrap}
.prompt-card .prompt-label{color:var(--c-terminal-accent);display:block;margin-bottom:var(--space-2);font-weight:600}
.overall-gate{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-4);align-items:center;border:1px solid var(--c-negative);background:var(--c-negative-soft);border-radius:var(--radius);padding:var(--space-4);margin-bottom:var(--space-4)}
.overall-gate h3{font-family:var(--font-display);font-size:var(--fs-lg);margin:0}
.overall-gate p{color:var(--c-text-soft);font-size:var(--fs-sm);margin:var(--space-1) 0 0}
.gate-chain{display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap;justify-content:flex-end}
.gate-node{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c-positive);color:var(--c-white);font-size:var(--fs-xs);font-weight:700}
.gate-node.fail{background:var(--c-negative)}
.gate-arrow{color:var(--c-muted)}
.constraint-table{border:1px solid var(--c-border);border-radius:var(--radius);overflow:hidden}
.constraint-row{display:grid;grid-template-columns:minmax(190px,1.2fr) minmax(150px,1fr) 90px 90px;align-items:center}
.constraint-row>div{padding:var(--space-3);border-top:1px solid var(--c-border);font-size:var(--fs-sm)}
.constraint-row.header{background:var(--c-surface-raised);font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.constraint-row.header>div{border-top:0}
.constraint-name{display:flex;align-items:start;gap:var(--space-2);font-weight:600}
.category-dot{width:9px;height:9px;border-radius:50%;margin-top:.38rem;flex:0 0 auto;background:var(--c-info)}
.category-dot.forbid{background:var(--c-amber)}
.category-dot.citation{background:var(--c-violet)}
.constraint-evidence{color:var(--c-muted);font-family:var(--font-mono);font-size:var(--fs-xs)}
.result-cell{text-align:center}
.four-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3);margin-top:var(--space-4)}
.mini-metric{border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-3);background:var(--c-surface-soft)}
.mini-metric span{color:var(--c-muted);font-size:var(--fs-xs)}
.mini-metric b{display:block;font-family:var(--font-display);font-size:var(--fs-lg);margin-top:var(--space-1)}

/* QuestEval */
.text-pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);margin-bottom:var(--space-5)}
.text-card{border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-4);background:var(--c-surface-soft)}
.text-card p{font-family:var(--font-mono);font-size:var(--fs-sm);margin:0;white-space:pre-wrap}
.scope-note{display:flex;align-items:center;gap:var(--space-2);color:var(--c-info);background:var(--c-info-soft);border-radius:var(--radius);padding:var(--space-3);font-size:var(--fs-sm);margin-bottom:var(--space-4)}
.qa-lanes{display:grid;gap:var(--space-4)}
.qa-lane{border:1px solid var(--c-border);border-radius:var(--radius);overflow:hidden}
.lane-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-3) var(--space-4);background:var(--c-surface-raised)}
.lane-head h3{font-family:var(--font-display);font-size:var(--fs-md);margin:0}
.lane-head span{font-size:var(--fs-xs);color:var(--c-muted)}
.qa-row{display:grid;grid-template-columns:minmax(200px,1.3fr) minmax(110px,.7fr) 34px minmax(110px,.7fr) 86px;align-items:center;padding:var(--space-3) var(--space-4);border-top:1px solid var(--c-border);gap:var(--space-2);font-size:var(--fs-sm)}
.qa-question{font-weight:600}
.qa-answer{font-family:var(--font-mono);font-size:var(--fs-xs);padding:var(--space-2);background:var(--c-surface-soft);border-radius:var(--radius-sm)}
.qa-arrow{text-align:center;color:var(--c-accent);font-size:var(--fs-lg)}
.issue-row{background:var(--c-warning-soft)}
.quest-summary{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:var(--space-3);margin-top:var(--space-4)}
.balance-card{border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-4);background:var(--c-surface-soft)}
.balance-card.combined{border-color:var(--c-accent);background:var(--c-accent-soft)}
.balance-card span{color:var(--c-muted);font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.balance-card b{display:block;font-family:var(--font-display);font-size:var(--fs-xl);margin-top:var(--space-1)}
.balance-card p{color:var(--c-muted);font-size:var(--fs-xs);margin:var(--space-1) 0 0}

/* AI dialog */
#ai-dialog{border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:var(--space-4);max-width:420px;width:calc(100vw - 2rem);background:var(--c-surface);color:var(--c-text);font-family:var(--font-sans)}
#ai-dialog::backdrop{background:rgba(0,0,0,.45)}
#ai-dialog h2{margin:0 0 var(--space-3);font-size:20px;font-family:var(--font-display)}
.ai-providers{display:flex;gap:6px;margin-bottom:var(--space-3)}
.ai-providers button{flex:1;padding:8px 0;border:1px solid var(--c-border-strong);border-radius:var(--radius);background:var(--c-surface);cursor:pointer;font-weight:600;font-size:15px}
.ai-providers button.active{background:var(--c-accent);color:#fff;border-color:var(--c-accent)}
.ai-field{display:block;margin-bottom:var(--space-3);font-size:15px;font-weight:600}
.ai-field select,.ai-field input{width:100%;padding:8px 10px;margin-top:4px;border:1px solid var(--c-border-strong);border-radius:var(--radius);font-size:16px;background:var(--c-surface);color:var(--c-text)}
.ai-note{font-size:14px;color:var(--c-muted);margin:0 0 var(--space-2)}
.ai-actions{display:flex;justify-content:flex-end;gap:var(--space-2);margin-top:var(--space-3)}
#q-results .ai-result,#r-results .ai-result{margin-top:var(--space-3)}
.panel-disclaimer{margin-top:var(--space-4);padding:var(--space-3);border-left:4px solid var(--c-warning);background:var(--c-warning-soft);border-radius:var(--radius);font-size:var(--fs-sm);color:#7a6124}

/* Footer + QA */
.footer{display:flex;justify-content:space-between;gap:var(--space-4);color:var(--c-muted);font-size:var(--fs-xs);padding:var(--space-4) var(--space-1)}
.qa-panel{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:var(--space-4);margin-top:var(--space-4)}
.qa-item{display:flex;align-items:center;gap:var(--space-2);padding:6px 0;font-size:var(--fs-sm);border-bottom:1px dashed var(--c-border)}
.qa-item .st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px}
.qa-item.pass .st{background:var(--c-positive);color:var(--c-white)}
.qa-item.fail .st{background:var(--c-negative);color:var(--c-white)}
.fact{padding:10px 12px;border-radius:var(--radius);margin-bottom:var(--space-2);border:1px solid var(--c-border);font-size:var(--fs-sm)}
.fact .q{font-style:italic;color:var(--c-muted);margin-top:4px}
.claim.supported,.claim.unsupported{margin-bottom:4px}

@media(max-width:1050px){
  .method-layout,.ares-workspace{grid-template-columns:1fr}
  .summary-rail{position:static;grid-template-columns:repeat(3,1fr)}
  .constraint-row{grid-template-columns:minmax(170px,1.2fr) minmax(130px,1fr) 80px 80px}
}
@media(max-width:768px){
  :root{--fs-2xl:1.65rem;--fs-xl:1.4rem}
  .app{padding:var(--space-4)}
  .topbar{align-items:flex-start;margin-bottom:var(--space-4)}
  .brand img{width:28px;height:28px}
  .brand p{display:none}
  .model-chip{width:40px;height:40px;padding:0;justify-content:center}
  .model-chip .model-text{display:none}
  .tabs-wrap{margin:0 calc(var(--space-4) * -1);padding-left:var(--space-4);padding-right:var(--space-4)}
  .method-head{grid-template-columns:1fr;padding:var(--space-4)}
  .mode-note{min-width:0;max-width:none}
  .preset-bar{display:block;padding:var(--space-3) var(--space-4)}
  .change-note{margin-top:var(--space-2)}
  .canvas{padding:var(--space-4)}
  .ragas-inputs,.text-pair{grid-template-columns:1fr}
  .ragas-inputs .wide{grid-column:auto}
  .evidence-map{grid-template-columns:1fr}
  .connectors{display:none}
  .summary-rail{grid-template-columns:1fr}
  .pool-dots{grid-template-columns:repeat(10,1fr)}
  .disagreement{grid-template-columns:1fr 1fr 1fr}
  .constraint-table{overflow:visible;border:0}
  .constraint-row.header{display:none}
  .constraint-row{grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--c-border);border-radius:var(--radius);margin-bottom:var(--space-2);overflow:hidden}
  .constraint-row>div{border-top:0}
  .constraint-name,.constraint-evidence{grid-column:1 / -1}
  .constraint-evidence{border-top:1px solid var(--c-border)}
  .result-cell{border-top:1px solid var(--c-border);background:var(--c-surface-soft)}
  .four-metrics{grid-template-columns:1fr 1fr}
  .overall-gate{grid-template-columns:1fr}
  .gate-chain{justify-content:flex-start}
  .qa-row{grid-template-columns:1fr 34px 1fr 78px}
  .qa-question{grid-column:1 / -1}
  .quest-summary{grid-template-columns:1fr 1fr}
  .balance-card.combined{grid-column:1 / -1}
  .log-details summary{padding:var(--space-4)}
  .terminal{margin:0 var(--space-4) var(--space-4)}
  .footer{display:block}
  .footer>*{margin-bottom:var(--space-2)}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
  .tab,.btn,.preset{transition:none!important}
  .neutral-fill{transition:none!important}
}
</style>
</head>

    <span id="footer-meta"></span>

</main>

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const t = (key) => T[state.lang][key] || T.pl[key] || key;
const pct = (x) => Math.round(clamp01(x) * 100);
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function normalize(s){
  return String(s).toLowerCase()
    .replace(/[^a-ząćęłńóśźż0-9\s]/g, " ")
    .split(/\s+/)
    .filter(w => w && !STOPWORDS.has(w));
}
function overlap(a, b){ const s = new Set(b); return a.filter(w => s.has(w)); }
function sentences(text){ return String(text).split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean); }
// split an answer into individual claims at sentence ends, semicolons, and coordinate
// conjunctions (i / oraz / ale). Prevents a mixed true+false sentence from passing whole:
// "jest płatny i wymaga wniosku" -> two independent claims instead of one lump.
function claimClauses(text){
  return String(text)
    .replace(/([.!?])\s+/g, "$1\u0000")
    .replace(/;\s*/g, ";\u0000")
    .replace(/\s+(?:i|oraz|ale)\s+/g, "\u0000")
    .split("\u0000")
    .map(s => s.trim())
    .filter(Boolean);
}
function variance(arr){
  if(!arr.length) return 0;
  const m = arr.reduce((a,b)=>a+b,0)/arr.length;
  return arr.reduce((s,x)=>s+(x-m)*(x-m),0)/arr.length;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function announce(msg){
  const el = $("#live"); el.textContent = ""; el.textContent = msg;
}

  if(typeof s !== "object" || Array.isArray(s)) s = {};
  const provider = AI_CATALOG.providers[s.provider] ? s.provider : AI_CATALOG.defaultProvider;
  const keys = { gemini: "", openai: "", claude: "" };
  if(s.keys && typeof s.keys === "object"){ for(const p of Object.keys(keys)) if(typeof s.keys[p] === "string") keys[p] = s.keys[p]; }
  let model = typeof s.model === "string" && s.model.trim() ? s.model.trim() : "";
  if(!model) model = AI_CATALOG.providers[provider].models[0];
  return { provider, model, keys };
}
function saveAiSettings(s){ localStorage.setItem(AI_LS_KEY, JSON.stringify(s)); }

// request builders
function geminiGenerationConfig(model){
  const supported = AI_CATALOG.providers.gemini.samplingSupported ?? [];
  return supported.includes(model) ? { temperature: 0.4 } : null;
}
function buildGeminiRequest({ key, model, prompt }){
  const generationConfig = geminiGenerationConfig(model);
  return {
    url: `${GEMINI_BASE}/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`,
    headers: { "Content-Type": "application/json", "x-goog-api-key": key },
    body: { contents: [{ parts: [{ text: prompt }] }], ...(generationConfig ? { generationConfig } : {}) }
  };
}
function buildOpenAIRequest({ key, model, prompt }){
  return {
    url: "https://api.openai.com/v1/responses",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
    body: { model, input: [{ role: "user", content: [{ type: "input_text", text: prompt }] }], stream: true }
  };
}
function claudeThinking(model){
  const optional = AI_CATALOG.providers.claude.thinkingOptional ?? [];
  return optional.includes(model) ? { type: "disabled" } : null;
}
function buildClaudeRequest({ key, model, prompt }){
  return {
    url: "https://api.anthropic.com/v1/messages",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: {
      model, max_tokens: 64000, stream: true,
      ...(claudeThinking(model) ? { thinking: claudeThinking(model) } : {}),

    }
  };
}

// chunk extractors
function geminiChunk(data){ return (data.candidates?.[0]?.content?.parts ?? []).map(p => p.text ?? "").join(""); }
function openaiChunk(data){ return data.type === "response.output_text.delta" ? (data.delta ?? "") : ""; }
function claudeChunk(data){ return data.type === "content_block_delta" && data.delta?.type === "text_delta" ? (data.delta.text ?? "") : ""; }

const AI_STREAMS = {
  gemini: [buildGeminiRequest, geminiChunk],
  openai: [buildOpenAIRequest, openaiChunk],
  claude: [buildClaudeRequest, claudeChunk]
};

function providerStopReason(data){
  const raw = data?.type === "message_delta" ? data.delta?.stop_reason
    : data?.type === "response.incomplete" ? data.response?.incomplete_details?.reason
      : data?.candidates?.[0]?.finishReason;
  switch(String(raw ?? "").toLowerCase()){
    case "max_tokens": case "max_output_tokens": return "truncated";
    case "refusal": case "safety": case "recitation": case "blocklist":
    case "prohibited_content": case "content_filter": return "blocked";
    default: return "";
  }
}

function parseSseFrames(input, { final = false } = {}){
  const events = [];
  const buffer = String(input ?? "");
  const separator = /\r?\n\r?\n/g;
  let end = 0, match;
  const addFrame = frame => {
    const dataLines = [];
    let event = "message";
    for(const line of frame.split(/\r?\n/)){
      if(!line || line.startsWith(":")) continue;
      const colon = line.indexOf(":");
      const field = colon < 0 ? line : line.slice(0, colon);
      let value = colon < 0 ? "" : line.slice(colon + 1);
      if(value.startsWith(" ")) value = value.slice(1);
      if(field === "event") event = value || "message";
      if(field === "data") dataLines.push(value);
    }
    if(dataLines.length) events.push({ event, data: dataLines.join("\n") });
  };
  while((match = separator.exec(buffer))){ addFrame(buffer.slice(end, match.index)); end = match.index + match[0].length; }
  const remainder = buffer.slice(end);
  if(final && remainder){ addFrame(remainder); return { events, remainder: "" }; }
  return { events, remainder };
}

// transport — never retries POST (billing risk); bounded timeout
function makeNetworkError(url, cause){ const e = new Error("network_error", { cause }); e.code = "network_error"; try { e.host = new URL(url).host; } catch { e.host = url; } return e; }
function makeTimeoutError(ms){ const e = new Error(`Request timed out after ${Math.ceil(ms/1000)} seconds`); e.code = "timeout"; return e; }
function isAbortError(c){ return c?.name === "AbortError" || c?.name === "TimeoutError"; }
function transportError(url, cause, signal){ if(signal?.aborted) return signal.reason ?? cause; if(isAbortError(cause)) return cause; return makeNetworkError(url, cause); }
function createRequestSignal(externalSignal, timeoutMs){
  const controller = new AbortController();
  const safe = Number.isFinite(timeoutMs) && timeoutMs > 0 ? timeoutMs : AI_TIMEOUT_MS;
  const forwardAbort = () => controller.abort(externalSignal?.reason);
  if(externalSignal?.aborted) forwardAbort();
  else externalSignal?.addEventListener("abort", forwardAbort, { once: true });
  const timeoutId = setTimeout(() => controller.abort(makeTimeoutError(safe)), safe);
  return { signal: controller.signal, cleanup(){ clearTimeout(timeoutId); externalSignal?.removeEventListener("abort", forwardAbort); } };
}
async function responseError(res){
  let message = res.statusText;
  try { const p = JSON.parse(await res.text()); message = p?.error?.message ?? p?.message ?? message; } catch {}
  const e = new Error(`${res.status}: ${message}`); e.isResponseError = true; return e;
}
function makeProviderError(message, { code = "api_error" } = {}){ const e = new Error(message || "stream error"); e.code = code; return e; }
function providerErrorMessage(data, eventName = ""){
  if(eventName === "error" || data?.type === "error" || data?.type === "response.failed" || data?.error)
    return data?.error?.message ?? data?.response?.error?.message ?? data?.message ?? "stream error";
  return "";
}

async function streamSseRequest({ url, headers, body }, extractChunk, onChunk, { signal, timeoutMs = AI_TIMEOUT_MS } = {}){
  const request = createRequestSignal(signal, timeoutMs);
  let stopReason = "";
  try {
    const res = await fetch(url, { method: "POST", headers, body: JSON.stringify(body), signal: request.signal });
    if(!res.ok) throw await responseError(res);
    if(!res.body) throw makeProviderError("Provider returned no response stream");
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "", acc = "";
    const handleFrames = frames => {
      for(const frame of frames){
        const payload = frame.data.trim();
        if(!payload || payload === "[DONE]") continue;
        let data; try { data = JSON.parse(payload); } catch { continue; }
        const msg = providerErrorMessage(data, frame.event);
        if(msg) throw makeProviderError(msg);
        stopReason = providerStopReason(data) || stopReason;
        const chunk = extractChunk(data);
        if(!chunk) continue;
        acc += chunk;
        onChunk?.(acc);
      }
    };
    for(;;){
      const { done, value } = await reader.read();
      if(done) break;
      buf += decoder.decode(value, { stream: true });
      const parsed = parseSseFrames(buf);
      buf = parsed.remainder;
      handleFrames(parsed.events);
    }
    buf += decoder.decode();
    handleFrames(parseSseFrames(buf, { final: true }).events);
    if(stopReason === "blocked") throw makeProviderError("blocked", { code: "blocked" });
    return acc;
  } catch(cause){
    if(cause?.isResponseError || cause?.code === "api_error" || cause?.code === "blocked" || cause?.code === "timeout") throw cause;
    if(request.signal.aborted) throw transportError(url, cause, request.signal);
    if(isAbortError(cause)) throw cause;
    throw transportError(url, cause, request.signal);
  } finally {
    request.cleanup();
  }
}

async function runAi(prompt, onChunk){
  const s = loadAiSettings();
  const [build, extract] = AI_STREAMS[s.provider] ?? AI_STREAMS.gemini;
  return streamSseRequest(build({ key: s.keys[s.provider], model: s.model, prompt }), extract, onChunk, {});
}

// strip a wrapping fence and extract the first JSON object/array, tolerant of prose
function extractJson(text){
  const stripped = String(text).replace(/^```[a-zA-Z]*\s*/, "").replace(/```\s*$/, "").trim();
  const opens = [stripped.indexOf("{"), stripped.indexOf("[")].filter(i => i >= 0);
  if(!opens.length) return null;
  const start = Math.min(...opens);
  const open = stripped[start];
  const close = open === "{" ? "}" : "]";
  let depth = 0, inStr = false, esc = false;
  for(let i = start; i < stripped.length; i++){
    const ch = stripped[i];
    if(inStr){ if(esc) esc = false; else if(ch === "\\") esc = true; else if(ch === '"') inStr = false; continue; }
    if(ch === '"') inStr = true;
    else if(ch === open) depth++;
    else if(ch === close){ depth--; if(depth === 0){ try { return JSON.parse(stripped.slice(start, i+1)); } catch { return null; } } }
  }
  return null;
}

Return ONLY a JSON object (no markdown fence, no commentary) with exactly this shape:
{

  "answer_relevance": <0..100>

function ragasEval(inputs){
  if(!inputs || !inputs.question || !inputs.answer){
    return { empty: true };
  }
  const qWords = normalize(inputs.question);
  const rawContext = (inputs.context || []).map(c => c || "");
  const context = rawContext.map(c => normalize(c));
  const claims = claimClauses(inputs.answer).map(text => {
    const cw = normalize(text);
    // matched fragment indices (which fragments share >=2 words with the claim)
    let matched = [];
    if(cw.length){
      context.forEach((c, i) => { if(overlap(cw, c).length >= Math.min(2, cw.length)) matched.push(i); });
    }
    const supported = matched.length > 0;
    // matched terms shared between claim and its first supporting fragment
    const matchTerms = supported ? overlap(cw, context[matched[0]]) : [];
    return { text, supported, fragments: matched, matchTerms };
  });
  const supportedCount = claims.filter(c => c.supported).length;
  const faithfulness = claims.length ? supportedCount / claims.length : 0;

  // per-fragment usefulness + which claims each fragment supports
  const fragments = context.map((cw, i) => {
    const supporting = claims.filter(c => c.fragments.includes(i));
    const useful = overlap(cw, qWords).length > 0;
    return { index: i, text: rawContext[i], useful, connected: supporting.length > 0 };
  });
  const usefulFrags = fragments.filter(f => f.useful).length;
  const contextRelevance = fragments.length ? usefulFrags / fragments.length : 0;

  const ansWords = normalize(inputs.answer);
  const relevantConcepts = qWords.filter(w => ansWords.includes(w));
  const answerRelevance = qWords.length ? relevantConcepts.length / qWords.length : 0;

  return {
    empty: false, claims, faithfulness, contextRelevance, answerRelevance,
    fragments, usefulFrags, relevantConcepts, qWords, ansWords
  };
}

/* ============================ ARES ENGINE ============================ */

function aresExperiment(cfg){
  const N = +cfg.N;
  // n must never exceed the labeled pool size (the population of scored examples)
  const n = Math.min(N, +cfg.n);
  const bias = +cfg.bias, noise = +cfg.noise;
  const trueRate = +cfg.trueRate, seed = +cfg.seed;
  const dimension = cfg.dimension || "faithfulness";
  const rnd = mulberry32(seed);

  // Each evaluation dimension has its own (imagined) judge reliability. This makes the
  // dimension control real: choosing context vs faithfulness vs relevance changes the
  // judge's error profile, instead of an identical simulation every time.
  const PROFILE = {
    context:      { biasFactor: 0.3,  noiseFactor: 0.5 },  // judge reads the whole passage — stable
    faithfulness: { biasFactor: 1.0,  noiseFactor: 1.0 },  // strict claim check
    relevance:    { biasFactor: 2.2,  noiseFactor: 1.6 }   // subjective fit — noisier, more personal
  }[dimension] || { bias: 1.0, noise: 1.0 };
  const biasRate = Math.min(1, Math.max(-1, bias / 100 * PROFILE.biasFactor));
  const noiseRate = Math.min(1, Math.max(0, noise / 100 * PROFILE.noiseFactor));

  const truth = Array.from({length: N}, () => rnd() < trueRate ? 1 : 0);
  const judge = truth.map(t => {
    let j = t;
    if(rnd() < noiseRate) j = 1 - j;                       // random error
    if(t === 0 && biasRate > 0 && rnd() < biasRate) j = 1;     // over-rating
    if(t === 1 && biasRate < 0 && rnd() < -biasRate) j = 0;  // under-rating
    return j;
  });

  // deterministic-ish subset selection using seeded shuffle
  const idx = Array.from({length: N}, (_, i) => i);
  for(let i = N - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  const labeled = idx.slice(0, n);

  const raw = judge.reduce((a,b)=>a+b,0) / N;
  const correction = labeled.length
    ? labeled.reduce((s,i)=> s + (truth[i]-judge[i]), 0) / labeled.length : 0;
  const ppi = clamp01(raw + correction);

  const varJudge = variance(judge);
  const varDiff = labeled.length ? variance(labeled.map(i => truth[i]-judge[i])) : 0;
  const se = Math.sqrt(varJudge/N + (labeled.length ? varDiff/labeled.length : 0));
  const ci = { lo: clamp01(ppi - 1.96*se), hi: clamp01(ppi + 1.96*se) };

  // representative dot sample for the pool visual: truth class + audited membership
  const sampleSize = 120;
  const every = Math.max(1, Math.floor(N / sampleSize));
  const auditedSet = new Set(labeled);
  const sample = [];
  for(let i = 0; i < N; i += every) sample.push({ truth: truth[i], audited: auditedSet.has(i) });

  // agreement / false-positive / false-negative over the human-audited label set
  let agreementCount = 0, fp = 0, fn = 0;
  labeled.forEach(i => {
    if(truth[i] === judge[i]) agreementCount++;
    else if(judge[i] === 1) fp++;
    else fn++;
  });
  const disagreement = { agreement: agreementCount, falsePositive: fp, falseNegative: fn };

  return {
    N, n, bias, noise, trueRate, seed, dimension, raw, correction, ppi, ci, se, varJudge, varDiff,
    sample, disagreement, truthRate: trueRate
  };
}

const IFEVAL_CONSTRAINTS = [
  { id: "requiredWord",  labelKey: "iRequiredWord",  hasValue: true,  valueKey: "iWord" },
  { id: "forbiddenWord", labelKey: "iForbiddenWord", hasValue: true,  valueKey: "iWord" },
  { id: "maxWords",      labelKey: "iMaxWords",      hasValue: true,  valueKey: "iMax" },
  { id: "exactItems",    labelKey: "iExactItems",    hasValue: true,  valueKey: "iItems" },
  { id: "noComma",       labelKey: "iNoComma",       hasValue: false, valueKey: "" },
  { id: "validJson",     labelKey: "iValidJson",     hasValue: false, valueKey: "" },
  { id: "exactEnding",   labelKey: "iExactEnding",   hasValue: true,  valueKey: "iEnding" },
  { id: "includeTerms",  labelKey: "iInclude",       hasValue: true,  valueKey: "" },
  { id: "excludeTerms",  labelKey: "iExclude",       hasValue: true,  valueKey: "" },
  { id: "citeTerms",     labelKey: "iCitations",     hasValue: true,  valueKey: "" }
];

function ifevalCheck(id, answer, param){
  switch(id){
    case "requiredWord":  return answer.toLowerCase().split(/\s+/).includes(String(param).toLowerCase());
    case "forbiddenWord": return !answer.toLowerCase().split(/\s+/).includes(String(param).toLowerCase());
    case "maxWords":      return answer.split(/\s+/).filter(Boolean).length <= (+param);
    case "exactItems":    return answer.split("\n").filter(l => /^[-*]\s/.test(l.trim())).length === (+param);
    case "noComma":       return !answer.includes(",");
    case "validJson":     { try { JSON.parse(answer); return true; } catch(e){ return false; } }
    case "exactEnding":   return answer.trimEnd().endsWith(String(param));
    default: return false;
  }
}

function answerVariants(answer){
  const stripMd = a => a.replace(/\*/g, "");
  const dropFirst = a => a.split("\n").slice(1).join("\n");
  const dropLast = a => { const l = a.split("\n"); return l.slice(0, -1).join("\n"); };
  const variants = [];
  for(let a = 0; a < 2; a++){
    for(let b = 0; b < 2; b++){
      for(let c = 0; c < 2; c++){
        let v = answer;
        if(a) v = stripMd(v);
        if(b) v = dropFirst(v);
        if(c) v = dropLast(v);
        variants.push(v);
      }
    }
  }
  return variants;
}

function normPl(s){
  const m = { "ą":"a","ć":"c","ę":"e","ł":"l","ń":"n","ó":"o","ś":"s","ź":"z","ż":"z" };
  return String(s).toLowerCase().replace(/[ąćęłńóśźż]/g, ch => m[ch] || ch);
}
function evalIncludeTerms(answer, param){
  const a = normPl(answer);
  const groups = param.split(";").map(g => g.trim()).filter(Boolean);
  const items = groups.map(g => {
    const alts = g.split("|").map(x => x.trim()).filter(Boolean);
    return { label: g, pass: alts.some(alt => a.includes(normPl(alt))) };
  });
  return { pass: items.every(i => i.pass), items };
}
function evalExcludeTerms(answer, param){
  const a = normPl(answer);
  const groups = param.split(";").map(g => g.trim()).filter(Boolean);
  const items = groups.map(g => {
    const alts = g.split("|").map(x => x.trim()).filter(Boolean);
    return { label: g, pass: alts.every(alt => !a.includes(normPl(alt))) };
  });
  return { pass: items.every(i => i.pass), items };
}

function ifevalEval(constraints, answer){
  const active = constraints.filter(c => c.enabled);
  const variants = answerVariants(answer);
  const check = (c, text) => {
    if(c.id === "includeTerms") return evalIncludeTerms(text, c.value);
    if(c.id === "excludeTerms") return evalExcludeTerms(text, c.value);
    if(c.id === "citeTerms") return evalIncludeTerms(text, c.value);
    return { pass: ifevalCheck(c.id, text, c.value), items: null };
  };
  const strict = active.map(c => ({ id: c.id, value: c.value, ...check(c, answer) }));
  const loose = active.map(c => {
    const anyPass = variants.some(v => check(c, v).pass);
    const base = check(c, answer);
    return { id: c.id, value: c.value, pass: anyPass, items: base.items };
  });
  // instruction-level counts sub-items (each include/exclude term) for granularity
  const tally = arr => {
    let total = 0, passed = 0;
    arr.forEach(r => {
      if(r.items && r.items.length){ total += r.items.length; passed += r.items.filter(i => i.pass).length; }
      else { total += 1; passed += r.pass ? 1 : 0; }
    });
    return { total, passed };
  };
  const s = tally(strict), l = tally(loose);
  return {
    strict, loose,
    strictInstr: s.total ? s.passed / s.total : 1,
    strictPrompt: strict.every(c => c.pass) ? 1 : 0,
    looseInstr: l.total ? l.passed / l.total : 1,
    loosePrompt: loose.every(c => c.pass) ? 1 : 0,
    activeCount: active.length
  };
}

/* ============================ QUESTEVAL ENGINE ============================ */

function questevalEval(source, target, facts){
  const norm = s => String(s).toLowerCase().replace(/[^a-ząćęłńóśźż0-9\s]/g, " ").replace(/\s+/g, " ").trim();
  const src = norm(source), tgt = norm(target);
  const inTarget = f => f.accepted.some(a => tgt.includes(norm(a)));
  const inSource = f => f.accepted.some(a => src.includes(norm(a)));

  // forward: source facts retained in the target -> completeness
  const forward = facts.filter(f => f.origin === "src").map(f => ({ ...f, found: inTarget(f) }));
  const completeness = forward.length ? forward.filter(f=>f.found).length / forward.length : 0;

  // backward: EVERY claim present in the target, grounded in the source -> faithfulness
  // A claim is "present" when any accepted term occurs. Free-text additions (e.g. a made-up
  // colour) are not matched, so this is an explicit closed-set proxy rather than full QA.
  const present = facts.filter(f => inTarget(f));
  const backward = present.map(f => ({ ...f, found: inSource(f) }));
  // empty/short target: no claims to ground -> an INVALID score (N/A), never a silent 100%
  const faithfulness = backward.length ? backward.filter(f=>f.found).length / backward.length : null;

  // combined: undefined when either side is invalid
  const combined = (faithfulness === null || completeness === 0 && faithfulness === 0) ? null
    : 2 * completeness * faithfulness / (completeness + faithfulness);

  return { forward, backward, completeness, faithfulness, combined };
}

  if(det) det.open = true;

function termWrite(text, cls){
  const l = $("#term-log"); if(!l) return;
  const el = document.createElement("div");
  el.className = "ln " + (cls||"");
  el.textContent = text || "\u00A0";

function runProcess(lines, animate){
  const runId = termReset();
  const arr = lines || [];
  if(!animate){
    arr.forEach(([txt,cls]) => termWrite(txt, cls));
    return;
  }
  arr.forEach(([txt,cls],i) => setTimeout(() => { if(runId===state.runId) termWrite(txt, cls); }, 160*(i+1)));
  setTimeout(() => { if(runId===state.runId) termWrite("✓ " + t("termDone"), "hl"); }, 160*(arr.length+1));
}

// per-bench terminal log builders — derived from the real evaluation result
function ragasLog(r){
  if(!r || r.empty) return [["! " + t("rNoData"), "err"]];
  const L = [["$ ragas evaluate --reference-free", "accent"], ["", "dim"]];
  r.claims.forEach((c,i) => {
    L.push([`claim ${i+1}: ${c.text}`, "ok"]);
    L.push([`   ${c.supported ? "supported ✔ "+c.fragments.map(f=>"frag"+(f+1)).join(",") : "NOT supported ✗ ("+t("noSupport")+")"}`, c.supported ? "ok" : "err"]);
  });
  L.push([`context_relevance = ${pct(r.contextRelevance)}%  (${r.usefulFrags}/${r.fragments.length} useful)`, "dim"]);
  L.push([`faithfulness      = ${pct(r.faithfulness)}%`, r.faithfulness >= 0.8 ? "ok" : "warn"]);
  L.push([`answer_relevance  = ${pct(r.answerRelevance)}%`, r.answerRelevance >= 0.8 ? "ok" : "warn"]);
  return L;
}
function aresLog(r){
  if(!r) return [["! error", "err"]];
  return [
    [`$ ares experiment --seed=${r.seed}`, "accent"], ["", "dim"],
    [`[1/${t("stSynthetic")}] ${r.N} examples (positive + negative)`, "dim"],
    [`[2/${t("stJudge")}] scored pool → raw mean = ${(r.raw*100).toFixed(1)}% (dim: ${r.dimension})`, "ok"],
    [`[3/${t("stHuman")}] ${r.n} labels → disagreement ${r.disagreement.falsePositive}/${r.disagreement.falseNegative} (fp/fn)`, r.disagreement.falsePositive+r.disagreement.falseNegative ? "warn" : "ok"],
    [`PPI = raw + correction = ${(r.ppi*100).toFixed(1)}%`, "hl"],
    [`95% CI = [${(r.ci.lo*100).toFixed(1)}%, ${(r.ci.hi*100).toFixed(1)}%]`, "dim"]
  ];
}
function ifevalLog(r){
  if(!r || r.activeCount === 0) return [["! no active instructions", "err"]];
  const L = [["$ ifeval check", "accent"], ["", "dim"]];
  r.strict.forEach(c => {
    const nameKey = c.id === "includeTerms" ? "iInclude" : c.id === "excludeTerms" ? "iExclude" : "iCitations";
    L.push([`${t(nameKey)}:`, "dim"]);
    L.push([`  strict → ${c.pass ? "PASS" : "FAIL"}   loose → ${r.loose.find(x=>x.id===c.id).pass ? "PASS" : "FAIL"}`, c.pass ? "ok" : "err"]);
  });
  L.push([`strict instr = ${pct(r.strictInstr)}% · prompt = ${r.strictPrompt?t("pass"):t("fail")}`, "dim"]);
  L.push([`loose  instr = ${pct(r.looseInstr)}% · prompt = ${r.loosePrompt?t("pass"):t("fail")}`, r.loosePrompt?"ok":"warn"]);
  return L;
}
function questLog(r){
  if(!r) return [["! error", "err"]];
  const L = [["$ questeval compare --bidirectional", "accent"], ["", "dim"]];
  L.push(["forward: source questions → target text", "dim"]);
  r.forward.forEach(f => L.push([`  ${f.id}: ${f.found ? "retained ✔" : "MISSING ✗"}`, f.found ? "ok" : "warn"]));
  L.push([`  completeness = ${pct(r.completeness)}%`, "hl"]);
  L.push(["backward: target claims → source", "dim"]);
  (r.backward||[]).forEach(f => L.push([`  ${f.id}: ${f.found ? "grounded ✔" : "hallucination ✗"}`, f.found ? "ok" : "err"]));
  L.push([`  faithfulness = ${r.faithfulness === null ? t("na") : pct(r.faithfulness)+"%"}`, r.faithfulness === null ? "warn" : "hl"]);
  L.push([`combined (harmonic mean) = ${r.combined === null ? t("na") : pct(r.combined)+"%"}`, "dim"]);
  return L;
}

                <span class="point-label ppi">${t("ppi")} ${li(d.ppi)}</span>
              </div>
              <div class="correction-callout"><span>${t("correctionAudit")}<br><small>${fmt("uncertainty",{lo:li(d.ci.lo),hi:li(d.ci.hi)})}</small></span><b>${(d.correction*100).toFixed(1)} pp</b></div>
    </section>`;
  return `
    <div class="equiv">${follows}</div>
    ${state.showCalc ? formulaHtml(d) : ""}`;
}
function ciLeft(ci){ return ci.lo*100; }

function formulaHtml(r){
  return `<div class="formula">${t("aFormulaTitle")}
raw          = ${r.raw.toFixed(2)}%  (średnia judge'a, N = ${r.N})
korekta      = ${r.correction.toFixed(2)}%  (śr. human − judge, n = ${r.n})
var(judge)   = ${r.varJudge.toFixed(4)}
var(różnica) = ${r.varDiff.toFixed(4)}
SE = sqrt(${r.varJudge.toFixed(4)}/${r.N} + ${r.varDiff.toFixed(4)}/${r.n}) = ${r.se.toFixed(4)}
95% CI = PPI ± 1.96 × SE = [${(r.ci.lo*100).toFixed(1)}%, ${(r.ci.hi*100).toFixed(1)}%]</div>`;
}

function ifevalConstraints(){
  return [
    { id: "includeTerms", enabled: true, value: MODEL.ifeval.include.join(";") },
    { id: "excludeTerms", enabled: true, value: MODEL.ifeval.exclude.join(";") },
    { id: "citeTerms",    enabled: true, value: MODEL.ifeval.citations.join(";") }
  ];
}
function buildIfevalPrompt(){
  const inc = MODEL.ifeval.include.map(g => g.split("|").join(" lub ")).join("; ");
  const exc = MODEL.ifeval.exclude.map(g => g.split("|").join(" lub ")).join("; ");
  const cit = MODEL.ifeval.citations.join(", ");
  return `Odpowiedz na pytanie: ${MODEL.ifeval.task}\n\nUwzględnij w odpowiedzi: ${inc}.\nZacytuj podstawę prawną: ${cit}.\nNie uwzględniaj: ${exc}.`;
}

function renderIfeval(){

    <div class="btn-row">

    </div>

    <div id="i-results"><p class="metric-group-label">${t("iIntro")}</p></div>
    <div class="panel-disclaimer">${t("iDisclaimer")}</div>`;

function renderIfevalResults(r){
  if(r.activeCount === 0) return `<p class="metric-group-label">${t("iIntro")}</p>`;
  const overall = r.strictPrompt ? "overallPass" : "overallFail";
  const overallCls = r.strictPrompt ? "pass" : "fail";
  const explain = r.strictPrompt ? t("overallPassExpl") : fmt("overallFailExpl", { p: r.strictInstr<1 ? r.strictInstr.toFixed(0) : 0 });

  // gate chain of constraint pass/fail
  const chain = r.strict.map((c, i) => `<span class="gate-node ${c.pass?'':'fail'}">${c.pass?'✓':'×'}</span>`).join('<span class="gate-arrow">+</span>');
  const gateChain = `<span class="gate-arrow">→</span>${statusHtml(r.strictPrompt)}`;

  // evidence matrix: constraint | evidence | strict | loose
  const matrixRows = r.strict.map((c, i) => {
    const loose = r.loose[i];
    const nameKey = c.id === "includeTerms" ? "iInclude" : c.id === "excludeTerms" ? "iExclude" : "iCitations";
    const category = c.id === "excludeTerms" ? "forbid" : c.id === "citeTerms" ? "citation" : "";
    // evidence — expose matched text or "not found"
    let evidence = esc(c.id) + ":";
    if(c.items && c.items.length){
      const detail = c.items.filter(it => it.pass).map(it => it.label.split("|").join(" / ")).join(", ")
        || t("evidenceNotFound");
      evidence = detail;
    } else {
      evidence = c.pass ? t("evidenceFound") : t("evidenceNotFound");
    }
    return `<div class="constraint-row" data-constraint-id="${c.id}" data-strict-pass="${c.pass}" data-loose-pass="${loose.pass}">
      <div class="constraint-name"><span class="category-dot ${category}"></span><span>${t(name)}</span></div>
      <div class="constraint-evidence">${evidence}</div>
      <div class="result-cell">${statusHtml(c.pass)}</div>
      <div class="result-cell">${statusHtml(loose.pass)}</div>
    </div>`;
  }).join("");

  const four = [
    { k: t("instStrict"), v: r.strictInstr, m: "strict-instr" },
    { k: t("promptStrict"), v: r.strictPrompt, m: "strict-prompt" },
    { k: t("instLoose"), v: r.looseInstr, m: "loose-instr" },
    { k: t("promptLoose"), v: r.loosePrompt, m: "loose-prompt" }
  ].map(x => `<div class="mini-metric" data-metric="${x.m}" data-value="${x.v.toFixed(3)}"><span>${x.k}</span><b>${pct(x.v)}%</b></div>`).join("");

  return `
    <div class="overall-gate ${overallCls}">
      <div><h3>${t(overall)}</h3><p>${explain}</p></div>
      <div class="gate-chain" aria-label="constraint chain">${chain}${gateChain}</div>
    </div>
    <div class="constraint-table">
      <div class="constraint-row header"><div>${t("constraint")}</div><div>${t("evidence")}</div><div>${t("strictC")}</div><div>${t("looseC")}</div></div>
      ${matrixRows}
    </div>
    <div class="four-metrics">${four}</div>`;
}

function qaRowHtml(factId, question, srcMatch, tgtMatch, pass, issue){
  return `<div class="qa-row ${issue?'issue-row':''}" data-direction="b" data-fact-id="${factId}" data-match="${pass}">
    <div class="qa-question">${esc(question)}</div>

    <div class="qa-answer">${esc(tgtMatch)}</div>

function qaLaneHtml(titleKey, subKey, rows){
  return `<section class="qa-lane">
    <div class="lane-head"><div><h3>${t(titleKey)}</h3><span>${t(subKey)}</span></div><span>${t("nonEmpty")||""}</span></div>

    ${rows}
  </section>`;
}

function renderQuestResults(r){
  if(!r) return `<p class="metric-group-label">${t("qIntro")}</p>`;
  const qa = (f) => {
    const issue = !f.found;
    // forward (src origin): src shows gold, target shows found-fragment or "no info"
    // backward (tgt origin): target shows the claim's gold, source shows whether grounded
    return qaRowHtml(f.id, f.question, f.gold, f.found ? f.gold : t("qMissingLabel"), f.found, issue);
  };
  const completeness = pct(r.completeness);
  const grounded = (r.faithfulness === null) ? t("na") : `${pct(r.faithfulness)}%`;
  const combined = (r.combined === null) ? t("na") : `${pct(r.combined)}%`;
  const fwdOk = r.forward.filter(f=>f.found).length;
  const bwdArr = r.backward || [];
  const bwdOk = bwdArr.filter(f=>f.found).length;

  return `
    <div class="scope-note"><span>ⓘ</span><span>${t("determinScope")}</span></div>
    <div class="qa-lanes">
      ${qaLaneHtml("sourceToTarget","s2tSub", r.forward.map(f => qa(f)).join(""))}
      ${qaLaneHtml("targetToSource","t2sSub", bwdArr.map(f => qa(f)).join(""))}
    </div>
    <div class="quest-summary">
      <div class="balance-card"><span>${t("balanceCompleteness")}</span><b>${completeness}%</b><p>${fwdOk} / ${r.forward.length} ${t("retainedCount")||""}</p></div>
      <div class="balance-card"><span>${t("balanceGrounded")}</span><b>${grounded}</b><p>${bwdArr.length?`${bwdOk} / ${bwdArr.length}`:t("na")}</p></div>
      <div class="balance-card combined"><span>${t("balanceCombined")}</span><b>${combined}</b><p>${t("qBalanceExplain")}</p></div>
    </div>`;
}
function emptyHtml(){ return ""; }

/* ============================ RENDER DISPATCH ============================ */

function renderSim(){
  state.runId = (state.runId||0)+1;  // cancel stale animations
  const s = $("#sim"); if(!s) return;
  let html = "";
  if(state.activeBench === "ragas") html = renderRagas();
  else if(state.activeBench === "ares") html = renderAres();
  else if(state.activeBench === "ifeval") html = renderIfeval();
  else if(state.activeBench === "questeval") html = renderQuestEval();
  s.innerHTML = html;
}


/* ============================ EVALUATE ============================ */

function evaluate(animate){
  if(animate === undefined) animate = true;
  state.runState = "running";
  syncContract();
  let result = null, lines = [];

  if(state.activeBench === "ragas"){
    const inputs = {
      question: $("#r-question").value,
      context: [0,1,2].map(i => $("#r-ctx-"+i).value),
      answer: $("#r-answer").value
    };
    result = ragasEval(inputs);
    state.results.ragas = result;
    lines = ragasLog(result);
  }
  else if(state.activeBench === "ares"){
    const cfg = {
      N: +$("#a-N").value, n: +$("#a-n").value,
      bias: +$("#a-bias").value, noise: +$("#a-noise").value,
      trueRate: (+$("#a-true").value)/100, seed: MODEL.ares.defaults.seed,
      dimension: $("#a-dim").value
    };
    result = aresExperiment(cfg);
    state.results.ares = result;
    lines = aresLog(result);
  }
  else if(state.activeBench === "ifeval"){
    const answer = $("#i-answer").value;
    result = ifevalEval(ifevalConstraints(), answer);
    state.results.ifeval = result;
    lines = ifevalLog(result);
  }
  else if(state.activeBench === "questeval"){
    const source = MODEL.questeval.source;          // source text is a fixed reference card
    const target = $("q-target") ? $("#q-target").value : "";
    result = questevalEval(source, target, MODEL.questeval.facts);
    state.results.questeval = result;
    lines = questLog(result);
  }

  state.runState = "complete";
  renderShell();
  updateResults();
  runProcess(lines, animate);
  syncContract();
  announce(t("stepResult"));
}

function updateResults(){
  if(state.activeBench === "ragas" && state.results.ragas && $("#r-results"))
    $("#r-results").innerHTML = renderRagasResults(state.results.ragas);
  else if(state.activeBench === "ares" && state.results.ares && $("#a-results"))
    $("#a-results").innerHTML = renderAresResults(state.results.ares);
  else if(state.activeBench === "ifeval" && state.results.ifeval && $("#i-results"))
    $("#i-results").innerHTML = renderIfevalResults(state.results.ifeval);
  else if(state.activeBench === "questeval" && state.results.questeval && $("#q-results"))
    $("#q-results").innerHTML = renderQuestResults(state.results.questeval);
}

function loadDefault(){
  const id = state.activeBench;
  const start = {
    ragas: "good",
    ares: "baseline",
    ifeval: "good",
    questeval: "full"
  };
  // use the stored active preset (falls back to the per-bench default)
  const preset = state.activePreset[id] || start[id];
  applyPreset(preset);
  syncLabels();
}

function captureInputs(){
  const snap = {};
  $$("#sim input, #sim textarea, #sim select").forEach(el => {
    if(!el.id) return;
    snap[el.id] = el.type === "checkbox" ? el.checked : el.value;
  });
  return snap;
}
function restoreInputs(snap){
  $$("#sim input, #sim textarea, #sim select").forEach(el => {
    if(!(el.id in snap)) return;
    if(el.type === "checkbox") el.checked = snap[el.id];
    else el.value = snap[el.id];
  });
}

function syncLabels(){
  if(state.activeBench === "ares"){
    ["a-N","a-n","a-bias","a-noise","a-true"].forEach(id => {
      const v = $("#"+id+"-v");
      if(!v) return;
      if(id === "a-noise") v.textContent = $("#"+id).value + "%";
      else if(id === "a-true") v.textContent = $("#"+id).value + "%";
      else v.textContent = $("#"+id).value;
    });
  }
}

function syncContract(){
  const app = $("#app");
  app.dataset.activeBench = state.activeBench;
  app.dataset.lang = state.lang;
  app.dataset.runState = state.runState;
}

/* ============================ PRESETS ============================ */

function applyPreset(preset){
  state.activePreset[state.activeBench] = preset;

  if(state.activeBench === "ragas"){
    const f = MODEL.ragas.fixtures[preset] || MODEL.ragas.fixtures.good;
    $("#r-question").value = f.question;
    (f.context||[]).forEach((c,i) => { const el = $("#r-ctx-"+i); if(el) el.value = c; });
    $("#r-answer").value = f.answer;
    evaluate();
  }
  else if(state.activeBench === "ares"){
    // preset adjusts judge/human settings relative to defaults
    const ADJ = {
      baseline:  { bias: 0,  noise: 0,  n: 80 },
      biased:    { bias: 18, noise: 5,  n: 80 },
      moreLabels:{ n: 300 }
    }[preset] || {};
    if('bias' in ADJ && $("#a-bias")) $("#a-bias").value = ADJ.bias;
        if('noise' in ADJ && $("#a-noise")) $("#a-noise").value = ADJ.noise;
        if('n' in ADJ && $("#a-n")) $("#a-n").value = ADJ.n;
    syncLabels(); evaluate();
  }
  else if(state.activeBench === "ifeval"){
    // map preset id -> fixture: good | miss(bad) | preamble
    const map = { good: "good", miss: "bad", preamble: "preamble" };
    const ans = MODEL.ifeval.fixtures[map[preset] || preset];
    const box = $("#i-answer");
    if(ans && box){ box.value = ans; }
    evaluate();
  }
  else if(state.activeBench === "questeval"){
    const tgt = MODEL.questeval.targets[preset] || MODEL.questeval.targets.full;
    const b = $("#q-target");
    if(b) b.value = tgt;   // source is a fixed reference card (not editable)
    evaluate();
  }
}

/* ============================ INPUT LISTENERS ============================ */

function bindDelegation(){
  $("#app").addEventListener("input", (e) => {
    const el = e.target;
    if(!el.dataset.field) return;
    if(state.activeBench === "ares"){
      const id = el.id;
      const v = $("#"+id+"-v");
      if(v) v.textContent = (el.id === "a-noise" || el.id === "a-true") ? el.value+"%" : el.value;
    }
    // live re-evaluate (cheap, deterministic) — instant, no animation
    evaluate(false);
  });

  $("#app").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if(!btn) return;
    const action = btn.dataset.action;
    if(action === "bench"){
      state.activeBench = btn.dataset.bench;
      state.runState = "idle";
      renderShell(); renderSim(); syncContract();
      loadDefault();
      announce(t("stepInput"));
    }
    else if(action === "lang"){
      const snap = captureInputs();
      state.lang = btn.dataset.lang;
      localStorage.setItem("deepSimLang", state.lang);
      renderShell(); renderSim(); syncContract();
      restoreInputs(snap);
      syncLabels();
      updateResults();
    }
    else if(action === "evaluate"){ evaluate(); }
    else if(action === "preset"){
      applyPreset(btn.dataset.preset);
      // refresh active highlight + change note without wiping inputs
      const specs = PRESET_SPECS[state.activeBench] || [];
      const active = state.activePreset[state.activeBench];
      $$(".preset").forEach(p => p.classList.toggle("active", p.dataset.preset === active));
      const note = $(".change-note");
      if(note){ const k = (specs.find(s=>s.id===active)||{}).change; note.innerHTML = `<strong>${t("changeTab")}</strong> ${k?t(k):""}`; }
    }
    else if(action === "toggle-calc"){ state.showCalc = !state.showCalc; evaluate(false); }
    else if(action === "term-clear"){ termReset(); }
    else if(action === "qa-toggle"){ state.showQa = !state.showQa; renderQa(); }
    else if(action === "ai"){ handleAi(); }
    else if(action === "ai-settings"){ openAiDialog(); }
  });
}

/* ============================ QA TESTS ============================ */

function runQaTests(){
  const tests = [];
  const pass = (name, ok, detail) => tests.push({ name, ok, detail: detail || "" });

  // 1. RAGAS: unsupported claim lowers faithfulness
  (() => {
    const f = MODEL.ragas.fixtures;
    const good = ragasEval({ question: f.good.question, context: f.good.context, answer: f.good.answer });
    const bad  = ragasEval({ question: f.halluc.question, context: f.halluc.context, answer: f.halluc.answer });
    pass("RAGAS: halucynacja obniża faithfulness",
      bad.faithfulness < good.faithfulness,
      `good=${good.faithfulness.toFixed(2)} bad=${bad.faithfulness.toFixed(2)}`);
  })();

  // 2. ARES: more human labels narrows CI
  (() => {
    const base = MODEL.ares.defaults;
    const low  = aresExperiment({ ...base, n: 30 });
    const high = aresExperiment({ ...base, n: 300 });
    const wLow = low.ci.hi - low.ci.lo, wHigh = high.ci.hi - high.ci.lo;
    pass("ARES: więcej human labels zwęża CI", wHigh < wLow,
      `w(n=30)=${wLow.toFixed(3)} w(n=300)=${wHigh.toFixed(3)}`);
  })();

  // 3. IFEval: good example scores higher instruction-level than bad example
  (() => {
    const cons = [
      { id: "includeTerms", enabled: true, value: MODEL.ifeval.include.join(";") },
      { id: "excludeTerms", enabled: true, value: MODEL.ifeval.exclude.join(";") }
    ];
    const good = ifevalEval(cons, MODEL.ifeval.fixtures.good);
    const bad  = ifevalEval(cons, MODEL.ifeval.fixtures.bad);
    pass("IFEval: dobry przykład wypada lepiej niż zły",
      good.strictInstr > bad.strictInstr,
      `good=${good.strictInstr.toFixed(2)} bad=${bad.strictInstr.toFixed(2)}`);
  })();

  // 4. IFEval: preamble before JSON distinguishes strict vs loose
  (() => {
    const cons = [{ id: "validJson", enabled: true, value: "" }];
    const r = ifevalEval(cons, MODEL.ifeval.fixtures.preamble);
    pass("IFEval: wstęp przed JSON rozróżnia strict i loose",
      r.strict[0].pass === false && r.loose[0].pass === true,
      `strict=${r.strict[0].pass} loose=${r.loose[0].pass}`);
  })();

  // 5. QuestEval: removing a fact lowers completeness
  (() => {
    const f = MODEL.questeval;
    const full = questevalEval(f.source, f.targets.full, f.facts);
    const miss = questevalEval(f.source, f.targets.missing, f.facts);
    pass("QuestEval: pominięty fakt obniża completeness",
      miss.completeness < full.completeness,
      `full=${full.completeness.toFixed(2)} miss=${miss.completeness.toFixed(2)}`);
  })();

  // 6. QuestEval: adding hallucination lowers faithfulness
  (() => {
    const f = MODEL.questeval;
    const full = questevalEval(f.source, f.targets.full, f.facts);
    const hall = questevalEval(f.source, f.targets.halluc, f.facts);
    pass("QuestEval: halucynacja obniża faithfulness",
      hall.faithfulness !== null && hall.faithfulness < full.faithfulness,
      `full=${full.faithfulness} hall=${hall.faithfulness}`);
  })();

  // 7. QuestEval: empty target must NOT silently pass with 100% faithfulness
  (() => {
    const f = MODEL.questeval;
    const empty = questevalEval(f.source, "", f.facts);
    pass("QuestEval: pusta odpowiedź zwraca n/d, nie 100%",
      empty.faithfulness === null,
      `faithfulness=${empty.faithfulness}`);
  })();

  // 8. QuestEval: unpaid claim "wymaga opłat" is NOT detected as the free-of-charge fact
  (() => {
    const f = MODEL.questeval;
    const r = questevalEval(f.source, "Usługa wymaga opłat.", f.facts);
    const f6 = r.backward.find(x => x.id === "f6");
    // f6 must NOT be present-match when the target says the service costs money
    const present = f6 !== undefined;
    pass("QuestEval: 'wymaga opłat' nie jest uznawane za fakt bezpłatności",
      !present,
      `f6 present=${present}`);
  })();

  // 9. ARES: human labels must never exceed the scored pool (n <= N)
  (() => {
    const r = aresExperiment({ ...MODEL.ares.defaults, N: 120, n: 300 });
    pass("ARES: liczba human labels nie przekracza puli (n<=N)",
      r.n <= r.N,
      `N=${r.N} n=${r.n}`);
  })();

  // 10. ARES: the dimension control must actually change the result (not be inert)
  (() => {
    const base = MODEL.ares.defaults;
    const cntx = aresExperiment({ ...base, dimension: "context" });
    const rel  = aresExperiment({ ...base, dimension: "relevance" });
    const same = aresExperiment({ ...base, dimension: "relevance" });
    pass("ARES: zmiana wymiaru zmienia wynik (kontrola nie jest martwa)",
      cntx.ppi !== rel.ppi && rel.ppi === same.ppi,
      `context=${cntx.ppi.toFixed(3)} relevance=${rel.ppi.toFixed(3)}`);
  })();

  // 11. RAGAS: mixed true+false claim in ONE sentence is decomposed into separate claims
  (() => {
    const r = ragasEval({
      question: "Jak założyć profil zaufany?",
      context: ["Profil zaufany wymaga wniosku."],
      answer: "Profil jest płatny i wymaga wniosku."
    });
    const unsupported = r.claims.filter(c => !c.supported);
    pass("RAGAS: prawda+falsz w jednym zdaniu dzieli się na twierdzenia",
      r.claims.length >= 2 && unsupported.length >= 1 && r.faithfulness < 0.99,
      `claims=${r.claims.length} faith=${r.faithfulness.toFixed(2)}`);
  })();

  // 12. IFEval: the good example now satisfies the full rubric, incl. free-of-charge term
  (() => {
    const cons = [
      { id: "includeTerms", enabled: true, value: MODEL.ifeval.include.join(";") },
      { id: "excludeTerms", enabled: true, value: MODEL.ifeval.exclude.join(";") }
    ];
    const good = ifevalEval(cons, MODEL.ifeval.fixtures.good);
    pass("IFEval: dobry przykład spełnia wszystkie warunki (w tym 'bez opłat')",
      good.strictInstr === 1,
      `strictInstr=${good.strictInstr.toFixed(2)}`);
  })();

  return tests;
}

function renderQa(){
  const root = $("#qa-root");
  if(!state.showQa){ root.innerHTML = ""; return; }
  const tests = runQaTests();
  const allPass = tests.every(x => x.ok);
  root.innerHTML = `
    <div class="qa-panel" data-qa-status="${allPass?'pass':'fail'}">
      <h2>${t("qaTitle")}</h2>
      ${tests.map(x => `
        <div class="qa-item ${x.ok?'pass':'fail'}">
          <span class="st">${x.ok?'PASS':'FAIL'}</span>
          <span>${esc(x.name)}</span>
          ${x.detail ? `<span style="color:var(--c-muted);font-size:11px">${esc(x.detail)}</span>` : ""}
        </div>`).join("")}
      <div style="margin-top:12px;font-weight:700;color:${allPass?'var(--c-pass)':'var(--c-fail)'}">
        ${allPass ? "✓ " + t("qaAllPass") : "✗ " + t("qaFail")}
      </div>
    </div>`;
}

/* ============================ KEYBOARD ============================ */

function bindKeyboard(){
  document.addEventListener("keydown", (e) => {
    if(e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT"){
      // allow Ctrl/Cmd+Enter to run
      if((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); evaluate(); }
      return;
    }
    const num = ["1","2","3","4"].indexOf(e.key);
    if(num >= 0){
      state.activeBench = BENCHES[num].id;
      state.runState = "idle";
      renderShell(); renderSim(); syncContract();
      loadDefault();
      announce(t("stepInput"));
    }
    else if(e.key === "Enter"){ e.preventDefault(); evaluate(); }
    else if(e.key === "r" || e.key === "R"){ applyPreset("good"); }
  });
}

/* ============================ INIT ============================ */

function init(){
  renderShell();
  renderSim();
  bindDelegation();
  bindKeyboard();
  syncContract();

  // seed initial inputs + results
  loadDefault();
  renderAiChip();

  // QA panel auto-open via ?qa=1
  if(new URLSearchParams(location.search).get("qa") === "1"){
    state.showQa = true;
    renderQa();
    $("#qa-toggle").textContent = t("qaToggle") + " (—)";
  }
}

init();
</script>
