<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BenchSim – interaktywny symulator ewaluacji RAG</title>
<link rel="icon" type="image/png" href="quantica-q-mark-black.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="quantica-q-mark-white.png" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600&amp;family=Poppins:wght@400;500;600;700&amp;family=Raleway:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{
  --c-page:#eeedf2;
  --c-page-deep:#e4e1e8;
  --c-surface:#ffffff;
  --c-surface-soft:#faf8fb;
  --c-surface-raised:#f6f2f6;
  --c-border:#ddd6df;
  --c-border-strong:#c7bcc9;
  --c-text:#18131a;
  --c-text-soft:#4c434e;
  --c-muted:#776c79;
  --c-accent:#d20757;
  --c-accent-hover:#a9064a;
  --c-accent-soft:#fdebf3;
  --c-positive:#15845f;
  --c-positive-soft:#e8f6f0;
  --c-negative:#b84450;
  --c-negative-soft:#fbecef;
  --c-warning:#a86c18;
  --c-warning-soft:#fff3dd;
  --c-info:#286f94;
  --c-info-soft:#eaf5fb;
  --c-violet:#6f56a6;
  --c-violet-soft:#f1ecfb;
  --c-amber:#a86c18;
  --c-amber-soft:#fff4df;
  --c-ink:#10151c;
  --c-ink-soft:#1a222d;
  --c-terminal-text:#d6dde7;
  --c-terminal-muted:#8290a2;
  --c-terminal-accent:#ff669e;
  --c-white:#ffffff;
  --c-overlay:rgba(24,19,26,.14);
  --c-backdrop:rgba(24,19,26,.5);
  --c-shadow:rgba(24,19,26,.08);
  --font-display:'Raleway','Poppins',system-ui,sans-serif;
  --font-sans:'Poppins',system-ui,sans-serif;
  --font-mono:'Geist Mono',ui-monospace,monospace;
  --fs-xs:.72rem;
  --fs-sm:.84rem;
  --fs-base:.96rem;
  --fs-md:1.05rem;
  --fs-lg:1.28rem;
  --fs-xl:1.7rem;
  --fs-2xl:2.15rem;
  --lh-tight:1.2;
  --lh-base:1.55;
  --align-start:left;
  --align-center:center;
  --space-1:.25rem;
  --space-2:.5rem;
  --space-3:.75rem;
  --space-4:1rem;
  --space-5:1.5rem;
  --space-6:2rem;
  --space-7:3rem;
  --radius-sm:.5rem;
  --radius:.75rem;
  --radius-lg:1rem;
  --radius-pill:999px;
  --shadow-sm:0 1px 2px var(--c-shadow);
  --shadow-md:0 12px 32px var(--c-shadow);
  --content-max:1600px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,var(--c-page),var(--c-page-deep));color:var(--c-text);font-family:var(--font-sans);font-size:var(--fs-base);line-height:var(--lh-base);min-height:100vh}
button,input{font:inherit}
button{color:inherit}
.app{width:100%;max-width:var(--content-max);margin:0 auto;padding:var(--space-5)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-5);margin-bottom:var(--space-5)}
.brand{display:flex;align-items:center;gap:var(--space-3);min-width:0}
.brand img{width:34px;height:34px;flex:0 0 auto}
.brand-copy{min-width:0}
.brand h1{font-family:var(--font-display);font-size:var(--fs-xl);line-height:var(--lh-tight);margin:0}
.brand p{color:var(--c-muted);font-size:var(--fs-sm);margin:var(--space-1) 0 0}
.top-actions{display:flex;align-items:center;gap:var(--space-2)}
.model-chip,.lang-group,.icon-button{border:1px solid var(--c-border);background:var(--c-surface);box-shadow:var(--shadow-sm)}
.model-chip{border-radius:var(--radius);padding:var(--space-2) var(--space-3);display:flex;align-items:center;gap:var(--space-2);font-size:var(--fs-sm);font-weight:600}
.model-dot{width:8px;height:8px;border-radius:50%;background:var(--c-positive);box-shadow:0 0 0 3px var(--c-positive-soft)}
.lang-group{display:flex;border-radius:var(--radius);padding:3px}
.lang-group button{border:0;background:transparent;border-radius:calc(var(--radius) - 3px);padding:var(--space-2) var(--space-3);cursor:pointer;font-size:var(--fs-sm);font-weight:700}
.lang-group button.active{background:var(--c-accent);color:var(--c-white)}

.tabs-wrap{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--c-page) 76%,transparent);padding:0 0 var(--space-4)}
.tabs{display:flex;gap:var(--space-2);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--c-border);background:var(--c-surface);border-radius:var(--radius);padding:var(--space-3) var(--space-4);display:flex;align-items:center;gap:var(--space-2);cursor:pointer;white-space:nowrap;font-family:var(--font-display);font-weight:700;box-shadow:var(--shadow-sm)}
.tab:hover{border-color:var(--c-accent)}
.tab.active{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-white)}
.tab-number{display:grid;place-items:center;width:20px;height:20px;border-radius:var(--radius-sm);background:var(--c-surface-raised);color:var(--c-muted);font-family:var(--font-mono);font-size:var(--fs-xs)}
.tab.active .tab-number{background:var(--c-overlay);color:var(--c-white)}

.method-shell{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);overflow:hidden}
.method-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-5);align-items:start;padding:var(--space-6);border-bottom:1px solid var(--c-border)}
.eyebrow{display:flex;align-items:center;gap:var(--space-2);color:var(--c-accent);font-size:var(--fs-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:var(--space-2)}
.eyebrow-dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.method-title{font-family:var(--font-display);font-size:var(--fs-2xl);line-height:var(--lh-tight);margin:0}
.method-answer{color:var(--c-text-soft);font-size:var(--fs-md);max-width:780px;margin:var(--space-3) 0 0}
.mode-note{min-width:260px;max-width:340px;background:var(--c-warning-soft);border:1px solid var(--c-warning);border-radius:var(--radius);padding:var(--space-3);font-size:var(--fs-sm)}
.mode-note strong{display:block;margin-bottom:var(--space-1)}

.preset-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);padding:var(--space-3) var(--space-6);background:var(--c-surface-soft);border-bottom:1px solid var(--c-border)}
.preset-set{display:flex;gap:var(--space-2);overflow-x:auto;scrollbar-width:none}
.preset-set::-webkit-scrollbar{display:none}
.preset{border:1px solid var(--c-border);background:var(--c-surface);border-radius:var(--radius-pill);padding:var(--space-2) var(--space-3);white-space:nowrap;cursor:pointer;font-size:var(--fs-sm);font-weight:600}
.preset.active{border-color:var(--c-accent);background:var(--c-accent-soft);color:var(--c-accent)}
.change-note{font-size:var(--fs-sm);color:var(--c-muted);text-align:var(--align-start)}
.change-note strong{color:var(--c-text)}

.canvas{padding:var(--space-6)}
.section-title{font-family:var(--font-display);font-size:var(--fs-lg);margin:0 0 var(--space-4)}
.section-kicker{color:var(--c-muted);font-size:var(--fs-sm);margin:-.6rem 0 var(--space-4)}
.card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-4)}
.soft-card{background:var(--c-surface-soft)}
.label{display:block;color:var(--c-muted);font-size:var(--fs-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:var(--space-2)}
.field{border:1px solid var(--c-border-strong);background:var(--c-white);border-radius:var(--radius-sm);padding:var(--space-3);font-family:var(--font-mono);font-size:var(--fs-sm);line-height:var(--lh-base)}
.status{display:inline-flex;align-items:center;gap:var(--space-1);border-radius:var(--radius-pill);padding:.22rem .55rem;font-size:var(--fs-xs);font-weight:700;white-space:nowrap}
.status.pass{background:var(--c-positive-soft);color:var(--c-positive)}
.status.fail{background:var(--c-negative-soft);color:var(--c-negative)}
.status.info{background:var(--c-info-soft);color:var(--c-info)}
.status.warn{background:var(--c-warning-soft);color:var(--c-warning)}
.method-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,.7fr);gap:var(--space-5);align-items:start}
.summary-rail{display:grid;gap:var(--space-3);position:sticky;top:78px}
.summary-card{border:1px solid var(--c-border);background:var(--c-surface-soft);border-radius:var(--radius);padding:var(--space-4)}
.summary-card h3{font-family:var(--font-display);font-size:var(--fs-md);margin:0}
.summary-card p{color:var(--c-muted);font-size:var(--fs-sm);margin:var(--space-2) 0 0}
.metric-value{font-family:var(--font-display);font-size:var(--fs-xl);line-height:var(--lh-tight);margin-top:var(--space-2)}
.ratio{font-family:var(--font-mono);color:var(--c-muted);font-size:var(--fs-xs);margin-top:var(--space-1)}
.neutral-track{height:8px;border-radius:var(--radius-pill);background:var(--c-surface-raised);overflow:hidden;margin-top:var(--space-3)}
.neutral-fill{height:100%;border-radius:inherit;background:var(--c-accent)}
.metric-group-label{font-size:var(--fs-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c-muted);margin:var(--space-2) 0 0}

.log-details{border-top:1px solid var(--c-border);background:var(--c-surface-soft)}
.log-details summary{cursor:pointer;padding:var(--space-4) var(--space-6);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);list-style:none}
.log-details summary::-webkit-details-marker{display:none}
.log-details summary::after{content:'+';font-family:var(--font-mono);font-size:var(--fs-lg);color:var(--c-accent)}
.log-details[open] summary::after{content:'−'}
.terminal{margin:0 var(--space-6) var(--space-6);background:var(--c-ink);color:var(--c-terminal-text);border-radius:var(--radius);padding:var(--space-4);font-family:var(--font-mono);font-size:var(--fs-sm);white-space:pre-wrap}
.terminal .muted{color:var(--c-terminal-muted)}
.terminal .accent{color:var(--c-terminal-accent)}

/* RAGAS */
.ragas-inputs{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-bottom:var(--space-5)}
.ragas-inputs .wide{grid-column:1 / -1}
.evidence-map{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr);gap:var(--space-3);align-items:stretch}
.evidence-column,.claims-column{display:grid;gap:var(--space-3)}
.fragment{position:relative;border:1px solid var(--c-border);border-left:4px solid var(--c-info);background:var(--c-info-soft);border-radius:var(--radius);padding:var(--space-3)}
.fragment.dimmed{border-left-color:var(--c-border-strong);background:var(--c-surface-soft);opacity:.72}
.fragment-head,.claim-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-bottom:var(--space-2)}
.fragment p,.claim p{font-size:var(--fs-sm);margin:0}
.match-words{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--c-info);margin-top:var(--space-2)}
.connectors{display:grid;align-content:space-around;color:var(--c-accent)}
.connector{display:flex;align-items:center}
.connector::before{content:'';height:2px;background:currentColor;flex:1}
.connector::after{content:'›';font-family:var(--font-display);font-size:var(--fs-xl);line-height:1}
.claim{border:1px solid var(--c-positive);background:var(--c-positive-soft);border-radius:var(--radius);padding:var(--space-3)}
.claim.unsupported{border-color:var(--c-negative);background:var(--c-negative-soft)}
.evidence-ref{display:flex;gap:var(--space-1);flex-wrap:wrap;margin-top:var(--space-2)}
.evidence-ref span{border-radius:var(--radius-pill);background:var(--c-white);padding:.18rem .45rem;font-size:var(--fs-xs);font-family:var(--font-mono)}

/* ARES */
.ares-workspace{display:grid;grid-template-columns:minmax(290px,.75fr) minmax(0,1.25fr);gap:var(--space-5)}
.control-groups{display:grid;gap:var(--space-3)}
.control-group{border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-4);background:var(--c-surface-soft)}
.control-group h3{font-family:var(--font-display);font-size:var(--fs-md);margin:0 0 var(--space-1)}
.control-group>p{color:var(--c-muted);font-size:var(--fs-xs);margin:0 0 var(--space-3)}
.slider-row{margin-top:var(--space-3)}
.slider-head{display:flex;justify-content:space-between;gap:var(--space-3);font-size:var(--fs-sm);font-weight:600}
.slider-head output{font-family:var(--font-mono);color:var(--c-accent)}
input[type=range]{width:100%;accent-color:var(--c-accent)}
.pool-card{border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-4)}
.pool-head{display:flex;justify-content:space-between;gap:var(--space-3);align-items:start;margin-bottom:var(--space-4)}
.pool-head h3{font-family:var(--font-display);font-size:var(--fs-md);margin:0}
.pool-head p{color:var(--c-muted);font-size:var(--fs-xs);margin:var(--space-1) 0 0}
.pool-dots{display:grid;grid-template-columns:repeat(20,1fr);gap:5px;margin-bottom:var(--space-4)}
.pool-dot{aspect-ratio:1;border-radius:50%;background:var(--c-info)}
.pool-dot.negative{background:var(--c-border-strong)}
.pool-dot.audited{box-shadow:0 0 0 2px var(--c-accent)}
.disagreement{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2)}
.disagreement div{border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:var(--space-2);font-size:var(--fs-xs);text-align:var(--align-center)}
.disagreement b{display:block;font-family:var(--font-display);font-size:var(--fs-lg)}
.numberline-card{border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-4);margin-top:var(--space-3)}
.numberline-card h3{font-family:var(--font-display);font-size:var(--fs-md);margin:0 0 var(--space-5)}
.numberline{position:relative;height:98px;margin:0 var(--space-3)}
.axis{position:absolute;left:0;right:0;top:42px;height:2px;background:var(--c-border-strong)}
.axis-tick{position:absolute;top:36px;width:1px;height:14px;background:var(--c-border-strong)}
.axis-label{position:absolute;top:56px;transform:translateX(-50%);font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--c-muted)}
.ci-band{position:absolute;top:33px;left:57%;width:22%;height:20px;border-radius:var(--radius-pill);background:var(--c-accent-soft);border:1px solid var(--c-accent)}
.point{position:absolute;top:30px;width:10px;height:26px;transform:translateX(-50%);border-radius:var(--radius-pill);background:var(--c-text)}
.point.raw{background:var(--c-amber);left:71.4%}
.point.ppi{background:var(--c-accent);left:68.1%}
.point.truth{background:var(--c-text);left:70%}
.point-label{position:absolute;transform:translateX(-50%);font-size:var(--fs-xs);font-weight:700;white-space:nowrap}
.point-label.truth{left:70%;top:0}
.point-label.raw{left:71.4%;top:74px;color:var(--c-amber)}
.point-label.ppi{left:68.1%;top:18px;color:var(--c-accent)}
.correction-callout{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);background:var(--c-accent-soft);border-radius:var(--radius);padding:var(--space-3);margin-top:var(--space-3)}
.correction-callout b{font-family:var(--font-display);font-size:var(--fs-lg);color:var(--c-accent)}

/* IFEVAL */
.prompt-card{background:var(--c-ink-soft);color:var(--c-terminal-text);border-radius:var(--radius);padding:var(--space-4);font-family:var(--font-mono);font-size:var(--fs-sm);margin-bottom:var(--space-5)}
.prompt-card .prompt-label{color:var(--c-terminal-accent);display:block;margin-bottom:var(--space-2)}
.overall-gate{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-4);align-items:center;border:1px solid var(--c-negative);background:var(--c-negative-soft);border-radius:var(--radius);padding:var(--space-4);margin-bottom:var(--space-4)}
.overall-gate h3{font-family:var(--font-display);font-size:var(--fs-lg);margin:0}
.overall-gate p{color:var(--c-text-soft);font-size:var(--fs-sm);margin:var(--space-1) 0 0}
.gate-chain{display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap;justify-content:flex-end}
.gate-node{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c-positive);color:var(--c-white);font-size:var(--fs-xs);font-weight:700}
.gate-node.fail{background:var(--c-negative)}
.gate-arrow{color:var(--c-muted)}
.constraint-table{border:1px solid var(--c-border);border-radius:var(--radius);overflow:hidden}
.constraint-row{display:grid;grid-template-columns:minmax(190px,1.2fr) minmax(150px,1fr) 90px 90px;align-items:center}
.constraint-row>div{padding:var(--space-3);border-top:1px solid var(--c-border);font-size:var(--fs-sm)}
.constraint-row.header{background:var(--c-surface-raised);font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.constraint-row.header>div{border-top:0}
.constraint-name{display:flex;align-items:start;gap:var(--space-2);font-weight:600}
.category-dot{width:9px;height:9px;border-radius:50%;margin-top:.38rem;flex:0 0 auto;background:var(--c-info)}
.category-dot.forbid{background:var(--c-amber)}
.category-dot.citation{background:var(--c-violet)}
.constraint-evidence{color:var(--c-muted);font-family:var(--font-mono);font-size:var(--fs-xs)!important}
.result-cell{text-align:var(--align-center)}
.four-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3);margin-top:var(--space-4)}
.mini-metric{border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-3);background:var(--c-surface-soft)}
.mini-metric span{color:var(--c-muted);font-size:var(--fs-xs)}
.mini-metric b{display:block;font-family:var(--font-display);font-size:var(--fs-lg);margin-top:var(--space-1)}

/* QUESTEVAL */
.text-pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);margin-bottom:var(--space-5)}
.text-card{border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-4);background:var(--c-surface-soft)}
.text-card p{font-family:var(--font-mono);font-size:var(--fs-sm);margin:0}
.scope-note{display:flex;align-items:center;gap:var(--space-2);color:var(--c-info);background:var(--c-info-soft);border-radius:var(--radius);padding:var(--space-3);font-size:var(--fs-sm);margin-bottom:var(--space-4)}
.qa-lanes{display:grid;gap:var(--space-4)}
.qa-lane{border:1px solid var(--c-border);border-radius:var(--radius);overflow:hidden}
.lane-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-3) var(--space-4);background:var(--c-surface-raised)}
.lane-head h3{font-family:var(--font-display);font-size:var(--fs-md);margin:0}
.lane-head span{font-size:var(--fs-xs);color:var(--c-muted)}
.qa-row{display:grid;grid-template-columns:minmax(220px,1.3fr) minmax(120px,.7fr) 34px minmax(120px,.7fr) 86px;align-items:center;padding:var(--space-3) var(--space-4);border-top:1px solid var(--c-border);gap:var(--space-2);font-size:var(--fs-sm)}
.qa-question{font-weight:600}
.qa-answer{font-family:var(--font-mono);font-size:var(--fs-xs);padding:var(--space-2);background:var(--c-surface-soft);border-radius:var(--radius-sm)}
.qa-arrow{text-align:var(--align-center);color:var(--c-accent);font-size:var(--fs-lg)}
.issue-row{background:var(--c-warning-soft)}
.quest-summary{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:var(--space-3);margin-top:var(--space-4)}
.balance-card{border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--space-4);background:var(--c-surface-soft)}
.balance-card.combined{border-color:var(--c-accent);background:var(--c-accent-soft)}
.balance-card span{color:var(--c-muted);font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.balance-card b{display:block;font-family:var(--font-display);font-size:var(--fs-xl);margin-top:var(--space-1)}
.balance-card p{color:var(--c-muted);font-size:var(--fs-xs);margin:var(--space-1) 0 0}

.footer{display:flex;justify-content:space-between;gap:var(--space-4);color:var(--c-muted);font-size:var(--fs-xs);padding:var(--space-4) var(--space-1)}

.input-label{display:block;color:var(--c-muted);font-size:var(--fs-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:var(--space-2)}
.actions{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-3)}
.button{border:1px solid var(--c-border-strong);background:var(--c-surface);border-radius:var(--radius);padding:.68rem .95rem;cursor:pointer;font-weight:700;font-size:var(--fs-sm)}
.button:hover{border-color:var(--c-accent);color:var(--c-accent)}
.button.primary{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-white)}
.button.primary:hover{background:var(--c-accent-hover);color:var(--c-white)}
.button:disabled{cursor:wait;opacity:.65}
.button-row-end{margin-left:auto}
.method-copy{overflow-wrap:anywhere}
.proxy-banner{display:flex;align-items:flex-start;gap:var(--space-2);background:var(--c-warning-soft);border:1px solid var(--c-warning);border-radius:var(--radius);padding:var(--space-3);font-size:var(--fs-sm);margin-bottom:var(--space-4)}
.source-note{font-size:var(--fs-xs);color:var(--c-muted);margin:calc(var(--space-2) * -1) 0 var(--space-4)}
.source-note a{color:var(--c-info);font-weight:700}
.method-head .source-note{margin:var(--space-1) 0 0}
.empty-state{border:1px dashed var(--c-border-strong);border-radius:var(--radius);padding:var(--space-5);color:var(--c-muted);text-align:var(--align-center)}
.metric-card[data-value="na"] .metric-value{color:var(--c-muted)}
.evidence-map[data-connection-mode="explicit"] .fragment[data-used="false"]{opacity:.68}
.evidence-link{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--c-accent);margin-top:var(--space-2)}
.connector-list{display:grid;align-content:center;gap:var(--space-3);font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--c-accent);text-align:center}
.select-control{width:100%;border:1px solid var(--c-border-strong);border-radius:var(--radius-sm);background:var(--c-white);color:var(--c-text);padding:.58rem .7rem}
.slider-row input{display:block;margin-top:var(--space-2)}
.pool-legend{display:flex;gap:var(--space-3);flex-wrap:wrap;font-size:var(--fs-xs);color:var(--c-muted);margin-top:var(--space-3)}
.legend-mark{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:var(--space-1);background:var(--c-info)}
.legend-mark.negative{background:var(--c-border-strong)}
.legend-mark.audited{background:var(--c-surface);box-shadow:0 0 0 2px var(--c-accent)}
.numberline{overflow:visible}
.axis-range{position:absolute;top:57px;font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--c-muted)}
.axis-range.end{right:0}
.axis-range.start{left:0}
.point-label{max-width:120px}
.ifeval-editor{display:grid;grid-template-columns:minmax(260px,.7fr) minmax(0,1.3fr);gap:var(--space-4);margin-bottom:var(--space-5)}
.constraint-list{display:grid;gap:var(--space-2)}
.constraint-chip{display:flex;align-items:flex-start;gap:var(--space-2);border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:var(--space-2);background:var(--c-surface-soft);font-size:var(--fs-xs)}

.result-cell::before{display:none;color:var(--c-muted);font-size:var(--fs-xs);font-weight:700;margin-right:var(--space-2)}
.qa-answer{overflow-wrap:anywhere}
.na-cell{color:var(--c-muted)}
.ai-result{border:1px solid var(--c-violet);background:var(--c-violet-soft);border-radius:var(--radius);padding:var(--space-4);margin-top:var(--space-4)}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.loading-dot{animation:none}}

@media(max-width:1050px){

}

  .mode-note{min-width:0;max-width:none}
  .preset-bar{display:block;padding:var(--space-3) var(--space-4)}
  .change-note{margin-top:var(--space-2)}
  .canvas{padding:var(--space-4)}
  .ragas-inputs,.text-pair{grid-template-columns:1fr}
  .ragas-inputs .wide{grid-column:auto}
  .evidence-map{grid-template-columns:1fr}
  .connectors{display:none}
  .summary-rail{grid-template-columns:1fr}
  .pool-dots{grid-template-columns:repeat(10,1fr)}
  .disagreement{grid-template-columns:1fr 1fr 1fr}
  .constraint-table{overflow:visible;border:0}
  .constraint-row.header{display:none}
  .constraint-row{grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--c-border);border-radius:var(--radius);margin-bottom:var(--space-2);overflow:hidden}
  .constraint-row>div{border-top:0}
  .constraint-name,.constraint-evidence{grid-column:1 / -1}

  .result-cell{border-top:1px solid var(--c-border)!important;background:var(--c-surface-soft)}
  .four-metrics{grid-template-columns:1fr 1fr}
  .overall-gate{grid-template-columns:1fr}
  .gate-chain{justify-content:flex-start}
  .qa-row{grid-template-columns:1fr 34px 1fr 78px}
  .qa-question{grid-column:1 / -1}
  .quest-summary{grid-template-columns:1fr 1fr}
  .balance-card.combined{grid-column:1 / -1}
  .log-details summary{padding:var(--space-4)}
  .terminal{margin:0 var(--space-4) var(--space-4)}
  .footer{display:block}
  .ifeval-editor{grid-template-columns:1fr}
  .result-cell::before{display:inline;content:attr(data-label)}
  .qa-checks{grid-template-columns:1fr}
  .footer-actions{margin-top:var(--space-2)}
  .button-row-end{margin-left:0}
}
</style>
</head>
<body>
<main class="app" id="app" data-active-bench="ragas" data-lang="pl" data-run-state="ready">
  <header class="topbar">
    <div class="brand">
      <img src="quantica-q-mark-black.png" alt="Quantica Lab">
      <div class="brand-copy">
        <h1>BenchSim</h1>
        <p data-t="appSubtitle"></p>
      </div>
    </div>
    <div class="top-actions">
      <button class="model-chip" id="ai-chip" data-action="ai-settings" type="button" aria-label="AI model settings">
        <span class="model-dot"></span>
        <span class="model-text">AI · optional</span>
      </button>
      <div class="lang-group" role="group" aria-label="Language">
        <button type="button" data-lang="pl">PL</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <div class="tabs-wrap">
    <nav class="tabs" id="tabs" aria-label="Evaluation methods"></nav>
  </div>

  <section id="method-root"></section>

  <section id="qa-root" hidden></section>

  <footer class="footer">

</main>

function renderRagas(){

// ─── Render: IFEval ───

}

function renderIfeval(){
  return `<article class="method-shell" data-method="ifeval">

// ─── Render: QuestEval ───

function qaRow(question,sourceAnswer,targetAnswer,pass,issue){
  return `<div class="qa-row ${issue ? "issue-row" : ""}"><div class="qa-question">${t(question)}</div><div class="qa-answer">${t(sourceAnswer)}</div><div class="qa-arrow">↔</div><div class="qa-answer">${t(targetAnswer)}</div><div>${status(pass)}</div></div>`;
}

function qaLane(titleKey,subtitleKey,rows){
  return `<section class="qa-lane"><div class="lane-head"><div><h3>${t(titleKey)}</h3><span>${t(subtitleKey)}</span></div><span>${t("showAll")}</span></div><div class="qa-row constraint-row header"><div>${t("qaQuestion")}</div><div>${t("sourceAnswer")}</div><div></div><div>${t("targetAnswer")}</div><div>${t("outcome")}</div></div>${rows}</section>`;
}

function renderQuestEval(){
  const forward = qaRow("qOnline","yesOnline","yesOnline",true,false)+qaRow("qConfirm","officeList","officeList",true,false)+qaRow("qCost","free","free",true,false);
  const backward = qaRow("qOnline","yesOnline","yesOnline",true,false)+qaRow("qConfirm","officeList","officeList",true,false)+qaRow("qApp","notFound","notFound",true,false);
  return `<article class="method-shell" data-method="questeval">
    ${methodHeader("QuestEval", "questQuestion")}
    ${presetBar("questChange")}
    <div class="canvas">
      <div class="text-pair"><section class="text-card"><span class="label">${t("source")}</span><p>Profil zaufany można założyć online. Należy złożyć wniosek i potwierdzić tożsamość. Usługa jest bezpłatna.</p></section><section class="text-card"><span class="label">${t("target")}</span><p>Profil zakłada się online. Wniosek potwierdza się w urzędzie, ZUS lub urzędzie skarbowym. Usługa jest bezpłatna.</p></section></div>
      <div class="scope-note"><span>ⓘ</span><span>${t("deterministicScope")}</span></div>
      <div class="qa-lanes">${qaLane("sourceToTarget","sourceToTargetSub",forward)}${qaLane("targetToSource","targetToSourceSub",backward)}</div>
      <div class="quest-summary"><div class="balance-card"><span>${t("completeness")}</span><b>100%</b><p>6 / 6</p></div><div class="balance-card"><span>${t("groundedness")}</span><b>100%</b><p>6 / 6</p></div><div class="balance-card combined"><span>${t("combined")}</span><b>100%</b><p>${t("balanceExplain")}</p></div></div>
    </div>
    ${logDetails("forward QA: 6/6 retained · backward QA: 6/6 grounded · F1: 100%")}
  </article>`;
}

// ─── Render ───

function renderShell(){
  document.documentElement.lang = state.lang;
  app.dataset.activeTool = state.activeTool;
  app.dataset.lang = state.lang;
  document.querySelectorAll("[data-t]").forEach(element => element.textContent = t(element.dataset.t));
  document.querySelectorAll("[data-lang]").forEach(button => button.classList.toggle("active",button.dataset.lang===state.lang));
  tabs.innerHTML = TOOLS.map(tool => `<button class="tab ${tool.id===state.activeTool ? "active" : ""}" type="button" data-tool="${tool.id}" aria-current="${tool.id===state.activeTool ? "page" : "false"}">${tool.label}<span class="tab-number">${tool.number}</span></button>`).join("");
}

function renderMethod(){
  const renders = { ragas:renderRagas, ares:renderAres, ifeval:renderIfeval, questeval:renderQuestEval };
  methodRoot.innerHTML = renders[state.activeTool]();
}

function render(){
  renderShell();
  renderMethod();
}

// ─── Listeners ───

document.addEventListener("click",event => {
  const toolButton = event.target.closest("[data-tool]");
  if(toolButton){
    state.activeTool = toolButton.dataset.tool;
    render();
    live.textContent = TOOLS.find(tool => tool.id===state.activeTool).label;
    return;
  }
  const presetButton = event.target.closest("[data-preset]");
  if(presetButton){
    state.activePreset[state.activeTool] = Number(presetButton.dataset.preset);
    render();
    live.textContent = presetButton.textContent;
    return;
  }
  const langButton = event.target.closest("[data-lang]");
  if(langButton){
    state.lang = langButton.dataset.lang;
    localStorage.setItem("suggestionsLang",state.lang);
    render();
  }
});

document.addEventListener("keydown",event => {
  if(event.target.matches("input,button")) return;
  const tool = TOOLS.find(item => item.number===event.key);
  if(tool){ state.activeTool = tool.id; render(); live.textContent = tool.label; }
});

// ─── Init ───

render();
</script>

const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g,char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const t = key => T[state.lang][key] ?? key;
const clamp = (value,min=0,max=1) => Math.max(min,Math.min(max,value));
const pct = value => value === null || !Number.isFinite(value) ? "N/A" : new Intl.NumberFormat(state.lang === "pl" ? "pl-PL" : "en-US",{style:"percent",maximumFractionDigits:1}).format(value);
const num = value => new Intl.NumberFormat(state.lang === "pl" ? "pl-PL" : "en-US",{maximumFractionDigits:1}).format(value);
const mean = values => values.length ? values.reduce((sum,value)=>sum+value,0)/values.length : 0;
const variance = values => values.length > 1 ? values.reduce((sum,value)=>sum+(value-mean(values))**2,0)/(values.length-1) : 0;
const announce = message => { live.textContent = ""; requestAnimationFrame(()=>{ live.textContent = message; }); };

function normText(value){
  return String(value ?? "").toLowerCase().replace(/ł/g,"l").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
}

const STOP_WORDS = new Set("a aby albo and are be czy do dla gdzie how i in is jak jest lub mozna na of po sie the to w with z za oraz można można".split(" "));
const STEMS = [
  [/^zaloz/,"zalozyc"],[/^zaklad/,"zalozyc"],[/^wniosk/,"wniosek"],[/^potwierdz/,"potwierdzic"],[/^tozsamosc/,"tozsamosc"],
  [/^urzed/,"urzad"],[/^skarbow/,"skarbowy"],[/^bezplat/,"bezplatny"],[/^profil/,"profil"],[/^internet/,"online"]
];

function tokens(value){
  return normText(value).split(/\s+/).filter(word => word.length > 2 && !STOP_WORDS.has(word)).map(word => {
    const match = STEMS.find(([pattern])=>pattern.test(word));
    return match ? match[1] : word;
  });
}

function unique(values){ return [...new Set(values)]; }
function overlap(left,right){ const set = new Set(right); return unique(left.filter(item=>set.has(item))); }
function phraseMatches(text,phrase){
  const haystack = ` ${tokens(text).join(" ")} `;
  const needle = ` ${tokens(phrase).join(" ")} `;
  return haystack.includes(needle);
}
function factPresent(text,fact){
  const hits = fact.accepted.filter(item=>phraseMatches(text,item)).length;
  return hits >= (fact.minMatches || 1);
}
function factEvidence(text,fact){ return fact.accepted.filter(item=>phraseMatches(text,item)).join(" · ") || t("notFound"); }
function mulberry32(seed){ return function(){ let value=seed+=0x6D2B79F5; value=Math.imul(value^value>>>15,value|1); value^=value+Math.imul(value^value>>>7,value|61); return ((value^value>>>14)>>>0)/4294967296; }; }
function clone(value){ return JSON.parse(JSON.stringify(value)); }

// ─── Evaluation engines ───

function splitClaims(answer){
  return String(answer).split(/[.!?;]+/).map(item=>item.trim()).filter(Boolean);
}

function evaluateRagas(values){
  const contexts = values.context.map(text=>({text,tokens:tokens(text)})).filter(item=>item.text.trim());
  const questionTokens = unique(tokens(values.question));
  const claims = splitClaims(values.answer).map((text,index)=>{
    const claimTokens = unique(tokens(text));
    const matches = contexts.map((context,contextIndex)=>({contextIndex,terms:overlap(claimTokens,context.tokens)}))
      .filter(match=>match.terms.length >= Math.min(2,Math.max(1,claimTokens.length)));
    return { index,text,tokens:claimTokens,matches,supported:matches.length>0 };
  });
  const fragments = contexts.map((context,index)=>{
    const claimIds = claims.filter(claim=>claim.matches.some(match=>match.contextIndex===index)).map(claim=>claim.index);
    const questionTerms = overlap(context.tokens,questionTokens);
    return { index,text:context.text,claimIds,questionTerms,useful:claimIds.length>0 || questionTerms.length>=2 };
  });
  const answerTokens = unique(tokens(values.answer));
  const covered = overlap(questionTokens,answerTokens);
  return {
    empty:!values.question.trim() || !values.answer.trim() || !contexts.length,
    fragments,claims,questionTokens,covered,
    contextRelevance:fragments.length ? fragments.filter(item=>item.useful).length/fragments.length : 0,
    faithfulness:claims.length ? claims.filter(item=>item.supported).length/claims.length : 0,
    answerRelevance:questionTokens.length ? covered.length/questionTokens.length : 0
  };
}

function evaluateAres(config){
  const N=Math.max(20,Math.round(config.N));
  const n=Math.min(N,Math.max(5,Math.round(config.n)));
  const profile={context:[.65,.75],faithfulness:[1,1],relevance:[1.25,1.35]}[config.dimension] || [1,1];
  const signedBias=clamp(config.bias/100*profile[0],-.95,.95);
  const noiseRate=clamp(config.noise/100*profile[1],0,.95);
  const trueRate=clamp(config.trueRate/100);
  const random=mulberry32(config.seed + N*3 + n*7 + Math.round(config.bias*11));
  const rows=Array.from({length:N},()=>{
    const truth=random()<trueRate?1:0;
    let judge=truth;
    if(random()<noiseRate) judge=1-judge;
    if(truth===0 && signedBias>0 && random()<signedBias) judge=1;
    if(truth===1 && signedBias<0 && random()<-signedBias) judge=0;
    return {truth,judge,audited:false};
  });
  const order=rows.map((_,index)=>index);
  for(let index=order.length-1;index>0;index--){ const other=Math.floor(random()*(index+1)); [order[index],order[other]]=[order[other],order[index]]; }
  const audited=order.slice(0,n); audited.forEach(index=>{rows[index].audited=true;});
  const raw=mean(rows.map(row=>row.judge));
  const differences=audited.map(index=>rows[index].truth-rows[index].judge);
  const correction=mean(differences);
  const ppi=clamp(raw+correction);
  const se=Math.sqrt(variance(rows.map(row=>row.judge))/N + variance(differences)/n);
  const stats={agreement:0,fp:0,fn:0};
  audited.forEach(index=>{ const row=rows[index]; if(row.truth===row.judge)stats.agreement++; else if(row.judge===1)stats.fp++; else stats.fn++; });
  const sample=rows.length<=100?rows:rows.filter((_,index)=>index%Math.ceil(rows.length/100)===0).slice(0,100);
  return {N,n,trueRate,raw,correction,ppi,se,ci:{lo:clamp(ppi-1.96*se),hi:clamp(ppi+1.96*se)},stats,sample,bias:signedBias,dimension:config.dimension};
}

function jsonCandidate(answer){
  const start=answer.indexOf("{"); const end=answer.lastIndexOf("}");
  return start>=0 && end>start ? answer.slice(start,end+1) : answer;
}

function checkIfeval(id,answer){
  const normalized=normText(answer);
  if(id==="json"){ try{JSON.parse(answer);return {pass:true,evidence:t("valid")};}catch(error){return {pass:false,evidence:t("invalid")};} }
  if(id==="online"){ const found=["online","internet"].find(term=>phraseMatches(answer,term)); return {pass:Boolean(found),evidence:found||t("notFound")}; }
  if(id==="request"){ const pass=/\bwnios\w*/.test(normalized); return {pass,evidence:pass?"wniosek":t("notFound")}; }
  if(id==="free"){ const found=["bezplatne","bezplatna","bezplatnie","bez oplat","free"].find(term=>phraseMatches(answer,term)); return {pass:Boolean(found),evidence:found||t("notFound")}; }
  if(id==="citations"){ const terms=["Dz.U. 2005 nr 64 poz. 565","Dz.U. 2020 poz. 1194"]; const count=terms.filter(term=>answer.includes(term)).length; return {pass:count===2,evidence:`${count}/2`}; }
  if(id==="delay"){ const pass=!phraseMatches(answer,"14 dni")&&!phraseMatches(answer,"14 days"); return {pass,evidence:pass?t("absent"):"14 dni"}; }
  if(id==="words"){ const count=answer.trim().split(/\s+/).filter(Boolean).length; return {pass:count<=80,evidence:`${count}/80`}; }
  return {pass:false,evidence:t("notFound")};
}

function evaluateIfeval(answer){
  const loose=jsonCandidate(answer.replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"").trim());
  const rows=IFEVAL_CONSTRAINTS.map(constraint=>{
    const strict=checkIfeval(constraint.id,answer);
    const relaxed=checkIfeval(constraint.id,loose);
    return {...constraint,strict,loose:relaxed};
  });
  const strictPass=rows.filter(row=>row.strict.pass).length;
  const loosePass=rows.filter(row=>row.loose.pass).length;
  return {rows,strictInstr:strictPass/rows.length,strictPrompt:strictPass===rows.length?1:0,looseInstr:loosePass/rows.length,loosePrompt:loosePass===rows.length?1:0,builtPrompt:buildIfevalPrompt()};
}

function buildIfevalPrompt(){
  const lines=IFEVAL_CONSTRAINTS.map((constraint,index)=>`${index+1}. ${t(constraint.label)}`);
  return `${state.lang==="pl"?"Wyjaśnij, jak założyć Profil Zaufany.":"Explain how to create a Trusted Profile."}\n${lines.join("\n")}`;
}

function evaluateQuest(values){
  const sourceFacts=QUEST_FACTS.filter(fact=>fact.origin==="source" && factPresent(values.source,fact));
  const forward=sourceFacts.map(fact=>({...fact,found:factPresent(values.target,fact),sourceEvidence:factEvidence(values.source,fact),targetEvidence:factEvidence(values.target,fact)}));
  const presentTarget=QUEST_FACTS.filter(fact=>factPresent(values.target,fact));
  const backward=presentTarget.map(fact=>({...fact,found:factPresent(values.source,fact),sourceEvidence:factEvidence(values.source,fact),targetEvidence:factEvidence(values.target,fact)}));
  const completeness=forward.length?forward.filter(fact=>fact.found).length/forward.length:null;
  const faithfulness=backward.length?backward.filter(fact=>fact.found).length/backward.length:null;
  const combined=completeness===null||faithfulness===null||completeness+faithfulness===0?null:2*completeness*faithfulness/(completeness+faithfulness);
  return {forward,backward,completeness,faithfulness,combined};
}

function renderAres(){
  const values=state.values.ares; const result=state.results.ares || evaluateAres(values);
  const meta={base:["aresBase","aresBaseChange"],biased:["aresBiased","aresBiasedChange"],labels:["aresLabels","aresLabelsChange"]};
  const dots=result.sample.map(row=>`<span class="pool-dot ${row.truth?"":"negative"} ${row.audited?"audited":""}" title="truth ${row.truth}; judge ${row.judge}; audited ${row.audited}"></span>`).join("");
  const biasWord=result.bias>0?t("overrates"):result.bias<0?t("underrates"):t("neutral");
  const point=(className,label,value,top)=>`<span class="point ${className}" style="left:${clamp(value)*100}%"></span><span class="point-label ${className}" style="left:${clamp(value)*100}%;top:${top}px">${label} ${pct(value)}</span>`;
  const log=`raw = mean(judge on N) = ${pct(result.raw)}\naudit correction = mean(human − judge on n) = ${result.correction>=0?"+":""}${pct(result.correction)}\nPPI proxy = clamp(raw + correction) = ${pct(result.ppi)}\nSE proxy = sqrt(var(judge)/N + var(human−judge)/n) = ${result.se.toFixed(4)}\n95% CI is illustrative, not an exact ARES confidence interval.`;
  return `<article class="method-shell" data-sim-id="ares" data-sim-state="${state.runState}" data-n-valid="${result.n<=result.N}">${methodHeader("ARES / PPI","aresQuestion")}${presetBar(Object.entries(meta).map(([id,item])=>({id,label:item[0]})),meta[state.preset.ares][1])}<div class="canvas"><div class="proxy-banner"><b>ⓘ</b><span>${t("proxy")}</span></div><div class="ares-workspace"><div class="control-groups"><section class="control-group"><h3>${t("population")}</h3><p>${t("populationHelp")}</p>${slider("N",t("examples"),100,1000,50,values.N)}${slider("trueRate",t("truthRate"),20,90,1,values.trueRate,"%")}</section><section class="control-group"><h3>${t("judge")}</h3><p>${t("judgeHelp")}</p><label class="input-label" for="a-dimension">${t("dimension")}</label><select class="select-control" id="a-dimension" data-ares-control><option value="context" ${values.dimension==="context"?"selected":""}>Context relevance</option><option value="faithfulness" ${values.dimension==="faithfulness"?"selected":""}>Faithfulness</option><option value="relevance" ${values.dimension==="relevance"?"selected":""}>Answer relevance</option></select>${slider("bias",`${t("bias")} · ${biasWord}`,-25,25,1,values.bias,"%")}${slider("noise",t("noise"),0,30,1,values.noise,"%")}</section><section class="control-group"><h3>${t("audit")}</h3><p>${t("auditHelp")}</p>${slider("n",t("labels"),5,values.N,5,Math.min(values.n,values.N))}</section><div class="actions"><button class="button primary" data-action="evaluate">${t("run")}</button></div></div><div><section class="pool-card"><div class="pool-head"><div><h3>${t("pool")}</h3><p>${t("poolNote")}</p></div><span class="status info">n=${result.n} / N=${result.N}</span></div><div class="pool-dots" data-pool-size="${result.sample.length}">${dots}</div><div class="pool-legend"><span><i class="legend-mark"></i>${t("positive")}</span><span><i class="legend-mark negative"></i>${t("negative")}</span><span><i class="legend-mark audited"></i>${t("audited")}</span></div><div class="disagreement"><div><span>${t("agreement")}</span><b>${result.stats.agreement}</b></div><div><span>${t("fp")}</span><b>${result.stats.fp}</b></div><div><span>${t("fn")}</span><b>${result.stats.fn}</b></div></div></section><section class="numberline-card"><h3>${t("calibrated")}</h3><div class="numberline" data-ci-valid="${result.ci.lo<=result.ppi&&result.ppi<=result.ci.hi}"><div class="axis"></div><span class="axis-range start">0%</span><span class="axis-range end">100%</span><span class="ci-band" style="left:${result.ci.lo*100}%;width:${(result.ci.hi-result.ci.lo)*100}%"></span>${point("truth",t("truth"),result.trueRate,0)}${point("raw",t("raw"),result.raw,74)}${point("ppi",t("ppi"),result.ppi,18)}</div><div class="correction-callout"><span>${t("correction")}</span><b>${result.correction>=0?"+":""}${pct(result.correction)}</b></div><p class="ratio">${t("ci")}: ${pct(result.ci.lo)} – ${pct(result.ci.hi)}</p></section></div></div></div>${logDetails(log)}</article>`;
}

function renderIfeval(){
  const values=state.values.ifeval; const result=state.results.ifeval || evaluateIfeval(values.answer);
  const meta={good:["ifevalGood","ifevalGoodChange"],miss:["ifevalMiss","ifevalMissChange"],preamble:["ifevalPreamble","ifevalPreambleChange"]};
  const rows=result.rows.map((row,index)=>`<div class="constraint-row" data-constraint="${row.id}" data-strict="${row.strict.pass}" data-loose="${row.loose.pass}"><div class="constraint-name"><span class="category-dot ${row.id==="delay"?"forbid":row.id==="citations"?"citation":""}"></span>${index+1}. ${t(row.label)}</div><div class="constraint-evidence">${escapeHtml(row.strict.evidence)}</div><div class="result-cell" data-label="${t("strict")}">${status(row.strict.pass)}</div><div class="result-cell" data-label="${t("loose")}">${status(row.loose.pass)}</div></div>`).join("");
  const all=result.strictPrompt===1; const passed=result.rows.filter(row=>row.strict.pass).length;
  const chain=result.rows.map((row,index)=>`<span class="gate-node ${row.strict.pass?"":"fail"}" title="${escapeHtml(t(row.label))}">${index+1}</span>${index<result.rows.length-1?`<span class="gate-arrow">∧</span>`:""}`).join("");
  const metrics=[["instrStrict",result.strictInstr],["promptStrict",result.strictPrompt],["instrLoose",result.looseInstr],["promptLoose",result.loosePrompt]];
  const log=`strict instruction = ${passed}/${result.rows.length}\nstrict prompt = AND(${result.rows.map(row=>row.strict.pass?1:0).join(",")}) = ${result.strictPrompt}\nloose candidate = substring from first { to last }\nloose prompt = ${result.loosePrompt}\nLoose mode here is an explicit teaching proxy, not the full official IFEval transformation set.`;
  return `<article class="method-shell" data-sim-id="ifeval" data-sim-state="${state.runState}" data-prompt-pass="${all}">${methodHeader("IFEval","ifevalQuestion")}${presetBar(Object.entries(meta).map(([id,item])=>({id,label:item[0]})),meta[state.preset.ifeval][1])}<div class="canvas"><div class="proxy-banner"><b>ⓘ</b><span>${t("proxy")}</span></div><div class="ifeval-editor"><section><span class="input-label">${t("builtPrompt")}</span><pre class="prompt-card method-copy">${escapeHtml(result.builtPrompt)}</pre></section><section><label for="i-answer" class="input-label">${t("response")}</label><textarea class="field-control" id="i-answer" rows="10">${escapeHtml(values.answer)}</textarea><div class="actions"><button class="button primary" data-action="evaluate">${t("run")}</button></div></section></div><section class="overall-gate" style="border-color:${all?"var(--c-positive)":"var(--c-negative)"};background:${all?"var(--c-positive-soft)":"var(--c-negative-soft)"}"><div><h3>${all?t("promptPass"):t("promptFail")}</h3><p>${passed}/${result.rows.length}. ${t("allMust")}</p></div><div class="gate-chain">${chain}</div></section><div class="constraint-table"><div class="constraint-row header"><div>${t("constraint")}</div><div>${t("evidence")}</div><div>${t("strict")}</div><div>${t("loose")}</div></div>${rows}</div><div class="four-metrics">${metrics.map(([label,value])=>`<div class="mini-metric" data-metric="${label}" data-value="${value}"><span>${t(label)}</span><b>${pct(value)}</b></div>`).join("")}</div></div>${logDetails(log)}</article>`;
}

function qaRow(fact,direction){
  const sourceEvidence=fact.sourceEvidence || t("notFound");
  const targetEvidence=fact.targetEvidence || t("notFound");
  return `<div class="qa-row ${fact.found?"":"issue-row"}" data-fact="${fact.id}" data-found="${fact.found}"><div class="qa-question">${t(fact.question)}</div><div class="qa-answer">${escapeHtml(sourceEvidence)}</div><div class="qa-arrow">→</div><div class="qa-answer ${fact.found?"":"na-cell"}">${escapeHtml(targetEvidence)}</div><div>${status(fact.found)}</div></div>`;
}

function qaLane(title,subtitle,rows,empty=false){
  return `<section class="qa-lane"><div class="lane-head"><div><h3>${t(title)}</h3><span>${t(subtitle)}</span></div><span>${rows.length}</span></div><div class="qa-row constraint-row header"><div>${t("qaQuestion")}</div><div>${t("sourceAnswer")}</div><div></div><div>${t("targetAnswer")}</div><div>${t("outcome")}</div></div>${rows.length?rows.map(row=>qaRow(row,title==="forward"?"forward":"backward")).join(""):`<div class="empty-state">${empty?t("noClaims"):t("notFound")}</div>`}</section>`;
}

function renderQuest(){
  const values=state.values.questeval; const result=state.results.questeval || evaluateQuest(values);
  const meta={full:["questFull","questFullChange"],missing:["questMissing","questMissingChange"],halluc:["questHalluc","questHallucChange"]};
  const ratio=(score,rows)=>score===null?"N/A":`${rows.filter(row=>row.found).length}/${rows.length}`;
  const log=`forward completeness = ${ratio(result.completeness,result.forward)}\nbackward faithfulness = ${ratio(result.faithfulness,result.backward)}\ncombined harmonic mean = ${pct(result.combined)}\nOnly claims in the declared closed fact set can be detected.`;
  return `<article class="method-shell" data-sim-id="questeval" data-sim-state="${state.runState}" data-combined="${result.combined===null?"na":result.combined.toFixed(4)}">${methodHeader("QuestEval","questQuestion")}${presetBar(Object.entries(meta).map(([id,item])=>({id,label:item[0]})),meta[state.preset.questeval][1])}<div class="canvas"><div class="proxy-banner"><b>ⓘ</b><span>${t("proxy")}</span></div><div class="text-pair"><label class="text-card"><span class="input-label">${t("source")}</span><textarea class="field-control" id="q-source" rows="6">${escapeHtml(values.source)}</textarea></label><label class="text-card"><span class="input-label">${t("target")}</span><textarea class="field-control" id="q-target" rows="6">${escapeHtml(values.target)}</textarea></label></div><div class="actions" style="margin-top:calc(var(--space-4) * -1);margin-bottom:var(--space-4)"><button class="button primary" data-action="evaluate">${t("run")}</button></div><div class="scope-note"><span>ⓘ</span><span>${t("scope")}</span></div><div class="qa-lanes">${qaLane("forward","forwardSub",result.forward)}${qaLane("backward","backwardSub",result.backward,true)}</div><div class="quest-summary">${metricCard(t("completeness"),result.completeness,ratio(result.completeness,result.forward))}${metricCard(t("groundedness"),result.faithfulness,ratio(result.faithfulness,result.backward))}<div class="balance-card combined" data-value="${result.combined===null?"na":result.combined.toFixed(4)}"><span>${t("combined")}</span><b>${pct(result.combined)}</b><p>${result.combined===null?t("noClaims"):"F1 = 2 × C × F / (C + F)"}</p></div></div></div>${logDetails(log)}</article>`;
}

// ─── Render ───

function evaluateActive(announceResult=true){
  captureInputs(); state.runState="evaluated";
  if(state.activeBench==="ragas") state.results.ragas=evaluateRagas(state.values.ragas);
  if(state.activeBench==="ares") state.results.ares=evaluateAres(state.values.ares);
  if(state.activeBench==="ifeval") state.results.ifeval=evaluateIfeval(state.values.ifeval.answer);
  if(state.activeBench==="questeval") state.results.questeval=evaluateQuest(state.values.questeval);
  renderMethod(); if(announceResult) announce(t("updated"));
}

function renderShell(){
  document.documentElement.lang=state.lang; app.dataset.activeBench=state.activeBench; app.dataset.lang=state.lang; app.dataset.runState=state.runState;
  document.querySelector(".brand-copy p").textContent=t("appSubtitle");
  document.querySelectorAll("[data-lang]").forEach(button=>button.classList.toggle("active",button.dataset.lang===state.lang));
  tabs.innerHTML=BENCHES.map(bench=>`<button class="tab ${bench.id===state.activeBench?"active":""}" type="button" role="tab" data-action="bench" data-bench="${bench.id}" aria-selected="${bench.id===state.activeBench}">${bench.name}<span class="tab-number">${bench.number}</span></button>`).join("");
  document.querySelector("#footer-note").textContent=t("footer"); document.querySelector("#shortcuts-note").textContent=t("shortcuts"); document.querySelector("#qa-toggle").textContent=state.showQa?t("qaHide"):t("qaShow");
}

function renderMethod(){
  const renderers={ragas:renderRagas,ares:renderAres,ifeval:renderIfeval,questeval:renderQuest};
  methodRoot.innerHTML=renderers[state.activeBench](); app.dataset.runState=state.runState; renderQa();
}

function runQaTests(){
  const good=evaluateRagas(RAGAS_PRESETS.good), halluc=evaluateRagas(RAGAS_PRESETS.halluc);
  const ares=evaluateAres({...state.values.ares,N:100,n:500});
  const goodIf=evaluateIfeval(IFEVAL_ANSWER_GOOD), preamble=evaluateIfeval(IFEVAL_ANSWER_PREAMBLE);
  const full=evaluateQuest({source:QUEST_SOURCE,target:QUEST_TARGET_FULL});
  const missing=evaluateQuest({source:QUEST_SOURCE,target:QUEST_TARGET_FULL.replace("Usługa jest bezpłatna.","")});
  const hallucQuest=evaluateQuest({source:QUEST_SOURCE,target:`${QUEST_TARGET_FULL} Aplikacja mObywatel jest wymagana.`});
  const empty=evaluateQuest({source:QUEST_SOURCE,target:""});
  return [
    ["RAGAS: hallucination lowers faithfulness",halluc.faithfulness<good.faithfulness],
    ["RAGAS: every evidence reference exists",good.claims.every(claim=>claim.matches.every(match=>Boolean(good.fragments[match.contextIndex])))],
    ["ARES: n is clamped to N",ares.n===ares.N],
    ["ARES: PPI lies inside displayed CI",ares.ci.lo<=ares.ppi&&ares.ppi<=ares.ci.hi],
    ["IFEval: good answer passes all four metrics",goodIf.strictPrompt===1&&goodIf.loosePrompt===1],
    ["IFEval: preamble differs strict vs loose",preamble.strictPrompt===0&&preamble.loosePrompt===1],
    ["QuestEval: missing fact lowers completeness",missing.completeness<full.completeness],
    ["QuestEval: hallucination lowers faithfulness",hallucQuest.faithfulness<full.faithfulness],
    ["QuestEval: empty target is N/A",empty.faithfulness===null&&empty.combined===null]
  ].map(([name,pass])=>({name,pass}));
}

function renderQa(){
  state.qa=runQaTests(); qaRoot.hidden=!state.showQa;
  if(!state.showQa){qaRoot.innerHTML="";return;}
  qaRoot.innerHTML=`<div class="qa-panel" data-tests-total="${state.qa.length}" data-tests-passed="${state.qa.filter(test=>test.pass).length}"><h2>${t("qaTitle")}</h2><div class="qa-checks">${state.qa.map(test=>`<div class="qa-check" data-test-pass="${test.pass}"><span>${escapeHtml(test.name)}</span>${status(test.pass)}</div>`).join("")}</div></div>`;
}

function render(){ renderShell(); renderMethod(); }

// ─── Presets ───

function applyPreset(id){
  state.preset[state.activeBench]=id; state.runState="preset";
  if(state.activeBench==="ragas") state.values.ragas=clone(RAGAS_PRESETS[id]);
  if(state.activeBench==="ares"){
    const presets={base:{N:500,n:40,bias:0,noise:10,trueRate:70,dimension:"faithfulness",seed:37},biased:{N:500,n:60,bias:18,noise:10,trueRate:70,dimension:"faithfulness",seed:37},labels:{N:500,n:200,bias:18,noise:10,trueRate:70,dimension:"faithfulness",seed:37}};
    state.values.ares=clone(presets[id]);
  }
  if(state.activeBench==="ifeval") state.values.ifeval.answer={good:IFEVAL_ANSWER_GOOD,miss:IFEVAL_ANSWER_MISS,preamble:IFEVAL_ANSWER_PREAMBLE}[id];
  if(state.activeBench==="questeval"){
    const targets={full:QUEST_TARGET_FULL,missing:QUEST_TARGET_FULL.replace("Usługa jest bezpłatna.",""),halluc:`${QUEST_TARGET_FULL} Aplikacja mObywatel jest wymagana.`};
    state.values.questeval={source:QUEST_SOURCE,target:targets[id]};
  }
  if(state.activeBench==="ragas") state.results.ragas=evaluateRagas(state.values.ragas);
  if(state.activeBench==="ares") state.results.ares=evaluateAres(state.values.ares);
  if(state.activeBench==="ifeval") state.results.ifeval=evaluateIfeval(state.values.ifeval.answer);
  if(state.activeBench==="questeval") state.results.questeval=evaluateQuest(state.values.questeval);
  renderMethod(); announce(t("updated"));
}

function openLocalDialog(){
  aiDialog.innerHTML=`<h2>${t("aiTitle")}</h2><p>${t("aiBody")}</p><div class="actions"><button class="button primary button-row-end" id="ai-close" type="button">${t("close")}</button></div>`;
  aiDialog.showModal(); document.querySelector("#ai-close").addEventListener("click",()=>aiDialog.close(),{once:true});
}

// ─── Listeners ───

document.addEventListener("click",event=>{
  const action=event.target.closest("[data-action]");
  if(action){
    if(action.dataset.action==="bench"){ captureInputs(); state.activeBench=action.dataset.bench; state.runState="ready"; render(); announce(BENCHES.find(bench=>bench.id===state.activeBench).name); }
    if(action.dataset.action==="preset") applyPreset(action.dataset.preset);
    if(action.dataset.action==="evaluate") evaluateActive();
    if(action.dataset.action==="ai-settings") openLocalDialog();
    return;
  }
  const language=event.target.closest("[data-lang]");
  if(language){ captureInputs(); state.lang=language.dataset.lang; localStorage.setItem("coSimLang",state.lang); state.results={}; render(); announce(t("ready")); }
});

document.addEventListener("input",event=>{
  if(!event.target.closest("#method-root")) return;
  if(event.target.matches("[data-ares-control]")){
    const key=event.target.id.replace("a-","");
    const output=document.querySelector(`#${event.target.id}-out`);
    if(output) output.textContent=`${num(event.target.value)}${["bias","noise","trueRate"].includes(key)?"%":""}`;
    if(key==="N"){
      const labels=document.querySelector("#a-n");
      if(labels){ labels.max=event.target.value; labels.value=Math.min(Number(labels.value),Number(event.target.value)); }
    }
  }
});

document.addEventListener("change",event=>{
  if(event.target.matches("[data-ares-control]")){ captureInputs(); state.results.ares=evaluateAres(state.values.ares); renderMethod(); announce(t("updated")); }
});

document.querySelector("#qa-toggle").addEventListener("click",()=>{ state.showQa=!state.showQa; renderShell(); renderQa(); });

document.addEventListener("keydown",event=>{
  const editing=event.target.matches("input,textarea,select,button") || event.target.isContentEditable;
  if((event.ctrlKey||event.metaKey)&&event.key==="Enter"){ event.preventDefault(); evaluateActive(); return; }
  if(editing) return;
  const bench=BENCHES.find(item=>item.number===event.key);
  if(bench){ state.activeBench=bench.id; state.runState="ready"; render(); announce(bench.name); return; }
  if(event.key.toLowerCase()==="r"){
    const orders={ragas:["good","noise","halluc"],ares:["base","biased","labels"],ifeval:["good","miss","preamble"],questeval:["full","missing","halluc"]};
    const order=orders[state.activeBench]; const next=order[(order.indexOf(state.preset[state.activeBench])+1)%order.length]; applyPreset(next);
  }
});

// ─── Init ───

state.results.ragas=evaluateRagas(state.values.ragas);
state.results.ares=evaluateAres(state.values.ares);
state.results.ifeval=evaluateIfeval(state.values.ifeval.answer);
state.results.questeval=evaluateQuest(state.values.questeval);
render();
</script>
</body>
