<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BenchSim – symulatory ewaluacji LLM</title>
<link rel="icon" type="image/png" href="quantica-q-mark-black.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="quantica-q-mark-white.png" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500&family=Poppins:wght@400;600&family=Raleway:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --c-page:#eeedf2;
  --c-page-deep:#e4e1e8;
  --c-surface:#ffffff;
  --c-border:#ddd6df;
  --c-text:#18131a;
  --c-text-soft:#4c434e;
  --c-muted:#776c79;
  --c-accent:#d20757;
  --c-shadow:rgba(24,19,26,.08);
  --font-display:'Raleway','Poppins',system-ui,sans-serif;
  --font-sans:'Poppins',system-ui,sans-serif;
  --font-mono:'Geist Mono',ui-monospace,monospace;
  --fs-xs:.72rem;
  --fs-sm:.84rem;
  --fs-base:.96rem;
  --fs-2xl:2.15rem;
  --radius:.75rem;
  --radius-lg:1rem;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;padding:1.5rem;background:linear-gradient(180deg,var(--c-page),var(--c-page-deep));color:var(--c-text);font-family:var(--font-sans);font-size:var(--fs-base);line-height:1.55}
header{text-align:center}
header img{width:44px;height:44px}
h1{font-family:var(--font-display);font-size:var(--fs-2xl);margin:.5rem 0 .25rem}
header p{margin:0;color:var(--c-muted);font-size:var(--fs-sm)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(240px,320px));gap:1rem}
.card{display:block;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:1.25rem 1.4rem;text-decoration:none;color:inherit;box-shadow:0 1px 3px var(--c-shadow);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--c-accent);transform:translateY(-2px)}
.card .tag{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--c-accent);text-transform:uppercase;letter-spacing:.08em}
.card h2{font-family:var(--font-display);font-size:1.28rem;margin:.35rem 0 .3rem}
.card p{margin:0;color:var(--c-text-soft);font-size:var(--fs-sm)}
footer{color:var(--c-muted);font-size:var(--fs-xs)}
@media(max-width:768px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <img src="quantica-q-mark-black.png" alt="Quantica Lab">
  <h1>BenchSim</h1>
  <p>symulatory metod ewaluacji LLM i RAG</p>
</header>
<nav class="cards" aria-label="Symulatory">
  <a class="card" href="sim.html">
    <span class="tag">symulator</span>
    <h2>BenchSim</h2>
    <p>Interaktywny symulator trzech benchmarków: RAGAS, IFEval i QuestEval, z edytowalnymi danymi i śladem dowodowym.</p>
  </a>
  <a class="card" href="ragas_lite.html">
    <span class="tag">przewodnik</span>
    <h2>RAGAS Lite</h2>
    <p>Wizualny przewodnik po ocenie RAG: krok po kroku, na jednym przykładzie.</p>
  </a>
</nav>
<footer>Quantica Lab</footer>
</body>
</html>
